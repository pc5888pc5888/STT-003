name: Include legal preview public asset
on:
  push:
    branches: [preview/legal-mortgage-20260923-r2]
    paths: [.github/workflows/legal-mortgage-public-assets.yml]
permissions:
  contents: write
jobs:
  include:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/legal-mortgage-20260923-r2
      - name: Copy exact inspected workbench into public output
        run: |
          test "$(sha256sum legal-mortgage-preview/site/index.html | cut -d ' ' -f 1)" = '643883ea23eba6293e731dd9e973824a556cbe833f416194b521a9609673bb89'
          mkdir -p public/legal-mortgage-preview/site
          if [ -f public/legal-mortgage-preview/site/index.html ]; then
            cmp legal-mortgage-preview/site/index.html public/legal-mortgage-preview/site/index.html
          else
            cp legal-mortgage-preview/site/index.html public/legal-mortgage-preview/site/index.html
          fi
      - name: Save only isolated preview public asset
        run: |
          git config user.name 'STT preview assembly'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/legal-mortgage-preview/site/index.html
          git diff --cached --quiet || git commit -m 'Serve inspected legal preview from Vite public directory [skip ci]'
          git push origin HEAD:preview/legal-mortgage-20260923-r2
