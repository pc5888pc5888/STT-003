name: Mirror Humanistic interview into STT Vercel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-humanistic-interview.yml
      - public/humanistic-interview/stt-mobile-bridge.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    if: ${{ !contains(github.event.head_commit.message, '[mirror-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download live approved Humanistic page and station artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/humanistic-interview/assets/stations
          curl --fail --location --retry 4 --retry-delay 2 \
            -A 'Mozilla/5.0 STT-Governance-Mirror/1.0' \
            'https://shimmering-longma-509244.netlify.app/' \
            -o /tmp/humanistic.html
          test -s /tmp/humanistic.html
          grep -Fq '人文地景產' /tmp/humanistic.html
          grep -Fq 'humanistic-20q' /tmp/humanistic.html

          for n in 01 02 03 04 05; do
            curl --fail --location --retry 4 --retry-delay 2 \
              -A 'Mozilla/5.0 STT-Governance-Mirror/1.0' \
              "https://shimmering-longma-509244.netlify.app/assets/stations/station-${n}.png" \
              -o "public/humanistic-interview/assets/stations/station-${n}.png"
            test -s "public/humanistic-interview/assets/stations/station-${n}.png"
          done

      - name: Patch only the submission transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('/tmp/humanistic.html')
          s=p.read_text(encoding='utf-8')
          before=s

          replacements = [
              ("fetch('/',{method:'POST'", "fetch('/api/humanistic-submit',{method:'POST'"),
              ("fetch('/', {method:'POST'", "fetch('/api/humanistic-submit', {method:'POST'"),
              ('fetch("/",{method:"POST"', 'fetch("/api/humanistic-submit",{method:"POST"'),
              ('fetch("/", {method:"POST"', 'fetch("/api/humanistic-submit", {method:"POST"'),
          ]
          for old,new in replacements:
              s=s.replace(old,new)

          bridge='<link rel="stylesheet" href="/humanistic-interview/stt-mobile-bridge.css">'
          if bridge not in s:
              if '</head>' not in s:
                  raise SystemExit('Humanistic page is missing </head>; cannot attach STT presentation bridge')
              s=s.replace('</head>', bridge+'</head>', 1)

          return_link='<a class="stt-return-home" href="/" aria-label="返回 STT Governance 首頁">← STT</a>'
          if return_link not in s:
              s=s.replace('<header class="topbar">', '<header class="topbar">'+return_link, 1)

          # Netlify HUD belongs to the source host, not the governed STT mirror.
          s=re.sub(r'<script[^>]+src=["\']/.netlify/scripts/hud[^>]*></script>\s*', '', s, flags=re.I)

          s=s.replace(
              '<form id="netlify-form" name="humanistic-20q" method="POST"',
              '<form id="netlify-form" name="humanistic-20q" method="POST" action="/api/humanistic-submit"'
          )
          s=s.replace(
              '<form name="humanistic-20q" method="POST"',
              '<form name="humanistic-20q" method="POST" action="/api/humanistic-submit"'
          )

          s=s.replace(
              "if(stored && email && location.protocol!=='file:') mailResult=await sendEmailBackup();",
              "if(stored && email && location.protocol!=='file:') mailResult={ok:true,delivery:'server-receipt'};"
          )

          s=s.replace(
              "msg.textContent='你的回答已送出，備份郵件也已寄出。';",
              "msg.textContent='你的回答已送出，聯絡 Email 已一併收件。';"
          )
          s=s.replace(
              "er.textContent=`備份已寄到 ${email}；你也可以在此再下載一份文字備份。`;",
              "er.textContent=`系統已記錄 ${email} 作為聯絡信箱；你也可以在此下載一份文字備份。`;"
          )

          root_post_variants = [
              "fetch('/',{method:'POST'",
              "fetch('/', {method:'POST'",
              'fetch("/",{method:"POST"',
              'fetch("/", {method:"POST"',
          ]
          if any(v in s for v in root_post_variants):
              raise SystemExit('Root POST transport still present; fail closed')
          if "mailResult=await sendEmailBackup()" in s:
              raise SystemExit('Duplicate backup submit path still active; fail closed')
          if '/api/humanistic-submit' not in s:
              raise SystemExit('Vercel submit endpoint absent after patch')
          if s == before:
              raise SystemExit('No submit transport was patched; fail closed')

          Path('public/humanistic-interview/index.html').write_text(s,encoding='utf-8')
          print('mirrored bytes', len(s.encode('utf-8')))
          PY

      - name: Reapply mandatory privacy controls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_humanistic_privacy.py
          grep -Fq '文字送出後，本網站不保留您輸入的文字。' public/humanistic-interview/index.html
          grep -Fq 'function purgeSubmittedData()' public/humanistic-interview/index.html
          grep -Fq "result.delivery!=='resend-email'" public/humanistic-interview/index.html
          ! grep -Fq 'localStorage' public/humanistic-interview/index.html
          grep -Fq '/api/humanistic-submit' public/humanistic-interview/index.html

      - name: Commit mirrored page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Humanistic Mirror'
          git config user.email 'actions@users.noreply.github.com'
          git add public/humanistic-interview/index.html public/humanistic-interview/assets/stations
          git commit -m 'fix: Humanistic interview transport + privacy recovery [mirror-skip]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
