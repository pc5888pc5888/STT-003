name: Verify Humanistic production delivery

on:
  push:
    branches: [main]
    paths:
      - public/humanistic-interview/index.html
      - api/humanistic-submit.ts
      - .github/workflows/verify-humanistic-production-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: humanistic-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for governed production transport
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            page=$(curl -fsSL https://stt-003.vercel.app/humanistic-interview/ || true)
            api=$(curl -fsSL https://stt-003.vercel.app/api/humanistic-submit || true)
            if printf '%s' "$page" | grep -Fq "/api/humanistic-submit" \
              && printf '%s' "$page" | grep -Fq "resend-email" \
              && printf '%s' "$api" | grep -Fq '"resendConfigured":true'; then
              echo 'production form wiring and provider configuration visible'
              exit 0
            fi
            sleep 5
          done
          echo 'production did not expose the Humanistic submission transport in time'
          exit 1

      - name: Submit one synthetic interview journey
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --data-urlencode 'form-name=humanistic-20q'
            --data-urlencode 'participant_name=STT 系統驗證 20260917'
            --data-urlencode 'participant_company=Humanistic E2E Test'
            --data-urlencode 'participant_email=stt-test@example.com'
            --data-urlencode 'consent=accepted'
          )
          for i in $(seq -w 1 20); do args+=(--data-urlencode "q${i}=[STT SYSTEM TEST ${i}] 系統測試資料，請忽略。"); done
          r=$(curl -fsS -X POST https://stt-003.vercel.app/api/humanistic-submit \
            -H 'Content-Type: application/x-www-form-urlencoded' "${args[@]}")
          echo "$r"
          echo "$r" | grep -Fq '"ok":true'
          echo "$r" | grep -Fq '"delivery":"resend-email"'
          echo "$r" | grep -Fq '"receiptId":"HUM-'
