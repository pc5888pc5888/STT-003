name: Dual-site convergence audit
on:
  push:
    branches: [stt-convergence-20260923]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: stt
            ref: stt-convergence-20260923
            routes: '/,/problems,/how-stt-works,/engagement,/insights,/about,/eric-chuang,/institutions,/start,/privacy,/professional-boundary,/research,/books'
          - site: gcsda
            ref: gcsda-g6-knowledge-events-20260923
            routes: '/,/about,/governance,/council,/membership,/events,/knowledge,/announcements,/privacy'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact source snapshot
        run: |
          mkdir -p /tmp/convergence-evidence
          git rev-parse HEAD > /tmp/convergence-evidence/source-sha.txt
          git ls-tree -r -l HEAD > /tmp/convergence-evidence/source-tree.txt
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed={'.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.md','.txt','.css','.html','.xml','.yml','.yaml','.toml','.svg','.csv','.example'}
          with zipfile.ZipFile('/tmp/convergence-evidence/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  p=pathlib.Path(f)
                  if p.is_file() and p.suffix in allowed and p.stat().st_size < 3000000:
                      z.write(p,f)
          PY
      - name: Dependencies and build
        run: |
          npm ci > /tmp/convergence-evidence/install.log 2>&1
          npm run lint > /tmp/convergence-evidence/typecheck.log 2>&1 || echo 'Typecheck failed; see log' >> /tmp/convergence-evidence/check-status.txt
          npm run build > /tmp/convergence-evidence/build.log 2>&1
      - name: Install browser verifier
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright > /tmp/convergence-evidence/browser-install.log 2>&1
          npx playwright install --with-deps chromium > /tmp/convergence-evidence/browser-setup.log 2>&1
      - name: Browser verification (no form submission)
        env:
          QA_ROUTES: ${{ matrix.routes }}
          QA_SITE: ${{ matrix.site }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/convergence-evidence/preview.log 2>&1 &
          cat > .convergence-browser-audit.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          const browser=await chromium.launch({headless:true});
          const report={site:process.env.QA_SITE,source:fs.readFileSync('/tmp/convergence-evidence/source-sha.txt','utf8').trim(),pages:[]};
          const sizes=[['desktop',1440,1000],['tablet',820,1180],['mobile',390,844]];
          for (const [device,width,height] of sizes) {
            const context=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});
            const page=await context.newPage();
            for (const route of process.env.QA_ROUTES.split(',')) {
              const errors=[];
              const onError=e=>errors.push(e.message);
              page.on('pageerror',onError);
              try {
                await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle',timeout:30000});
                await page.evaluate(()=>document.fonts.ready);
                const data=await page.evaluate(()=>({title:document.title,lang:document.documentElement.lang,h1:[...document.querySelectorAll('h1')].map(n=>n.textContent),overflow:document.documentElement.scrollWidth>innerWidth+1,description:document.querySelector('meta[name="description"]')?.content,canonical:document.querySelector('link[rel="canonical"]')?.href,text:document.body.innerText,brokenImages:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),links:[...document.querySelectorAll('a[href]')].map(a=>({text:a.textContent.trim(),href:a.getAttribute('href')})),fields:[...document.querySelectorAll('input,textarea,select')].map(i=>({tag:i.tagName,type:i.type,name:i.name,id:i.id}))}));
                const violations=device==='desktop'?(await new AxeBuilder({page}).analyze()).violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})):[];
                const file=process.env.QA_SITE+'-'+(route==='/'?'home':route.slice(1).replaceAll('/','-'))+'-'+device+'.png';
                await page.screenshot({path:'/tmp/convergence-evidence/'+file,fullPage:true});
                report.pages.push({route,device,...data,violations,errors,screenshot:file});
              } catch(e) {report.pages.push({route,device,error:String(e),errors});}
              page.off('pageerror',onError);
              fs.writeFileSync('/tmp/convergence-evidence/browser-report.json',JSON.stringify(report,null,2));
            }
            await context.close();
          }
          await browser.close();
          JS
          node .convergence-browser-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convergence-${{ matrix.site }}-${{ github.run_number }}
          path: /tmp/convergence-evidence/
          retention-days: 7
