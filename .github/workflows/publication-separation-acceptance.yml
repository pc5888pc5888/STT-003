name: Publication separation acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publication-separation-acceptance.yml
      - scripts/publication-separation-qa.py
      - scripts/publication-cover-qa.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stt-publication-separation-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate unchanged accepted questionnaire and original article fields
        run: |
          set -euo pipefail
          mkdir -p qa-publication-separation
          git fetch --depth=1 origin 06c460c8fe84c81ff3184e93167b1c02ae5887f8
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          expected={'public/humanistic-interview/index.html':'6b0ad4acf014f3dbfda2397f2b7db5597290b677','public/humanistic-interview/interview.js':'4fb411cb3a72806f6eb5a57923778f18b78448c8'}
          for name,expected_sha in expected.items():
            raw=Path(name).read_bytes()
            actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            assert actual==expected_sha,name
          original=json.loads(subprocess.check_output(['git','show','06c460c8fe84c81ff3184e93167b1c02ae5887f8:public/data/mmedia-catalog.json'],text=True))
          current=json.loads(Path('public/data/mmedia-catalog.json').read_text())
          records={a['id']:a for a in current['articles']}
          assert len(records)==len(current['articles']),'Duplicate source article ids'
          for article in original['articles']:
            assert records.get(article['id'])==article,'Original article changed: '+article['id']
          evidence={'original_records':len(original['articles']),'current_records':len(records),'original_records_preserved':True,'current_synced_at':current.get('syncedAt'),'timestamp_is_not_article_content':True}
          Path('qa-publication-separation/source-preservation.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2))
          print('Accepted questionnaire and all original article fields unchanged; sync timestamp may advance')
          PY
          git diff --exit-code 06c460c8fe84c81ff3184e93167b1c02ae5887f8 HEAD -- api public/humanistic-interview public/books src/styles/interview-entry-navigation.css
      - name: Build and validate publication data
        run: |
          npm ci > qa-publication-separation/npm-ci.log 2>&1
          npm run build > qa-publication-separation/build.log 2>&1
          npx tsx -e "import {WORKS,BOOKS,SERIES,sourceLabel} from './src/data/contentRegistry.ts'; import source from './public/data/mmedia-catalog.json'; import assert from 'node:assert/strict'; for(const a of source.articles){const w=WORKS.find(x=>x.id===a.id);assert(w);for(const k of ['title','excerpt','date','author','category','series'])assert.equal(w[k],a[k]);assert.equal(w.sources[0].url,a.url)} assert.equal(BOOKS.length,4);assert.equal(BOOKS.filter(x=>x.previewUrl).length,2);assert.equal(sourceLabel({publisher:'Verified alternate publisher',url:'https://example.org/',relation:'external'}),'外部發表／第三方媒體 · Verified alternate publisher'); console.log('PASS all original fields, four books, two existing links and source-independent labels');" > qa-publication-separation/catalog-contract.log 2>&1
      - name: Type check
        run: npm run lint > qa-publication-separation/typecheck.log 2>&1
      - name: Install open-source Chromium on this standard runner
        run: |
          python3 -m pip install playwright==1.57.0 pillow > qa-publication-separation/install.log 2>&1
          python3 -m playwright install --with-deps chromium >> qa-publication-separation/install.log 2>&1
      - name: Verify actual canonical pages and accepted entry without submissions
        run: python3 scripts/publication-separation-qa.py
      - name: Verify each cover after scrolling and decoding and check existing reading URLs
        run: python3 scripts/publication-cover-qa.py
      - name: Verify tests did not modify tracked sources
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-separation-verification
          path: qa-publication-separation/
          retention-days: 7
