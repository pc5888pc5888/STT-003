name: Audit exact Humanistic source hashes

on:
  push:
    branches:
      - fix/humanistic-publish-exact-v2-20260912
    paths:
      - .audit/TRIGGER_HUMANISTIC_SHA

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/humanistic-publish-exact-v2-20260912
          fetch-depth: 1
      - name: Find exact approved original PNGs already in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          cat > /tmp/targets.tsv <<'EOF'
HL20Q-JOURNEY-001	c817e9cb64a00aedb85fb87121140d266864aee7cb736c6f26db3b0204685ac7	今天_不急著介紹你自己.png
HL20Q-JOURNEY-002	2b0d9b330bd47b0017adf6d6ae52b99bf847b837254cdcb6f5415c9a0794eb05	第一站_今天_什麼都不用趕.png
HL20Q-JOURNEY-003	2e5a514bb115706301e6269402bc8b05469c710dffd6926b3ce0dd2abe734206	旅途中收到任務卡.png
HL20Q-JOURNEY-004	eabec9bf159b5de86f4239b6d497cced373eb566378176c7b7c7728f81e35e4d	第三站_下一班_是時間列車.png
HL20Q-JOURNEY-005	453d477d7c2edb1da7000e42d4f0ef225efe48f60bf0d6d3d7bf25de36b0e508	回頭看看_走向真正的自己.png
HL20Q-JOURNEY-006	9f7e99da16b2d5e355f6fab9967df29d10319cb361c1f2b890724e2e2f4a0d8e	城市暫時交給您_人文地景提問旅程.png
HL20Q-JOURNEY-007	fe8e2a0fe79ee529a5957ae731ed067ad5dcfa4880f65347f5e68626157f4e15	離開以前的記憶提問誌.png
HL20Q-JOURNEY-008	da4454c1d58476e451d4c2a653ce60efc2760d18b32c28078b1444c7688a18bf	謝謝你的信任_慢慢打開心門.png
HL20Q-JOURNEY-009	7e1fc8d6011a32b0a53e4f25e6bc5ff9371f6ac1e8d50d0665072486e3b5d71b	很漂亮的一次分享.png
HL20Q-JOURNEY-010	bc330799efd56fb0143b301c975410d16945595425c96efc95a98dae40f348d5	最後一步_送出此刻的你.png
HL20Q-STATION-001	aa283614dab98aa6a18a67a87fa1140dcc9b077faabfb17a41ec56c50910e88b	慢慢走回自己.png
HL20Q-STATION-002	a371375fcaadcdf61ac260308ce88330598d5556e51b91f8c80f6d56080c964e	故事帶路的旅行札記.png
HL20Q-STATION-003	4f5d618dda11a98d9a9c5a1af02468b56e7ff8ec02757860d547108192ee5208	第三站_時間列車.png
HL20Q-STATION-004	c06a062b27bcaf277ea31c86cfd38db2f986590fdcf50f6bdb211b2e88caf012	第四站_把城市暫時交給你.png
HL20Q-STATION-005	1d3507d4b41467af402cbcbceb709e0befae09bd38eb219b01a5b7bd53ca256e	珍藏時光的第五站.png
EOF
          find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -not -path './.git/*' -print0 | xargs -0 sha256sum > /tmp/repo-sha.txt
          {
            echo 'Exact Humanistic original-source SHA-256 audit'
            echo
            while IFS=$'\t' read -r id sha filename; do
              echo "## $id | $filename"
              grep -F "$sha" /tmp/repo-sha.txt || echo 'NO EXACT SHA MATCH'
              echo
            done < /tmp/targets.tsv
          } > .audit/humanistic-exact-sha.txt
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "STT Source Audit"
          git config user.email "actions@users.noreply.github.com"
          git add .audit/humanistic-exact-sha.txt
          git commit -m "audit: record exact Humanistic source matches [skip ci]" || exit 0
          git push origin HEAD:fix/humanistic-publish-exact-v2-20260912
