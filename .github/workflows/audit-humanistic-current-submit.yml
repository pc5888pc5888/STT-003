name: Audit Current Humanistic Submit Path

on:
  push:
    branches: [fix/stt-current-uploaded-visuals-20260914]
    paths:
      - .github/workflows/audit-humanistic-current-submit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Netlify page and submission wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import urljoin
          import re

          root='https://shimmering-longma-509244.netlify.app/'
          headers={'User-Agent':'Mozilla/5.0 STT-Governance-Audit/1.0'}

          def get(url):
              req=Request(url,headers=headers)
              try:
                  with urlopen(req,timeout=40) as r:
                      body=r.read()
                      print(f'GET {url} -> {r.status} {r.geturl()} content-type={r.headers.get("content-type")} bytes={len(body)}')
                      return r.status, r.geturl(), body, dict(r.headers)
              except HTTPError as e:
                  body=e.read()
                  print(f'GET {url} -> HTTP {e.code} bytes={len(body)}')
                  return e.code, url, body, dict(e.headers)
              except URLError as e:
                  print(f'GET {url} -> ERROR {e}')
                  return 0, url, b'', {}

          status, final, body, h=get(root)
          text=body.decode('utf-8','replace')
          print('\n=== RELEVANT ROOT MARKUP ===')
          pats=[r'<title>.*?</title>',r'<form\b[^>]*>',r'<input\b[^>]*(?:form-name|name=)[^>]*>',r'<script\b[^>]*src=[^>]*>',r'action=["\'][^"\']+["\']',r'data-netlify(?:-[a-z-]+)?(?:=["\'][^"\']*["\'])?']
          for pat in pats:
              for m in re.finditer(pat,text,re.I|re.S):
                  print(re.sub(r'\s+',' ',m.group(0))[:1000])
          print('\n=== RELEVANT REFERENCES ===')
          for line in text.splitlines():
              if re.search(r'humanistic|20q|netlify|send-backup|submit|form-name|success|fetch\(',line,re.I):
                  print(line[:2000])

          print('\n=== SAME-ORIGIN SCRIPTS ===')
          for src in re.findall(r'<script\b[^>]*src=["\']([^"\']+)["\']',text,re.I):
              url=urljoin(final,src)
              st,fu,b,_=get(url)
              js=b.decode('utf-8','replace')
              for m in re.finditer(r'.{0,220}(?:humanistic|20q|netlify|send-backup|submit|form-name|success|fetch\().{0,360}',js,re.I|re.S):
                  print(re.sub(r'\s+',' ',m.group(0))[:1500])

          print('\n=== ENDPOINT PROBES ===')
          for path in ('api/send-backup','.netlify/functions/send-backup','success','success.html'):
              st,fu,b,_=get(urljoin(root,path))
              print(b[:800].decode('utf-8','replace'))
          PY
