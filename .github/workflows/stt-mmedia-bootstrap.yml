name: STT Verified Column Baseline
on:
  push:
    branches: [rebuild/stt-approved-white-gold-v1]
    paths: [.github/workflows/stt-mmedia-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stt-mmedia-catalog
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/stt-approved-white-gold-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify the exact uploaded source fields
        run: |
          pip -q install beautifulsoup4==4.13.4
          python scripts/mmedia_bootstrap.py
      - name: Persist only the verified column catalog
        run: |
          git config user.name "STT Column Index"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/mmedia-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: preserve verified 212-column baseline"
          git push origin HEAD:rebuild/stt-approved-white-gold-v1
      - uses: actions/upload-artifact@v4
        with:
          name: stt-verified-column-catalog
          path: public/data/mmedia-catalog.json
          retention-days: 7
