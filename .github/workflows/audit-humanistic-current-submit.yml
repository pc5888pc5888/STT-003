name: Audit Current Humanistic Submit Path

on:
  push:
    branches: [fix/stt-current-uploaded-visuals-20260914]
    paths:
      - .github/workflows/audit-humanistic-current-submit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Netlify page and submission wiring
        shell: bash
        run: |
          set -u
          root='https://shimmering-longma-509244.netlify.app'
          echo '=== ROOT ==='
          curl -sS -L --connect-timeout 20 --max-time 120 -D /tmp/root.headers "$root/" -o /tmp/index.html || true
          head -40 /tmp/root.headers || true
          echo '--- title / forms / scripts / actions ---'
          grep -Eio '<title>[^<]*|<form[^>]*>|name=["'"'][^"'"']+["'"']|action=["'"'][^"'"']+["'"']|data-netlify[^ >]*|src=["'"'][^"'"']+["'"']' /tmp/index.html | head -200 || true
          echo '--- relevant inline references ---'
          grep -Ein 'humanistic|20q|netlify|send-backup|submit|fetch\(|form-name|success|function' /tmp/index.html | head -200 || true

          echo '=== SAME-ORIGIN SCRIPT REFERENCES ==='
          grep -Eo 'src=["'"'][^"'"']+["'"']' /tmp/index.html | sed -E 's/^src=["'"']|["'"']$//g' | while read -r src; do
            case "$src" in
              http*) url="$src" ;;
              /*) url="$root$src" ;;
              *) url="$root/$src" ;;
            esac
            echo "--- $url ---"
            curl -sS -L --connect-timeout 20 --max-time 120 "$url" -o /tmp/script.js || true
            grep -Eio '.{0,140}(humanistic|20q|netlify|send-backup|submit|fetch\(|form-name|success|function).{0,220}' /tmp/script.js | head -120 || true
          done

          for path in '/api/send-backup' '/.netlify/functions/send-backup' '/success' '/success.html'; do
            echo "=== GET $path ==="
            curl -sS -L --connect-timeout 20 --max-time 60 -o /tmp/body -D /tmp/headers -w 'FINAL_STATUS=%{http_code} FINAL_URL=%{url_effective}\n' "$root$path" || true
            head -20 /tmp/headers || true
            head -c 1200 /tmp/body || true
            echo
          done
