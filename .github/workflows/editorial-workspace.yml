name: Prepare editorial workspace
on:
  push:
    branches: [stt-convergence-20260923]
    paths: [.github/workflows/editorial-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: stt
            ref: ef7904776ca0652a396085fb42852977f3707f38
          - site: gcsda
            ref: ab3aa9410c22044ebe60798919ef7af8604a33c0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bundle source, dependencies and active art only
        run: |
          mkdir -p /tmp/editorial
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          files=[]
          for folder in ['src','api','tests','node_modules']:
              files.extend(p for p in Path(folder).rglob('*') if p.is_file())
          files.extend(p for p in Path('.').glob('*') if p.suffix in ['.json','.ts','.html','.js'])
          with zipfile.ZipFile('/tmp/editorial/source-deps.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in files:z.write(p)
          assets=[]
          for p in Path('public').rglob('*'):
              if not p.is_file():continue
              name=str(p)
              if p.suffix.lower() in ['.png','.webp','.jpg','.jpeg','.svg']:
                  if any(s in name for s in ['user-approved-six/','originals-20260910/','primary-semantic/','visual-bank/gcsda/','images/','cooperation-hero-20260917','eric-chuang-hero-20260917','portrait-read','portrait-open','STT-Press-Seal']):assets.append(p)
              elif p.suffix.lower() not in ['.woff','.woff2','.ttf','.otf'] and p.stat().st_size<5000000:assets.append(p)
          group=0;size=0;z=zipfile.ZipFile('/tmp/editorial/art-0.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1)
          for p in assets:
              if size+p.stat().st_size>240000000:
                  z.close();group+=1;size=0;z=zipfile.ZipFile('/tmp/editorial/art-'+str(group)+'.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1)
              z.write(p);size+=p.stat().st_size
          z.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-source-${{ matrix.site }}
          path: /tmp/editorial/source-deps.zip
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-art-${{ matrix.site }}-0
          path: /tmp/editorial/art-0.zip
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-art-${{ matrix.site }}-1
          path: /tmp/editorial/art-1.zip
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-art-${{ matrix.site }}-2
          path: /tmp/editorial/art-2.zip
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
