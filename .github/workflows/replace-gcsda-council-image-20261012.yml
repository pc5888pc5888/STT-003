name: Replace GCSDA council member image 20261012
on:
  push:
    branches: [gcsda-release-20261005]
    paths: ['.github/workflows/replace-gcsda-council-image-20261012.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gcsda-release-20261005
      - name: Replace only the council member image
        env:
          IMAGE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-ad84-8209-8440-6a383fd83783/raw?se=2026-10-12T15%3A55%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=0ef3053b-ebab-55ad-954e-f86272d048b5&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A22%3A10Z&ske=2026-10-13T01%3A22%3A10Z&sks=b&skv=2026-02-06&sig=PCLTrqoIYmwUZ7woqZAjxu2W/JTTikiRBVhIR1m%2BDzQ%3D"
        run: |
          python3 - <<'PY'
          import hashlib, os, struct, urllib.request
          from pathlib import Path
          u = os.environ['IMAGE_URL']
          b = urllib.request.urlopen(u, timeout=60).read()
          assert hashlib.sha256(b).hexdigest() == 'ac6c81de615e3ea0657f96640bb520bd084e023f6a88407b9063ab5611c960c6'
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', b[16:24]) == (2048, 1152)
          Path('public/images/gcsda-council-approved-background-1672.png').write_bytes(b)
          PY
          git diff --check
      - name: Commit exact replacement only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/gcsda-council-approved-background-1672.png
          git rm .github/workflows/replace-gcsda-council-image-20261012.yml
          git commit -m 'asset: replace GCSDA council member image with owner-uploaded image'
          git push origin HEAD:gcsda-release-20261005
