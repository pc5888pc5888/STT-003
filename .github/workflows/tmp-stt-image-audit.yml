name: Temporary STT Food-Only Verification
on:
  push:
    branches: [fix/stt-food-only-20260911]
    paths: ['.github/workflows/tmp-stt-image-audit.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build existing website
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Start local production build
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 >/tmp/stt-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/stt-preview.log
          exit 1
      - name: Verify requested STT work and all existing links
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix /tmp/stt-browser --no-save playwright
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/test_fullbleed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-food-only-evidence
          path: fullbleed-evidence/
          retention-days: 3
