name: Temporary STT Final 25 Restructure
on:
  push:
    branches: [rebuild/stt-25-visuals-final-20260911]
    paths:
      - .github/workflows/tmp-stt-final25-restructure.yml
permissions:
  contents: write
jobs:
  restructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unify shell, route heroes, and secondary page layout
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/App.tsx'); s=p.read_text()
          s=s.replace('  const exactHome = location.pathname === "/" || location.pathname === "/index.html";\n','')
          home='  if (exactHome) return <div className="min-h-screen" style={{ background: "#fbfaf7", color: "var(--stt-ink)" }}><main>{children}</main><AccessibilityWidget onChatOpen={onChatToggle} isChatOpen={chatOpen} /></div>;\n\n'
          s=s.replace(home,'')
          s=s.replace('<main className="min-h-[60vh]">{children}</main>','<main className="stt-master-scope min-h-[60vh]">{children}</main>')
          p.write_text(s)

          p=Path('src/pages/ProblemDetail.tsx'); s=p.read_text()
          s=s.replace('import RouteArtwork from "../components/RouteArtwork";','import STTPageHero from "../components/STTPageHero";\nimport { PROBLEM_VISUALS } from "../sttVisuals";')
          old='<section className="pd4-hero stt-route-hero"><div className="pd4-wrap stt-route-hero-grid"><div className="stt-route-hero-copy"><div className="pd4-eyebrow">{cfg.en}</div><h1>{cfg.title}</h1><p>{cfg.lead}</p><button className="pd4-back" onClick={()=>navigate(\'/problems\')}>← 回到問題入口</button></div><RouteArtwork /></div></section>'
          new='<STTPageHero visual={PROBLEM_VISUALS[id]} eyebrow={cfg.en} title={cfg.title} lead={cfg.lead}><button className="pd4-back" onClick={()=>navigate(\'/problems\')}>← 回到問題入口</button></STTPageHero>'
          if old not in s: raise SystemExit('ProblemDetail hero target not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Extend the single master stylesheet for existing content bodies
        run: |
          cat >> src/styles/stt-master-v20260911.css <<'CSS'

          /* Secondary-page bodies remain in the same master layout and type scale. */
          .stt-canon-body{padding:76px 0 96px;background:var(--stt-paper)}
          .stt-canon-wrap{width:min(100%,1180px);margin-inline:auto;padding-inline:28px}
          .stt-canon-statement{max-width:900px;margin:0;padding:0 0 30px;border-bottom:1px solid var(--stt-line);font-family:var(--stt-serif);font-size:20px;line-height:1.8;color:var(--stt-gold-deep)}
          .stt-canon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:38px;border-top:1px solid var(--stt-line);border-left:1px solid var(--stt-line)}
          .stt-canon-card{padding:30px;border-right:1px solid var(--stt-line);border-bottom:1px solid var(--stt-line);background:#fff}
          .stt-canon-card small{color:var(--stt-gold-deep);font-size:11px;letter-spacing:.12em}.stt-canon-card h2{margin:15px 0 0!important;font-size:27px!important}.stt-canon-card p{margin:12px 0 0;color:var(--stt-ink-soft);font-size:14px;line-height:1.9}
          .stt-canon-card button{margin-top:20px;border:0;border-bottom:1px solid var(--stt-gold);background:transparent;padding:0 0 5px;color:var(--stt-gold-deep);cursor:pointer;font-size:13px;font-weight:600}
          .stt-canon-final{padding:78px 0 94px;border-top:1px solid var(--stt-line);background:linear-gradient(180deg,#fff,#f5efe7);text-align:center}.stt-canon-final h2{max-width:850px;margin:15px auto 0}.stt-canon-final p{max-width:760px;margin:18px auto 0;color:var(--stt-ink-soft);line-height:1.95}.stt-canon-final button{margin-top:24px;border:1px solid var(--stt-gold-deep);border-radius:999px;background:var(--stt-gold-deep);color:#fff;padding:11px 18px;cursor:pointer}

          .domain-root,.lib-root,.gr-root,.pd4-root{min-height:100vh;background:var(--stt-paper);color:var(--stt-ink)}
          .domain-wrap,.lib-wrap,.gr-wrap,.pd4-wrap{width:min(100%,1180px);margin-inline:auto;padding-inline:28px}
          .domain-body,.lib-body{padding:72px 0 104px}.domain-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--stt-line);border-left:1px solid var(--stt-line)}
          .domain-card{min-height:225px;padding:29px;border-right:1px solid var(--stt-line);border-bottom:1px solid var(--stt-line);background:#fff}.domain-card small{color:var(--stt-gold-deep);letter-spacing:.12em}.domain-card h2{margin:15px 0 0!important;font-size:26px!important}.domain-card p{margin:11px 0 0}.domain-card button,.domain-related button{margin-top:20px;border:0;border-bottom:1px solid var(--stt-gold);background:transparent;color:var(--stt-gold-deep);padding:0 0 5px;cursor:pointer}
          .domain-detail{display:grid;grid-template-columns:260px 1fr;gap:46px;padding:32px 0;border-bottom:1px solid var(--stt-line)}.domain-detail h2{margin:0!important;font-size:24px!important}.domain-detail p{margin:0}.domain-related{display:flex;gap:18px;flex-wrap:wrap;margin-top:38px}

          .lib-list{border-top:1px solid var(--stt-line)}.lib-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:30px;padding:31px 0;border-bottom:1px solid var(--stt-line)}.lib-index{font-family:var(--stt-serif);font-size:17px;color:var(--stt-gold)}.lib-row h2{margin:0!important;font-size:25px!important}.lib-meta{margin-top:10px;color:var(--stt-gold-deep);font-size:12px}.lib-row p{margin:10px 0 0}.lib-actions{display:flex;gap:9px;align-items:center}.lib-actions button,.lib-actions a{border:1px solid var(--stt-gold-line);background:#fff;color:var(--stt-gold-deep);padding:9px 13px;text-decoration:none;font-size:12px;cursor:pointer}.lib-note{margin-top:46px;padding:28px;border:1px solid var(--stt-line);background:#fff}.lib-note h2{margin:0!important;font-size:27px!important}.lib-note p{margin:12px 0 0}.lib-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.lib-panel{padding:28px;border:1px solid var(--stt-line);background:#fff}.lib-panel h2{margin:0!important;font-size:26px!important}.lib-panel ul{margin:18px 0 0;padding-left:20px;color:var(--stt-ink-soft);line-height:1.9}.lib-back{margin-top:30px;border:0;border-bottom:1px solid var(--stt-gold);background:transparent;color:var(--stt-gold-deep);padding:0 0 5px;cursor:pointer}

          .gr-hero-note{margin:0;color:var(--stt-gold-deep);font-size:12px;letter-spacing:.12em}.gr-section{padding:72px 0;border-bottom:1px solid var(--stt-line)}.gr-section h2{max-width:900px;margin:14px 0 0}.gr-desc{max-width:830px;margin-top:17px}.gr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:34px;border-top:1px solid var(--stt-line);border-left:1px solid var(--stt-line)}.gr-card{padding:25px;border-right:1px solid var(--stt-line);border-bottom:1px solid var(--stt-line);background:#fff}.gr-card small{color:var(--stt-gold-deep);letter-spacing:.12em}.gr-card h3{margin:13px 0 0!important;font-size:22px!important}.gr-card p{margin:9px 0 0;color:var(--stt-ink-soft);line-height:1.85}.gr-list{margin-top:32px;border-top:1px solid var(--stt-line)}.gr-row{display:grid;grid-template-columns:65px 1fr;gap:20px;padding:19px 0;border-bottom:1px solid var(--stt-line)}.gr-row span{color:var(--stt-gold);font-family:var(--stt-serif);font-size:13px}.gr-row p{margin:0;color:var(--stt-ink-soft);line-height:1.85}.gr-cta{display:flex;gap:11px;flex-wrap:wrap;margin-top:32px}.gr-cta button{border:1px solid var(--stt-gold-deep);background:transparent;color:var(--stt-gold-deep);padding:11px 16px;cursor:pointer}.gr-cta .primary{background:var(--stt-gold-deep);color:#fff}

          .pd4-back{margin-top:18px;border:0;border-bottom:1px solid var(--stt-gold);background:transparent;color:var(--stt-gold-deep);padding:0 0 5px;cursor:pointer}.pd4-body{padding:28px 0 104px}.pd4-block{display:grid;grid-template-columns:300px 1fr;gap:46px;padding:35px 0;border-bottom:1px solid var(--stt-line)}.pd4-block h2{margin:0!important;font-size:24px!important}.pd4-items{display:grid;gap:11px}.pd4-item{padding:17px 19px;border:1px solid var(--stt-line);background:#fff;color:var(--stt-ink-soft);line-height:1.85}.pd4-cta{display:flex;justify-content:space-between;align-items:center;gap:28px;margin-top:50px;padding:34px;border:1px solid var(--stt-line);background:#fff}.pd4-cta h3{max-width:750px;margin:0!important}.pd4-cta button{border:1px solid var(--stt-gold-deep);background:var(--stt-gold-deep);color:#fff;padding:11px 17px;cursor:pointer;white-space:nowrap}

          @media(max-width:820px){.stt-canon-grid,.domain-grid,.lib-columns,.gr-grid{grid-template-columns:1fr}.domain-detail,.pd4-block{grid-template-columns:1fr}.lib-row{grid-template-columns:52px 1fr}.lib-actions{grid-column:2;justify-self:start;flex-wrap:wrap}.pd4-cta{display:block}.pd4-cta button{margin-top:22px}}
          CSS
      - name: Commit restructure
        run: |
          git config user.name "STT Governance Build"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/pages/ProblemDetail.tsx src/styles/stt-master-v20260911.css
          git commit -m "refactor: complete STT master shell and secondary-page visual layout" || exit 0
          git push origin HEAD:rebuild/stt-25-visuals-final-20260911
