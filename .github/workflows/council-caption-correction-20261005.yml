name: Apply requested council caption correction
on:
  push:
    branches: [gcsda-release-20261005]
    paths: [.github/workflows/council-caption-correction-20261005.yml]
permissions:
  contents: write
jobs:
  caption:
    if: >-
      github.event.head_commit.message == 'ci: apply owner-requested council caption punctuation only'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gcsda-release-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace only the exact caption and record approval
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/GCSDAStandaloneV3.tsx')
          before = p.read_bytes()
          expected_blob = '74d68e2ce02cd9e780dfe4d3431ec06f6bd21f12'
          assert hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest() == expected_blob, 'Source changed; do not overwrite'
          old = '策略治理聯席會成員團體照（學會提供）。人物辨識依照片由左至右列示如下。'
          new = '策略治理聯席會成員團體照，人物辨識依照片由左至右列示如下。（學會提供）'
          assert before.count(old.encode()) == 1
          after = before.replace(old.encode(), new.encode(), 1)
          assert after.replace(new.encode(), old.encode(), 1) == before
          p.write_bytes(after)
          record = Path('docs/change-requests/CR-20261005-GCSDA-COUNCIL-PHOTO-IDENTIFICATION.md')
          assert record.is_file()
          with record.open('a', encoding='utf-8') as f:
              f.write('\n\n## Owner-approved caption correction — 2026-10-05\n\nExplicit owner instruction changes only the group-photo caption on /council.\n\nBefore: '+old+'\n\nAfter: '+new+'\n\nAll other source bytes, names, roles, images, layout, routing and STT files remain unchanged. Public-access restrictions are outside this correction; a successful build is not a claim of public browser acceptance.\n')
          PY
          git diff --check
      - name: Verify the existing build
        run: |
          npm ci
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          new = '策略治理聯席會成員團體照，人物辨識依照片由左至右列示如下。（學會提供）'
          old = '策略治理聯席會成員團體照（學會提供）。人物辨識依照片由左至右列示如下。'
          bundles = '\n'.join(p.read_text() for p in Path('dist/assets').glob('*.js'))
          assert new in bundles
          assert old not in bundles
          PY
      - name: Commit only the requested correction and its change record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GCSDAStandaloneV3.tsx docs/change-requests/CR-20261005-GCSDA-COUNCIL-PHOTO-IDENTIFICATION.md
          test "$(git diff --cached --name-only | wc -l)" = 2
          git commit -m 'copy: use owner-specified council group-photo caption'
          git push origin HEAD:gcsda-release-20261005
