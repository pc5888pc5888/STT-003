name: STT Stage 2 Verification
on:
  push:
    branches: [rebuild/stt-approved-white-gold-v1]
    paths: ['src/**', 'api/**', 'scripts/**', 'tests/**', '.github/workflows/stt-stage2-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stt-stage2-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-locked layout edits
        run: python scripts/apply_stage2_layout.py
      - name: Install and validate
        run: |
          mkdir -p stage2-evidence
          pip -q install beautifulsoup4==4.13.4
          python -m unittest discover -s tests -p 'test_mmedia_sync.py' -v 2>&1 | tee stage2-evidence/sync-tests.txt
          npm ci
          npm run lint 2>&1 | tee stage2-evidence/typescript.txt
          npm run build 2>&1 | tee stage2-evidence/build.txt
          npx tsx scripts/test_mmedia_api.ts 2>&1 | tee stage2-evidence/api-tests.txt
      - name: Install browser test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install -g agent-browser
          npm install --prefix /tmp/stt-browser --no-save playwright
      - name: Verify actual browser rendering and interactions
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export AGENT_BROWSER_EXECUTABLE_PATH="$CHROME_PATH"
          npx vite preview --host 127.0.0.1 --port 4173 > stage2-evidence/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          agent-browser open http://127.0.0.1:4173/insights
          agent-browser snapshot -i > stage2-evidence/agent-browser-snapshot.txt
          agent-browser screenshot stage2-evidence/agent-browser-preview.png
          agent-browser close
          node scripts/test_stage2_browser.mjs
      - name: Commit only verified layout corrections
        run: |
          git config user.name "STT Verified Layout"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/HomeCanonical.tsx src/pages/PublicCore.tsx scripts/mmedia_sync.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: apply browser-verified single-line hero and judgment timeline"
          git push origin HEAD:rebuild/stt-approved-white-gold-v1
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stt-stage2-verified-preview
          path: stage2-evidence/
          retention-days: 7
