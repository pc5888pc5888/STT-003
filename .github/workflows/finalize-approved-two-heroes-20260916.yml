name: Finalize approved Cooperation and Eric heroes

on:
  push:
    paths:
      - '.github/workflows/finalize-approved-two-heroes-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-approved-heroes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact approved hero images at production quality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/visual-bank/stt/final-20260916

          COOP='https://media.canva.com/v2/image-resize/format:WEBP/height:941/quality:100/uri:ifs%3A%2F%2FM%2Faee2f1f5-aed9-428a-ad7e-48547f947aa6/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAACLjb3WljhRZp5WAncAOhyd2veQln5wDYPyj_Lx3j6g5&exp=1789553759&osig=AAAAAAAAAAAAAAAAAAAAABfucQXCF8OPjlMk0WtZdlPCK22qPx5DJhZvTSRSNrbl&signer=media-rpc&x-canva-quality=screen'
          ERIC='https://media.canva.com/v2/image-resize/format:WEBP/height:941/quality:100/uri:ifs%3A%2F%2FM%2F6cbb47ee-d964-4b9f-9a79-6d243ff55674/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAADWSoqbcc-fYnqpXymL7sGAoxtjPPhG5aHbXZ-uvtnnB&exp=1789552867&osig=AAAAAAAAAAAAAAAAAAAAAKKj7VKRP02R1IvDn3Bka_mGXLQB-RfjZzoSXr9t4pnE&signer=media-rpc&x-canva-quality=screen'

          curl -fL --retry 3 --retry-delay 2 "$COOP" -o public/visual-bank/stt/final-20260916/cooperation-hero.webp
          curl -fL --retry 3 --retry-delay 2 "$ERIC" -o public/visual-bank/stt/final-20260916/eric-chuang-hero.webp

          COOP_BYTES=$(wc -c < public/visual-bank/stt/final-20260916/cooperation-hero.webp)
          ERIC_BYTES=$(wc -c < public/visual-bank/stt/final-20260916/eric-chuang-hero.webp)
          echo "cooperation bytes=${COOP_BYTES}"
          echo "eric bytes=${ERIC_BYTES}"
          test "$COOP_BYTES" -gt 50000
          test "$ERIC_BYTES" -gt 40000
          file public/visual-bank/stt/final-20260916/cooperation-hero.webp
          file public/visual-bank/stt/final-20260916/eric-chuang-hero.webp

      - name: Verify page wiring and no signature duplication
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const COOPERATION_HERO_SRC = "/visual-bank/stt/final-20260916/cooperation-hero.webp";' src/pages/Cooperation.tsx
          grep -F 'governanceResponsibility: "/visual-bank/stt/final-20260916/eric-chuang-hero.webp",' src/sttVisuals.ts
          ! grep -q 'SIGNATURE_SRC\|stt-coop-signature\|stt-coop-portrait' src/pages/Cooperation.tsx

      - name: Build verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit and push production assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Governance Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/visual-bank/stt/final-20260916/cooperation-hero.webp \
                  public/visual-bank/stt/final-20260916/eric-chuang-hero.webp
          if git diff --cached --quiet; then
            echo 'No binary changes to commit.'
            exit 0
          fi
          git commit -m 'fix: replace final heroes with approved high quality images'
          git push origin HEAD:main
