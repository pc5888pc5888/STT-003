name: STT one-time research cover date rasterization
on:
  push:
    paths:
      - ".github/workflows/stt-one-time-cover-date-raster.yml"
permissions:
  contents: write
jobs:
  rasterize-research-dates:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Run one-time approved research cover date raster correction'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exactly the authorized repository state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install rasterization dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m venv /tmp/stt-cover-date-env
          /tmp/stt-cover-date-env/bin/python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Render and verify only the two corrected cover images
        shell: bash
        run: |
          /tmp/stt-cover-date-env/bin/python scripts/one_off_correct_research_cover_dates.py
      - name: Commit only the corrected original WebP files
        shell: bash
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research-covers/series-02.webp public/research-covers/series-03.webp
          if ! git diff --cached --quiet; then
            git commit -m "Replace original research cover WebP images with verified 2023 dates"
            git push origin HEAD:main
          fi
