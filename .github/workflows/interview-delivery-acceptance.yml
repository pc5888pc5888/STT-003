name: Interview delivery acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/interview-delivery-acceptance.yml
      - scripts/interview-delivery-browser-qa.py
      - scripts/interview-delivery-api-qa.mjs
      - scripts/patch-interview-delivery.py
      - public/humanistic-interview/interview.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: interview-delivery-acceptance
  cancel-in-progress: false
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only guarded interview routing and controls
        run: |
          python3 scripts/patch-interview-delivery.py
          node --check public/humanistic-interview/interview.js
          node scripts/interview-delivery-api-qa.mjs
      - name: Install isolated browser testing tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Chromium desktop and mobile-width functional acceptance
        env:
          QA_ENGINE: chromium
        run: python3 scripts/interview-delivery-browser-qa.py
      - name: WebKit desktop and mobile-width functional acceptance
        env:
          QA_ENGINE: webkit
        run: python3 scripts/interview-delivery-browser-qa.py
      - name: Verify existing website still builds
        run: |
          npm ci
          npm run build
      - name: Publish only after every gate passes
        run: |
          git config user.name 'STT Interview Acceptance'
          git config user.email 'actions@users.noreply.github.com'
          git add public/humanistic-interview/index.html vercel.json
          if test -s qa-interview/changed-source-files.txt; then git add --pathspec-from-file=qa-interview/changed-source-files.txt; fi
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'fix: unify interview route and publish browser-verified recovery controls [mirror-skip]'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > qa-interview/source-commit.txt
          sha256sum public/humanistic-interview/index.html public/humanistic-interview/interview.js api/humanistic-submit.ts > qa-interview/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interview-delivery-acceptance
          path: qa-interview/
          retention-days: 7
