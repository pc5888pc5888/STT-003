name: Apply tested Humanistic delivery repair once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-humanistic-delivery-once.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: humanistic-delivery-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply SHA-guarded repair without altering approved questions or artwork
        run: python3 scripts/repair_humanistic_delivery.py
      - name: Validate JavaScript and retained privacy controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/humanistic-interview/index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/humanistic-delivery.js').write_text('\n'.join(scripts))
          assert 'STT_DELIVERY_REPAIR_20261020' in s
          assert '文字送出後，本網站不保留您輸入的文字。' in s
          assert 'localStorage' not in s
          assert '/api/send-backup' not in s
          assert '/api/humanistic-submit' in s
          assert 'backup-full-text' in s
          assert 'function purgeSubmittedData()' in s
          assert not Path('.github/workflows/mirror-humanistic-interview.yml').exists()
          PY
          node --check /tmp/humanistic-delivery.js
          git diff --stat
      - name: Commit only the repaired interview page
        run: |
          git config user.name 'STT Delivery Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add public/humanistic-interview/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: resilient interview copy download submit with verified receipt [mirror-skip]'
          git push origin HEAD:main
