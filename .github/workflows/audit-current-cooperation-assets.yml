name: Audit all Git history for current approved STT visuals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-current-cooperation-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, 'record global visual matches') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch every remote branch and tag
        run: git fetch --all --tags --prune
      - name: Search every reachable image blob by SHA-256 and perceptual hash
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy
          mkdir -p .audit
          python - <<'PY' > .audit/global-current-image-matches.txt
          import io, subprocess, hashlib
          from pathlib import Path
          from PIL import Image
          import numpy as np

          exact_targets={
            '01-home':'d87b1039a686ad6a92be4eb2aadbc6d32111278ffd59869137e77e939708ff39',
            '02-problems':'964923d0ba8ddc9589fcd8a254d6daca2f71643d2e6702236bff2902d38850c9',
            '03-method':'e64be189148c76ce2dd5b13efba5a9512e2cb003692f87991c95d35322602753',
            '04-columns':'03cc644c1f32e05252ebc4defae7149dd6ddc0a8a36f7965436f0c2dff284417',
            '05-publications':'f8fa16efabc931975e46973aafba97a2e75b733c8836ea06bece490b5d676754',
            '06-about':'6ae927ed6e822b3699005a734b169f7b098cd353fe6c688f381730c41da1d33d',
            '07-cooperation-bg':'2eb68a1ced5bc80dfd5c957cd0fe98cd6d7a3c06972e15c775a119c63eb179e0',
            '08-cooperation-portrait':'8d844e7528c9911a403e5987882293fe002864dade9956671e7235106c4c70d2',
          }
          phash_targets={
            '01-home':'002900080012001340009024c00178538d1bd30bfa4bd25bda5b2523924a9a4a',
            '02-problems':'e5b6e4c2dc9a5c9bbc89b49bb6123c82f8c0cac48cc5c7cc8ecc9e6dd50ef1c3',
            '03-method':'33a79b0f9f0f9e07f68c76f2f6b7f6b7a6b6a7a2a3e3a2e3bda2c7f2d938fbe1',
            '04-columns':'6288661262187c980d581dc89dc8ad4a1d594d51dd31f21ce612c59c4dcee6e6',
            '05-publications':'1124172c992c99b49e04b604b6ccdcccf49c6c96f006cf1f4797d0b9f0f65e72',
            '06-about':'330327268b06a304e306e50645a00f962f0d3e637e320f8a1da0d224e504e488',
            '07-cooperation-bg':'8801a54485648524a6c485b585259526955a9cd998cc844c844d87cdb0098c03',
            '08-cooperation-portrait':'13c001a9032303cb23f50b701138131f3dcb19231997019b0d970a62586b2068',
          }
          exts={'.png','.jpg','.jpeg','.webp','.avif'}

          def normalize(im):
              im=im.convert('RGBA')
              box=im.getchannel('A').getbbox()
              if box: im=im.crop(box)
              base=Image.new('RGBA',im.size,(255,255,255,255))
              base.alpha_composite(im)
              return base.convert('L')

          def dhash_bytes(data,hs=16):
              im=normalize(Image.open(io.BytesIO(data))).resize((hs+1,hs),Image.Resampling.LANCZOS)
              a=np.asarray(im); d=a[:,1:]>a[:,:-1]
              return int(''.join('1' if x else '0' for x in d.flatten()),2), Image.open(io.BytesIO(data)).size

          lines=subprocess.check_output(['git','rev-list','--objects','--all'],text=True).splitlines()
          seen=set(); candidates=[]; exact=[]
          for line in lines:
              parts=line.split(' ',1)
              if len(parts)!=2: continue
              oid,path=parts
              if Path(path).suffix.lower() not in exts or oid in seen: continue
              seen.add(oid)
              try:
                  data=subprocess.check_output(['git','cat-file','blob',oid])
                  sha=hashlib.sha256(data).hexdigest()
                  for label,want in exact_targets.items():
                      if sha==want: exact.append((label,oid,path,len(data),sha))
                  h,size=dhash_bytes(data)
                  candidates.append((oid,path,len(data),sha,h,size))
              except Exception:
                  continue

          print('UNIQUE_IMAGE_BLOBS',len(candidates))
          print('\n### EXACT_SHA256_MATCHES')
          if exact:
              for row in exact: print(*row)
          else: print('NONE')

          for label,target_hex in phash_targets.items():
              t=int(target_hex,16)
              print(f'\n### NEAREST {label}')
              rows=sorted(((t^h).bit_count(),oid,path,size,nbytes,sha) for oid,path,nbytes,sha,h,size in candidates)[:15]
              for row in rows: print(*row)
          PY
      - name: Commit audit evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Visual Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add .audit/global-current-image-matches.txt
          git commit -m 'audit: record global visual matches [skip ci]'
          git push origin HEAD:main
