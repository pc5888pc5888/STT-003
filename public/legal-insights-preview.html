<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STT Legal Insights｜十二篇 94m HTML 預覽工作台</title><style>
:root{--ink:#132231;--burg:#681922;--gold:#b98a3a;--bg:#0f1923;--panel:#101c27;--line:#2c4151}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:#eef2f5}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;height:100vh;overflow:auto;position:sticky;top:0}
.brand{font-family:Georgia,"Noto Serif TC",serif;font-size:21px}.brand small{display:block;color:#c8aa70;font:12px/1.5 Inter,sans-serif;margin-top:4px;letter-spacing:.08em}
.status{margin:14px 0 16px;padding:10px;border:1px solid #344958;border-radius:8px;color:#b9c5ce;font-size:12px;line-height:1.6}
.nav{display:grid;gap:7px}.article-btn{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#e3e9ed;border-radius:8px;padding:10px 11px;cursor:pointer}.article-btn strong{display:block;font-size:12px;color:#c9a76a;margin-bottom:3px}.article-btn span{display:block;font-size:13px;line-height:1.45}.article-btn:hover{background:#172a38}.article-btn.active{background:#f2eadc;color:#54151d;border-color:#a67b34}.article-btn.active strong{color:#7a202b}
.main{min-width:0}.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 16px;background:rgba(15,25,35,.97);border-bottom:1px solid var(--line)}.article-name{flex:1;min-width:260px;font-size:14px}.device{display:flex;border:1px solid #425767;border-radius:8px;overflow:hidden}.device button{border:0;border-right:1px solid #425767;background:#132331;color:#cfd8df;padding:8px 9px;cursor:pointer}.device button:last-child{border-right:0}.device button.active{background:var(--gold);color:#17212b}.btn{border:1px solid #526575;background:#182938;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700}.btn.primary{background:#7a202b;border-color:#a45c64}
.workspace{padding:22px;display:flex;justify-content:center;min-height:calc(100vh - 62px);overflow:auto}.frame-wrap{width:900px;max-width:100%;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.35);transition:width .2s}.frame-wrap iframe{display:block;width:100%;height:calc(100vh - 110px);min-height:760px;border:0;background:#fff}.frame-wrap.hide{display:none}.source{display:none;width:min(1200px,100%);background:#0b1218;border:1px solid #2d4354;border-radius:8px}.source.show{display:block}.source-head{padding:10px 12px;border-bottom:1px solid #2d4354;color:#cbd7df;font-size:12px}.source pre{margin:0;padding:18px;max-height:calc(100vh - 150px);overflow:auto;white-space:pre-wrap;word-break:break-word;color:#d7e1e7;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}.toast{position:fixed;right:20px;bottom:20px;background:#f4ead8;color:#4e171f;border:1px solid var(--gold);border-radius:9px;padding:12px 16px;font-weight:800;opacity:0;transform:translateY(10px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{padding:10px}.frame-wrap iframe{height:75vh;min-height:620px}}
@media(max-width:520px){.nav{grid-template-columns:1fr}.toolbar{align-items:stretch}.article-name{min-width:100%}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">STT Legal Insights<small>94m HTML PREVIEW WORKBENCH</small></div><div class="status">Canonical Content：十二篇 DOCX<br>Shell：LEGAL INSIGHTS Profile<br>狀態：STATIC PREVIEW｜94m CMS-PENDING</div><div class="nav"><button class="article-btn active" data-index="0" data-url="/legal-insights-preview/article-01.html"><strong>第一篇</strong><span>密室中的非對稱作戰</span></button><button class="article-btn" data-index="1" data-url="/legal-insights-preview/article-02.html"><strong>第二篇</strong><span>格式化大腦偷懶</span></button><button class="article-btn" data-index="2" data-url="/legal-insights-preview/article-03.html"><strong>第三篇</strong><span>時代的創新恐懼</span></button><button class="article-btn" data-index="3" data-url="/legal-insights-preview/article-04.html"><strong>第四篇</strong><span>控制權焦慮的致命長臂</span></button><button class="article-btn" data-index="4" data-url="/legal-insights-preview/article-05.html"><strong>第五篇</strong><span>法治降維打擊人治</span></button><button class="article-btn" data-index="5" data-url="/legal-insights-preview/article-06.html"><strong>第六篇</strong><span>道德糖衣下的毒藥</span></button><button class="article-btn" data-index="6" data-url="/legal-insights-preview/article-07.html"><strong>第七篇</strong><span>程序雙軌綁架的破局</span></button><button class="article-btn" data-index="7" data-url="/legal-insights-preview/article-08.html"><strong>第八篇</strong><span>將政治抹黑入罪化</span></button><button class="article-btn" data-index="8" data-url="/legal-insights-preview/article-09.html"><strong>第九篇</strong><span>逼迫大老闆清醒的重砲</span></button><button class="article-btn" data-index="9" data-url="/legal-insights-preview/article-10.html"><strong>第十篇</strong><span>實幹者的不敗金身</span></button><button class="article-btn" data-index="10" data-url="/legal-insights-preview/article-11.html"><strong>第十一篇</strong><span>科技業與網路新創的敏捷合規</span></button><button class="article-btn" data-index="11" data-url="/legal-insights-preview/article-12.html"><strong>第十二篇</strong><span>傳產與代工業的製程紀律</span></button></div></aside><section class="main"><div class="toolbar"><div class="article-name">第一篇｜密室中的非對稱作戰</div><div class="device"><button data-w="390">390</button><button data-w="768">768</button><button class="active" data-w="900">900</button></div><button id="previewBtn" class="btn primary">線上預覽</button><button id="sourceBtn" class="btn">檢視原始碼</button><button id="copyBtn" class="btn primary">一鍵複製 CMS 原始碼</button></div><div class="workspace"><div class="frame-wrap"><iframe title="94m HTML preview" srcdoc="核准圖像驗證中…"></iframe></div><div class="source"><div class="source-head">目前篇章 CMS HTML</div><pre>載入中…</pre></div></div></section></div><div class="toast"></div><script>
const ITEMS=[{"n":"01","label":"第一篇","title":"密室中的非對稱作戰","url":"/legal-insights-preview/article-01.html"},{"n":"02","label":"第二篇","title":"格式化大腦偷懶","url":"/legal-insights-preview/article-02.html"},{"n":"03","label":"第三篇","title":"時代的創新恐懼","url":"/legal-insights-preview/article-03.html"},{"n":"04","label":"第四篇","title":"控制權焦慮的致命長臂","url":"/legal-insights-preview/article-04.html"},{"n":"05","label":"第五篇","title":"法治降維打擊人治","url":"/legal-insights-preview/article-05.html"},{"n":"06","label":"第六篇","title":"道德糖衣下的毒藥","url":"/legal-insights-preview/article-06.html"},{"n":"07","label":"第七篇","title":"程序雙軌綁架的破局","url":"/legal-insights-preview/article-07.html"},{"n":"08","label":"第八篇","title":"將政治抹黑入罪化","url":"/legal-insights-preview/article-08.html"},{"n":"09","label":"第九篇","title":"逼迫大老闆清醒的重砲","url":"/legal-insights-preview/article-09.html"},{"n":"10","label":"第十篇","title":"實幹者的不敗金身","url":"/legal-insights-preview/article-10.html"},{"n":"11","label":"第十一篇","title":"科技業與網路新創的敏捷合規","url":"/legal-insights-preview/article-11.html"},{"n":"12","label":"第十二篇","title":"傳產與代工業的製程紀律","url":"/legal-insights-preview/article-12.html"}];
const approvedImageParts={"hero":["/legal-insights-approved-assets/hero-00.b64","/legal-insights-approved-assets/hero-01.b64","/legal-insights-approved-assets/hero-02.b64","/legal-insights-approved-assets/hero-03.b64","/legal-insights-approved-assets/hero-04.b64","/legal-insights-approved-assets/hero-05.b64","/legal-insights-approved-assets/hero-06.b64","/legal-insights-approved-assets/hero-07.b64","/legal-insights-approved-assets/hero-08.b64","/legal-insights-approved-assets/hero-09.b64"],"portrait":["/legal-insights-approved-assets/portrait-00.b64","/legal-insights-approved-assets/portrait-01.b64","/legal-insights-approved-assets/portrait-02.b64","/legal-insights-approved-assets/portrait-03.b64"],"signature":["/legal-insights-approved-assets/signature-00.b64"]};
const approvedLengths={"hero":5808804,"portrait":1982196,"signature":53788};
let current=0,device=900,mode='preview',requestVersion=0;
let approvedImages=null, activeHtml=null;
const buttons=[...document.querySelectorAll('.article-btn')],
frame=document.querySelector('iframe'),
wrap=document.querySelector('.frame-wrap'),
source=document.querySelector('.source'),
pre=source.querySelector('pre'),
nameEl=document.querySelector('.article-name'),
toast=document.querySelector('.toast'),
previewBtn=document.querySelector('#previewBtn'),
sourceBtn=document.querySelector('#sourceBtn'),
copyBtn=document.querySelector('#copyBtn');
const contentControls=[previewBtn,sourceBtn,copyBtn];
function setContentEnabled(enabled){contentControls.forEach(button=>{button.disabled=!enabled;});}
function showToast(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200);}
function loadError(error){activeHtml=null;setContentEnabled(false);frame.srcdoc='<html lang="zh-Hant"><body style="padding:28px;font-family:sans-serif;color:#681922">核准圖像或文章資料未通過驗證，禁止顯示缺圖版本。</body></html>';pre.textContent='完整原始碼尚未通過驗證，複製功能已停用。';nameEl.textContent='圖片驗收未通過，已停止輸出';showToast('驗收未通過：缺失內容不會進入 94m 原始碼');console.error('STT asset verification failed',error);}
async function readImage(name){
 const blocks=await Promise.all(approvedImageParts[name].map(async file=>{
   const response=await fetch(file);
   if(!response.ok) throw new Error('Approved image part unavailable: '+file);
   return response.text();
 }));
 const data=blocks.join('');
 if(data.length!==approvedLengths[name] || !data.startsWith('iVBORw0KGgo')) throw new Error('Approved image integrity mismatch: '+name);
 return 'data:image/png;base64,'+data;
}
function restoreLockedImages(original){
 if(!approvedImages) throw new Error('Approved images not loaded');
 const root='<div id="stt-legal-v2">';
 const author='<div aria-label="莊鈞翔博士作者照片與簽名" class="author-visual"> ';
 if(original.split(root).length!==2 || original.split(author).length!==2 || /<img\b/i.test(original)) throw new Error('Baseline shell mismatch or unexpected image content');
 const hero='<div class="hero-art"><img alt="莊鈞翔博士法律專欄｜以法律專業為基礎，以治理思維為高度" src="'+approvedImages.hero+'"/></div>';
 const portrait='<img alt="莊鈞翔博士" class="author-photo author-photo-current" src="'+approvedImages.portrait+'"/>';
 const signature='<img alt="莊鈞翔博士簽名" class="signature-img signature-img-current" src="'+approvedImages.signature+'"/>';
 const restored=original.replace(root,root+hero).replace(author,author+portrait+' '+signature+'\n');
 if((restored.match(/<img\b/g)||[]).length!==3 || (restored.match(/data:image\/png;base64,/g)||[]).length!==3) throw new Error('Required visual asset missing');
 return restored;
}
async function loadArticle(index){
 const response=await fetch(ITEMS[index].url,{cache:'no-store'});
 if(!response.ok) throw new Error('Article fetch failed: '+ITEMS[index].url);
 const original=await response.text();
 return restoreLockedImages(original);
}
async function select(i){
 if(!approvedImages)return;
 const version=++requestVersion;
 current=i;activeHtml=null;setContentEnabled(false);
 const item=ITEMS[i];
 buttons.forEach((button,j)=>button.classList.toggle('active',j===i));
 nameEl.textContent=item.label+'｜'+item.title+'（驗證中）';
 frame.removeAttribute('src');
 frame.srcdoc='<html lang="zh-Hant"><body style="padding:28px;font-family:sans-serif">正在載入完整核准版型…</body></html>';
 pre.textContent='正在載入本篇原始碼…';
 try{
  const html=await loadArticle(i);
  if(version!==requestVersion)return;
  activeHtml=html;
  nameEl.textContent=item.label+'｜'+item.title;
  frame.srcdoc=html;
  if(mode==='source')pre.textContent=html;
  setContentEnabled(true);
 }catch(error){if(version===requestVersion)loadError(error);}
}
buttons.forEach((button,i)=>button.addEventListener('click',()=>select(i)));
previewBtn.onclick=()=>{mode='preview';wrap.classList.remove('hide');source.classList.remove('show');previewBtn.classList.add('primary');sourceBtn.classList.remove('primary');};
sourceBtn.onclick=()=>{if(!activeHtml)return;mode='source';wrap.classList.add('hide');source.classList.add('show');sourceBtn.classList.add('primary');previewBtn.classList.remove('primary');pre.textContent=activeHtml;};
copyBtn.onclick=async()=>{
 if(!activeHtml) return;
 try{
  if((activeHtml.match(/<img\b/g)||[]).length!==3)throw new Error('Missing approved image');
  try{await navigator.clipboard.writeText(activeHtml);}
  catch(e){
   const ta=document.createElement('textarea');
   ta.value=activeHtml;document.body.appendChild(ta);ta.select();
   const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('Clipboard unavailable');
  }
  showToast('已複製本篇含主視覺、肖像及簽名的完整原始碼');
 }catch(error){showToast('複製失敗，未交付不完整內容');console.error(error);}
};
document.querySelectorAll('.device button').forEach(b=>b.onclick=()=>{
 device=Number(b.dataset.w);
 document.querySelectorAll('.device button').forEach(x=>x.classList.toggle('active',x===b));
 wrap.style.width=device+'px';
});
(async()=>{
 setContentEnabled(false);
 nameEl.textContent='正在驗證核准主視覺、肖像與簽名…';
 try{
  const entries=await Promise.all(Object.keys(approvedImageParts).map(async name=>[name,await readImage(name)]));
  approvedImages=Object.fromEntries(entries);
  await select(0);
 }catch(error){loadError(error);}
})();
</script></body></html>
