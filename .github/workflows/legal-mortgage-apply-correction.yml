name: Apply and test legal correction
on:
  push:
    branches: [preview/legal-mortgage-20260923-r2]
    paths: [.github/workflows/legal-mortgage-apply-correction.yml]
permissions:
  contents: write
  actions: read
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: legal-recheck-official-sources
          run-id: 35847858857
          github-token: ${{ github.token }}
          path: legal-recheck
      - run: python -m pip -q install beautifulsoup4 playwright
      - run: python legal-mortgage-preview/correct.py
      - run: python -m playwright install --with-deps chromium
      - name: Test actual article, original images and exact clipboard
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import subprocess,sys,json,hashlib,time
          out=Path('legal-correction-qa');out.mkdir(exist_ok=True)
          server=subprocess.Popen([sys.executable,'-m','http.server','8765','--directory','public'],stdout=subprocess.DEVNULL)
          try:
            with sync_playwright() as p:
              b=p.chromium.launch();c=b.new_context(permissions=['clipboard-read','clipboard-write']);page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://localhost:8765/legal-mortgage-preview/',wait_until='networkidle')
              page.wait_for_function("document.getElementById('article').contentDocument?.querySelectorAll('.article-body > p').length===38")
              r={'browser':b.version,'viewports':[]}
              for w in [320,360,375,390,430,600,768,820,1024,1440]:
                page.set_viewport_size({'width':w,'height':1000});page.wait_for_timeout(100)
                d=page.evaluate("()=>{const f=document.getElementById('article').contentWindow;const d=f.document;const over=Array.from(d.querySelectorAll('#stt-legal-v2 *')).filter(e=>{const r=e.getBoundingClientRect();return r.left<-.5||r.right>f.innerWidth+.5});return {outer:document.documentElement.scrollWidth,viewport:f.innerWidth,doc:d.documentElement.scrollWidth,body:d.body.scrollWidth,overflow:over.length}}")
                assert d['outer']<=w and d['doc']<=d['viewport'] and d['body']<=d['viewport'] and d['overflow']==0,(w,d)
                r['viewports'].append({'width':w,**d})
              page.click('#copy');page.wait_for_timeout(250);s=page.evaluate('navigator.clipboard.readText()');r['clipboard_sha256']=hashlib.sha256(s.encode()).hexdigest()
              assert r['clipboard_sha256']=='17cbd4aef5404e606687e683a8e7f40d3f77fe318691a2f05ec488c16cd08b53'
              page.click('[data-tab=source]');assert page.input_value('#source')==s
              page.click('[data-tab=audit]');assert page.locator('#audit details').count()==102
              page.click('[data-tab=preview]');page.set_viewport_size({'width':1440,'height':1100});page.screenshot(path=str(out/'desktop.png'))
              page.set_viewport_size({'width':390,'height':1000});page.screenshot(path=str(out/'mobile.png'))
              r['images']=page.evaluate("()=>Array.from(document.getElementById('article').contentDocument.images).map(i=>({alt:i.alt,width:i.naturalWidth,height:i.naturalHeight}))")
              assert len(r['images'])==3 and all(i['width']>0 for i in r['images']);assert not errors; r['page_errors']=errors
              (out/'browser.json').write_text(json.dumps(r,ensure_ascii=False,indent=2));b.close()
          finally:server.terminate()
          PY
      - name: Update isolated preview only
        run: |
          git config user.name 'STT preview assembly'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legal-mortgage-preview/site/index.html public/legal-mortgage-preview/index.html legal-mortgage-preview/site-verification.json
          git commit -m 'Correct verified mortgage law scope, appraisal logic and fixed disclosure [skip ci]'
          git pull --rebase origin preview/legal-mortgage-20260923-r2
          git push origin HEAD:preview/legal-mortgage-20260923-r2
          git rev-parse HEAD > legal-correction-qa/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-legal-column-proof
          path: |
            legal-correction-qa
            legal-mortgage-preview/site-verification.json
            legal-mortgage-preview/site/index.html
