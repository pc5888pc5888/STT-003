name: Council owner image replacement only
on:
  push:
    branches: [gcsda-release-20261005]
    paths: ['.github/workflows/council-owner-image-only-20261013.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gcsda-release-20261005
          fetch-depth: 2
      - name: Apply only the owner-approved image source replacement
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/council-evidence"
          python3 - <<'PY'
          import hashlib, json, os, struct, subprocess
          from pathlib import Path
          expected = 'ac6c81de615e3ea0657f96640bb520bd084e023f6a88407b9063ab5611c960c6'
          src = Path('src/GCSDAStandaloneV3.tsx')
          assert subprocess.check_output(['git','hash-object',str(src)],text=True).strip() == 'e0a22f075620e11e5889f45066703050a519be04', 'Source changed; stop rather than overwrite'
          original = Path('public/images/gcsda-council-approved-background-1672.png')
          image = original.read_bytes()
          assert len(image) == 4327293
          assert hashlib.sha256(image).hexdigest() == expected, 'Image must be byte-identical to the current user upload'
          assert image[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', image[16:24]) == (2048,1152)
          dest = Path('public/images/gcsda-council-owner-ac6c81de615e.png')
          assert not dest.exists()
          before = src.read_bytes()
          old = b'const GCSDA_COUNCIL_PHOTO_SRC = "/images/gcsda-council-approved-background-1672.png";'
          new = b'const GCSDA_COUNCIL_PHOTO_SRC = "/images/gcsda-council-owner-ac6c81de615e.png";'
          assert before.count(old) == 1
          after = before.replace(old,new,1)
          assert after.replace(new,old,1) == before
          dest.write_bytes(image)
          src.write_bytes(after)
          evidence = {'change_request':'CR-GCSDA-COUNCIL-20261013-01','approval':'Owner explicitly requested replacement using the current upload; all other website content unchanged','base':'c08b99056934a79934fbc801c8d47e4a379ee6c8','route':'/council#council-members','old_image_reference':old.decode(),'new_image_reference':new.decode(),'upload_name':'GCSDA_原圖人物去背合成_8K.png','image_sha256':expected,'image_bytes':len(image),'image_dimensions':[2048,1152],'pixel_edits':False,'layout_edits':False,'copy_edits':False,'old_asset_retained_for_compatibility':True}
          Path(os.environ['RUNNER_TEMP'],'council-evidence','replacement.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY
          git rm .github/workflows/council-owner-image-only-20261013.yml
          git add src/GCSDAStandaloneV3.tsx public/images/gcsda-council-owner-ac6c81de615e.png
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/council-owner-image-only-20261013.yml','src/GCSDAStandaloneV3.tsx','public/images/gcsda-council-owner-ac6c81de615e.png'}
          assert actual==expected, actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(gcsda): replace council image reference with owner-uploaded immutable asset'
          git push origin HEAD:gcsda-release-20261005
          git rev-parse HEAD > "$RUNNER_TEMP/council-evidence/commit.txt"
          git diff c08b99056934a79934fbc801c8d47e4a379ee6c8 HEAD --stat > "$RUNNER_TEMP/council-evidence/diff-stat.txt"
          git diff c08b99056934a79934fbc801c8d47e4a379ee6c8 HEAD -- src/GCSDAStandaloneV3.tsx > "$RUNNER_TEMP/council-evidence/source.patch"
          cat "$RUNNER_TEMP/council-evidence/replacement.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium verification without a paid browser service
        run: |
          mkdir -p "$RUNNER_TEMP/council-browser"
          cd "$RUNNER_TEMP/council-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify the actual council page after its alias is updated
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          cat > "$RUNNER_TEMP/council-browser/check.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const dir=path.join(process.env.RUNNER_TEMP,'council-evidence');
          const expected='ac6c81de615e3ea0657f96640bb520bd084e023f6a88407b9063ab5611c960c6';
          const target='/images/gcsda-council-owner-ac6c81de615e.png';
          const origin='https://gcsda-governance.vercel.app';
          const browser=await chromium.launch({headless:true});
          const headers=process.env.VERCEL_BYPASS?{'x-vercel-protection-bypass':process.env.VERCEL_BYPASS}:{};
          const context=await browser.newContext({extraHTTPHeaders:headers,locale:'zh-TW',reducedMotion:'reduce'});
          const page=await context.newPage();
          let ready=false;
          for(let attempt=0;attempt<36;attempt++){
            const response=await page.goto(origin+'/council',{waitUntil:'domcontentloaded',timeout:45000});
            if(response?.status()===401 || response?.status()===403){
              fs.writeFileSync(path.join(dir,'live-qa.json'),JSON.stringify({status:'AUTHENTICATION_REQUIRED',http_status:response.status(),replacement_committed:true},null,2));
              console.log('Live page requires authentication; replacement remains committed.');
              await browser.close(); process.exit(0);
            }
            try {await page.waitForSelector('[data-gcsda-council-photo]',{timeout:12000});} catch {}
            const src=await page.locator('[data-gcsda-council-photo]').getAttribute('src').catch(()=>null);
            if(src===target){ready=true;break;}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ready){fs.writeFileSync(path.join(dir,'live-qa.json'),JSON.stringify({status:'WAITING_FOR_ALIAS',replacement_committed:true},null,2));await browser.close();process.exit(0);}
          const result=[];
          for(const [name,width,height] of [['desktop',1440,1050],['tablet',768,1024],['mobile',390,844]]){
            await page.setViewportSize({width,height});
            const response=await page.goto(origin+'/council#council-members',{waitUntil:'networkidle',timeout:60000});
            const img=page.locator('[data-gcsda-council-photo]');
            await img.waitFor({state:'visible'});await img.evaluate(el=>el.decode());
            const info=await img.evaluate(el=>({src:el.getAttribute('src'),currentSrc:el.currentSrc,naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,complete:el.complete,alt:el.alt,rect:{width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height},objectFit:getComputedStyle(el).objectFit}));
            if(info.src!==target || info.naturalWidth!==2048 || info.naturalHeight!==1152)throw new Error('Incorrect image rendered');
            const download=await context.request.get(info.currentSrc);
            const bytes=await download.body();
            const hash=crypto.createHash('sha256').update(bytes).digest('hex');
            if(!download.ok() || hash!==expected)throw new Error('Live image does not match the uploaded file');
            await page.locator('.g4-council-photo').screenshot({path:path.join(dir,name+'-council-photo.png')});
            await page.locator('#council-members').screenshot({path:path.join(dir,name+'-council-section.png')});
            await page.screenshot({path:path.join(dir,name+'-council-page.png'),fullPage:true});
            result.push({viewport:name,page_status:response?.status(),image_status:download.status(),image_sha256:hash,...info,horizontalOverflow:await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth)});
          }
          fs.writeFileSync(path.join(dir,'live-qa.json'),JSON.stringify({status:'PASS',route:'/council#council-members',checks:result},null,2));
          console.log(JSON.stringify({status:'PASS',checks:result},null,2));
          await browser.close();
          JS
          cd "$RUNNER_TEMP/council-browser"
          node check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: council-image-replacement-evidence
          path: ${{ runner.temp }}/council-evidence
          retention-days: 7
