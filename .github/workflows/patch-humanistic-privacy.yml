name: Patch Humanistic privacy controls

on:
  push:
    paths:
      - '.github/workflows/patch-humanistic-privacy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply privacy patch
        run: python scripts/patch_humanistic_privacy.py
      - name: Commit patched page
        run: |
          git config user.name "pc5888pc5888"
          git config user.email "pc5888@gmail.com"
          git add public/humanistic-interview/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "privacy: purge Humanistic answers after successful submit"
          git push origin HEAD:main
