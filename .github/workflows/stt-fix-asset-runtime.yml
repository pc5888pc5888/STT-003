name: Fix STT Asset Bank Runtime

on:
  push:
    branches:
      - rebuild/white-gold-governance-os-v2-gold
    paths:
      - .github/workflows/stt-fix-asset-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime guard and retire legacy overlay loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/assetBankRuntime.ts')
          s=p.read_text()
          s=s.replace("const dark=luminance(cs.backgroundColor)<.22;\n    const gradient=cs.backgroundImage.includes('gradient')&&!cs.backgroundImage.includes('url(');\n    if(dark||gradient){", "const transparent=cs.backgroundColor==='rgba(0, 0, 0, 0)'||cs.backgroundColor==='transparent';\n    const dark=!transparent&&luminance(cs.backgroundColor)<.22;\n    if(dark){")
          p.write_text(s)
          h=Path('index.html')
          if h.exists():
              t=h.read_text(encoding='utf-8-sig')
              t=t.replace('    <script src="/theme-governance.js" defer></script>\n','')
              h.write_text(t,encoding='utf-8')
          old=Path('public/theme-governance.js')
          if old.exists(): old.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "STT Visual Bank Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/assetBankRuntime.ts index.html public/theme-governance.js 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: retire legacy theme patch and protect white-gold surfaces"
          git push origin HEAD:rebuild/white-gold-governance-os-v2-gold
