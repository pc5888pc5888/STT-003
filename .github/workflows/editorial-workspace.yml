name: Prepare editorial workspace
on:
  push:
    branches: [stt-convergence-20260923]
    paths: [.github/workflows/editorial-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: stt
            ref: ef7904776ca0652a396085fb42852977f3707f38
          - site: gcsda
            ref: ab3aa9410c22044ebe60798919ef7af8604a33c0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
      - name: Bundle exact source and build dependencies
        run: |
          mkdir -p /tmp/editorial
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          files=[]
          for folder in ['src','api','tests','public']:
              files.extend(p for p in Path(folder).rglob('*') if p.is_file())
          files.extend(p for p in Path('.').glob('*') if p.suffix in ['.json','.ts','.html','.js','.png','.jpg','.webp'])
          with zipfile.ZipFile('/tmp/editorial/site.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in files:z.write(p)
          with zipfile.ZipFile('/tmp/editorial/dependencies.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in Path('node_modules').rglob('*'):
                  if p.is_file():z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-workspace-${{ matrix.site }}
          path: /tmp/editorial/
          retention-days: 3
          compression-level: 0
