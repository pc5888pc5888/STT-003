name: Restore council photo native resolution
'on':
  push:
    branches: [gcsda-release-20261005]
    paths: ['.github/workflows/council-resolution-audit-20261005.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore native source pixels and preserve approved text
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, json, re
          out=Path('council-resolution-qa');out.mkdir()
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          source=Path('public/images/group-001.png');original=source.read_bytes()
          assert blob(original)=='7c0eb2002173a4badbcdd189614afec097be2997'
          im=Image.open(io.BytesIO(original)).convert('RGBA');im.load()
          assert im.size==(3074,1728)
          assert im.getchannel('A').getextrema()[0]==0,'Expected transparent original'
          target=Path('public/images/gcsda-council-members-original-3074.webp');assert not target.exists()
          im.save(target,format='WEBP',lossless=True,quality=100,method=6,exact=True)
          decoded=Image.open(target).convert('RGBA');decoded.load()
          white=Image.new('RGBA',im.size,'white')
          assert Image.alpha_composite(white,im).tobytes()==Image.alpha_composite(white,decoded).tobytes()
          parts=[re.search(r'[\"\']([A-Za-z0-9+/=]+)[\"\']',Path(f'src/gcsda-council-photo-parts/part{n}.ts').read_text()).group(1) for n in range(2)]
          previous=base64.b64decode(''.join(parts));(out/'previous.webp').write_bytes(previous)
          (out/'previous-data-url.txt').write_text('data:image/webp;base64,'+''.join(parts))
          p=Path('src/GCSDAStandaloneV3.tsx');before=p.read_bytes()
          assert blob(before)=='0cc6952683a363edb745749f8d706930780630a3'
          c=before.decode()
          changes=[
            ('import gcsdaCouncilPhoto0 from "./gcsda-council-photo-parts/part0";\n',''),
            ('import gcsdaCouncilPhoto1 from "./gcsda-council-photo-parts/part1";\n',''),
            ('const GCSDA_COUNCIL_PHOTO_DATA = "data:image/webp;base64," + gcsdaCouncilPhoto0 + gcsdaCouncilPhoto1;','const GCSDA_COUNCIL_PHOTO_SRC = "/images/gcsda-council-members-original-3074.webp";'),
            ('src={GCSDA_COUNCIL_PHOTO_DATA}','src={GCSDA_COUNCIL_PHOTO_SRC}'),
            ('width="700" height="394" loading="eager"','width="3074" height="1728" loading="eager"')]
          for old,new in changes:
              assert c.count(old)==1,old
              c=c.replace(old,new,1)
          caption='策略治理聯席會成員團體照，人物辨識依照片由左至右列示如下。（學會提供）'
          assert c.count('<figcaption>'+caption+'</figcaption>')==1
          assert re.search(r'const councilPhotoMembers = \[.*?\] as const;',c,re.S).group()==re.search(r'const councilPhotoMembers = \[.*?\] as const;',before.decode(),re.S).group()
          p.write_text(c)
          css=Path('src/styles/cis-page-system.css');b=css.read_bytes()
          assert blob(b)=='2002ea39f243a9cfa8236cec88c2d62f0cbe6db7'
          assert b.count(b'aspect-ratio:700/394')==1
          css.write_bytes(b.replace(b'aspect-ratio:700/394',b'aspect-ratio:3074/1728',1))
          assert source.read_bytes()==original
          report={'scope':'council-photo-resolution-only','sourceMaster':str(source),'sourceBlobSha':blob(original),'sourceDimensions':[3074,1728],'previousDimensions':[700,394],'previousBytes':len(previous),'deliveryPath':str(target),'deliveryDimensions':list(decoded.size),'deliveryBytes':target.stat().st_size,'deliverySha256':hashlib.sha256(target.read_bytes()).hexdigest(),'losslessVisiblePixelEquality':True,'generation':False,'upscaling':False,'crop':False,'caption':caption,'namesAndRolesUnchanged':True,'originalMasterUnchanged':True,'layoutMaxWidthUnchanged':700,'publicAccess':'Not tested by this local-build job; existing authentication settings remain unchanged.'}
          (out/'source-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          Path('docs/change-requests/CR-20261005-GCSDA-COUNCIL-RESOLUTION.md').write_text('# Council photo resolution correction\n\nOwner request: 策略治理聯席會成員團體照你的解析度太低了\n\nImplementation: Restore the existing group-001.png master at native 3074 x 1728 resolution using lossless WebP, replacing the 700 x 394, 12706-byte embedded thumbnail. Original master remains byte-identical; visible pixels are verified identical after encoding. Other source candidates were excluded because their arrangement differs. No AI generation, facial editing, retouching, crop or upscaling.\n\nKeep the existing 700px figure container, all names, roles, order, caption, alt, navigation, author profile and STT files unchanged. The original PNG canvas is retained in full, without the old thumbnail delivery padding. Only image delivery and its intrinsic aspect ratio change.\n\nCaption preserved: '+caption+'\n\nAsset: /images/gcsda-council-members-original-3074.webp\nMaster git blob: '+blob(original)+'\n\nBuild and responsive evidence: docs/qa/COUNCIL_RESOLUTION_20261005.json. Public unauthenticated access is a separate known blocker; no deployment protection or routing change is authorized by this correction. This record does not assert whole-site BUILD_LOCK.\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git diff --check
      - name: Build and prepare browser
        run: |
          npm ci
          npm run build
          npm install --prefix /tmp/council-browser playwright agent-browser
          /tmp/council-browser/node_modules/.bin/playwright install --with-deps chromium
          /tmp/council-browser/node_modules/.bin/agent-browser install
          nohup node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4174 >/tmp/council-preview.log 2>&1 &
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          /tmp/council-browser/node_modules/.bin/agent-browser open http://127.0.0.1:4174/council
          /tmp/council-browser/node_modules/.bin/agent-browser snapshot -i >council-resolution-qa/interactive-snapshot.txt
          /tmp/council-browser/node_modules/.bin/agent-browser close
      - name: Test high-density desktop tablet and mobile
        run: |
          cat >/tmp/council-browser/verify.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path'),assert=require('assert/strict');
          const out=path.join(process.env.GITHUB_WORKSPACE,'council-resolution-qa');
          const source=JSON.parse(fs.readFileSync(path.join(out,'source-report.json'),'utf8'));
          (async()=>{
            const browser=await chromium.launch({headless:true});const results=[];
            try{
              for(const [label,width,height,dpr] of [['desktop',1440,1000,2],['tablet',768,1024,2],['mobile',390,844,3]]){
                const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:dpr});
                const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:4174/council',{waitUntil:'networkidle'});
                const image=page.locator('[data-gcsda-council-photo]');await image.evaluate(im=>im.decode());
                const info=await image.evaluate(im=>({naturalWidth:im.naturalWidth,naturalHeight:im.naturalHeight,displayWidth:im.getBoundingClientRect().width,displayHeight:im.getBoundingClientRect().height,src:im.getAttribute('src'),fit:getComputedStyle(im).objectFit,filter:getComputedStyle(im).filter}));
                assert.equal(info.naturalWidth,3074);assert.equal(info.naturalHeight,1728);
                assert.equal(info.src,'/images/gcsda-council-members-original-3074.webp');
                assert(info.naturalWidth>=info.displayWidth*dpr);assert.equal(info.fit,'contain');assert.equal(info.filter,'none');
                assert.equal(await page.locator('.g4-council-photo figcaption').textContent(),source.caption);
                assert.equal(await page.locator('[data-council-photo-identification] .g4-person').count(),8);assert.deepEqual(errors,[]);
                const figure=page.locator('.g4-council-photo');await figure.scrollIntoViewIfNeeded();
                await figure.screenshot({path:path.join(out,label+'-restored.png')});
                if(label==='desktop'){
                  await image.evaluate(async(im,data)=>{im.src=data;await im.decode();},fs.readFileSync(path.join(out,'previous-data-url.txt'),'utf8'));
                  await figure.screenshot({path:path.join(out,'desktop-previous.png')});
                }
                results.push({label,viewport:{width,height,dpr},image:info,captionExact:true,memberCount:8,pageErrors:errors});await context.close();
              }
              const report={...source,status:'BUILD_AND_RESPONSIVE_PASS',checkedAt:new Date().toISOString(),results};
              fs.writeFileSync(path.join(out,'verification.json'),JSON.stringify(report,null,2));
              fs.mkdirSync('docs/qa',{recursive:true});fs.writeFileSync('docs/qa/COUNCIL_RESOLUTION_20261005.json',JSON.stringify(report,null,2)+'\n');
              fs.unlinkSync(path.join(out,'previous-data-url.txt'));console.log(JSON.stringify(report,null,2));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/council-browser/verify.cjs
      - name: Commit only tested resolution changes without force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/gcsda-council-members-original-3074.webp src/GCSDAStandaloneV3.tsx src/styles/cis-page-system.css docs/change-requests/CR-20261005-GCSDA-COUNCIL-RESOLUTION.md docs/qa/COUNCIL_RESOLUTION_20261005.json
          test "$(git diff --cached --name-only | wc -l)" = 5
          git diff --cached --check
          git commit -m 'fix: restore council photograph from lossless native-resolution master'
          git push origin HEAD:gcsda-release-20261005
          git rev-parse HEAD >council-resolution-qa/release-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: council-photo-resolution-correction
          path: council-resolution-qa
          retention-days: 14
