name: STT verify four Heyzine research cover mappings
on:
  push:
    paths:
      - ".github/workflows/stt-audit-heyzine-cover-mapping.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout official STT research covers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect four public Heyzine thumbnails and compare with canonical cover art
        shell: bash
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy
          python3 - <<'PY'
          import io,json,urllib.request
          import numpy as np
          from PIL import Image,ImageOps
          from pathlib import Path
          ids=['0793d084ff','eba7786a8a','df41ab25a0','1631fcf2b8']
          ref={}
          for n in ['01','02','03','04']:
              p=Path('public/research-covers/series-'+n+'.webp')
              with Image.open(p) as im:
                  ref[n]=np.asarray(ImageOps.fit(im.convert('RGB'),(160,220)).convert('RGB'),dtype=float)/255.0
          results=[]
          for id in ids:
              u=f'https://cdn.heyzine.com/flip-book/cover/{id}.jpg'
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; ResearchCoversAudit/1.0)'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      raw=response.read()
                  with Image.open(io.BytesIO(raw)) as im:
                      src=ImageOps.fit(im.convert('RGB'),(160,220))
                      a=np.asarray(src,dtype=float)/255.0
                      scores={n:round(float(np.sqrt(((a-r)**2).mean())),4) for n,r in ref.items()}
                      order=sorted(scores,key=scores.get)
                      rec={'id':id,'status':'fetched','size':im.size,'rmse':scores,'best':order[0],'gap':round(scores[order[1]]-scores[order[0]],4)}
              except Exception as e:
                  rec={'id':id,'status':'error','error':str(e)}
              print('HEYZINE_MAPPING '+json.dumps(rec,ensure_ascii=False),flush=True)
              results.append(rec)
          if len([x for x in results if x['status']=='fetched'])==4:
              mapped=[x['best'] for x in results]
              print('ALL_FOUR_UNIQUE',len(set(mapped))==4,'MAPPED_ORDER',mapped,flush=True)
          else:
              print('NOT_ALL_THUMBNAILS_READABLE',flush=True)
          PY
