name: Test approved portrait rendition transfer
on:
  push:
    branches: [fix/stt-current-uploaded-visuals-20260914]
    paths: [.github/workflows/test-canva-current-asset-transfer.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe signed Canva portrait rendition
        shell: bash
        run: |
          set -u
          thumb='https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ff2c85f4b-3435-482f-a5e2-4d9f34bb605c/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAHb8qQIDKun_MSIZFpENSBlVcXWYW_yLBqt5fSHMviaM&exp=1789363014&osig=AAAAAAAAAAAAAAAAAAAAANJEcvMyXGtMEWOUJSS7IL95lBaDKZTa-Q4jZ1CslOxi&signer=media-rpc&x-canva-quality=thumbnail'
          native='https://media.canva.com/v2/image-resize/format:PNG/height:2048/quality:100/uri:ifs%3A%2F%2FM%2Ff2c85f4b-3435-482f-a5e2-4d9f34bb605c/watermark:F/width:1365?csig=AAAAAAAAAAAAAAAAAAAAAHb8qQIDKun_MSIZFpENSBlVcXWYW_yLBqt5fSHMviaM&exp=1789363014&osig=AAAAAAAAAAAAAAAAAAAAANJEcvMyXGtMEWOUJSS7IL95lBaDKZTa-Q4jZ1CslOxi&signer=media-rpc&x-canva-quality=thumbnail'
          for kind in thumb native; do
            url="$thumb"; [ "$kind" = native ] && url="$native"
            code=$(curl -L -sS -o "/tmp/$kind.png" -w '%{http_code}' "$url" || true)
            echo "$kind HTTP=$code bytes=$(wc -c < /tmp/$kind.png 2>/dev/null || echo 0)"
            file "/tmp/$kind.png" || true
          done
