name: Audit Humanistic Netlify Exact Source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-humanistic-netlify-exact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing Humanistic deployment without assuming asset paths
        shell: bash
        run: |
          set -euo pipefail
          root='https://fluffy-crumble-cd749c.netlify.app'
          curl -fL --retry 2 --connect-timeout 20 --max-time 120 "$root/" -o /tmp/humanistic-index.html
          echo 'ROOT SHA256:'
          sha256sum /tmp/humanistic-index.html
          echo 'EXPECTED ORIGINAL INDEX SHA256: 672ce2789a433177d40e230b4b80a2faae1d0878f82535f88a3e663e54955d0f'
          echo 'TITLE:'
          grep -o '<title>[^<]*' /tmp/humanistic-index.html | head -1 || true
          echo 'REFERENCED ASSETS:'
          grep -Eo '(src|href)=["'"'][^"'"']+["'"']' /tmp/humanistic-index.html | sed -E 's/^(src|href)=["'"']|["'"']$//g' | sort -u || true
          echo 'STATION REFERENCES:'
          grep -Eo '[^"'"']*station-[0-9][0-9][^"'"']*' /tmp/humanistic-index.html | sort -u || true
