name: Preserve white canvas in reviewed native council image
'on':
  push:
    branches: [gcsda-photo-resolution-review-20261005]
    paths: ['.github/workflows/council-master-pixels-review.yml']
permissions:
  contents: write
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Apply reviewed deterministic background treatment on review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet Pillow numpy opencv-python-headless
          mkdir -p council-master-review
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import urllib.request,urllib.parse,io,hashlib,json,base64,os
          import numpy as np,cv2
          repo='pc5888pc5888/STT-003';branch='gcsda-photo-resolution-review-20261005'
          api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'STT-scoped-image-correction'}
          def request(path,body=None):
              req=urllib.request.Request(api+path,data=None if body is None else json.dumps(body).encode(),headers=headers,method='GET' if body is None else 'PUT')
              return json.load(urllib.request.urlopen(req,timeout=90))
          def meta(path):return request('/contents/'+path+'?ref='+branch)
          def read(path):return base64.b64decode(meta(path)['content'])
          def write(path,data,message):
              old=meta(path)
              result=request('/contents/'+path,{'message':message,'branch':branch,'sha':old['sha'],'content':base64.b64encode(data).decode()})
              return result['commit']['sha']
          raw=urllib.request.urlopen('https://raw.githubusercontent.com/'+repo+'/d47ac47d6bf5e434ec34596f964a933b3ea03ceb/public/images/group-001.png',timeout=60).read()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='7c0eb2002173a4badbcdd189614afec097be2997'
          im=Image.open(io.BytesIO(raw)).convert('RGBA');assert im.size==(3074,1728)
          rgba=np.asarray(im)
          rgb=np.asarray(Image.alpha_composite(Image.new('RGBA',im.size,'white'),im).convert('RGB'))
          mask=np.all(rgba[:,:,:3]==0,axis=2).astype('uint8')
          _,labels,_,_=cv2.connectedComponentsWithStats(mask,connectivity=4)
          edge_ids=set(np.r_[labels[0],labels[-1],labels[:,0],labels[:,-1]].tolist())-{0}
          background=np.isin(labels,list(edge_ids));assert int(background.sum())==2159519
          output=rgb.copy();output[background]=255
          assert np.array_equal(output[~background],rgb[~background])
          assert hashlib.sha256(output.tobytes()).hexdigest()=='0c618cbbe887a25d3cea438aa727b68af722304e0ce348b2307004cfbe53e012'
          image=Image.fromarray(output)
          buf=io.BytesIO();image.save(buf,format='WEBP',lossless=True,quality=100,method=6)
          asset=buf.getvalue();assert Image.open(io.BytesIO(asset)).convert('RGB').tobytes()==output.tobytes()
          out=Path('council-master-review');(out/'final-3074.webp').write_bytes(asset)
          preview=image.copy();preview.thumbnail((1400,1000));preview.save(out/'final-white-preview.png')
          qa_path='docs/qa/COUNCIL_RESOLUTION_20261005.json';report=json.loads(read(qa_path))
          report.update(deliveryBytes=len(asset),deliverySha256=hashlib.sha256(asset).hexdigest(),losslessVisiblePixelEquality=False,losslessEncodingEquality=True,protectedForegroundPixelEquality=True,backgroundPixelsRestoredToWhite=int(background.sum()),backgroundMethod='Only edge-connected exactly-black source matte; no other visible pixels changed.',finalRgbSha256=hashlib.sha256(output.tobytes()).hexdigest(),status='NATIVE_RESOLUTION_AND_WHITE_CANVAS_REVIEWED',publicAccess='Unauthenticated access remains blocked; final public deployment must be checked separately.')
          report['responsiveEvidence']='Existing three-viewport application test remains valid for unchanged markup, dimensions and caption; final asset RGB was independently reviewed after white-canvas preservation.'
          (out/'final-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          cr_path='docs/change-requests/CR-20261005-GCSDA-COUNCIL-RESOLUTION.md'
          cr='# Council photograph resolution restoration\n\nOwner requested correction of the low-resolution council photograph.\n\nSource: existing public/images/group-001.png, native 3074 x 1728, git blob 7c0eb2002173a4badbcdd189614afec097be2997. The original source file remains byte-identical.\n\nThe old website used a 700 x 394, 12706-byte embedded thumbnail. The corrected delivery asset retains native 3074 x 1728 resolution and is losslessly encoded as WebP. No enlargement, crop, AI generation, face reconstruction or professional-identity changes.\n\nWhite-canvas preservation: manual review found that the native file contains an opaque black exterior matte, unlike the prior white-background website image. Only the edge-connected exactly-black background was set to white. All other visible pixel values remain exactly unchanged. Interior disconnected dark regions and all non-black pixels were not altered. Final decoded RGB SHA-256: 0c618cbbe887a25d3cea438aa727b68af722304e0ce348b2307004cfbe53e012.\n\nThe full original canvas is retained without the old thumbnail padding. The 700px figure container, member list, roles, ordering, approved caption, alt, navigation, other association pages and all STT files are unchanged.\n\nCaption: 策略治理聯席會成員團體照，人物辨識依照片由左至右列示如下。（學會提供）\n\nAsset path: /images/gcsda-council-members-original-3074.webp\n\nThree high-density viewport tests validated native image dimensions, full containment, caption equality and eight member cards. Final white delivery pixels were reviewed independently. Vercel login restrictions are not changed; this record does not assert full public accessibility or whole-site BUILD_LOCK.\n'
          commits=[]
          commits.append(write('public/images/gcsda-council-members-original-3074.webp',asset,'fix: preserve white canvas and original foreground pixels at native resolution'))
          commits.append(write(qa_path,(json.dumps(report,ensure_ascii=False,indent=2)+'\n').encode(),'qa: record native image foreground and white-canvas verification'))
          commits.append(write(cr_path,cr.encode(),'docs: record reviewed high-resolution council photo delivery'))
          (out/'commits.json').write_text(json.dumps(commits,indent=2));print(json.dumps({'commits':commits,'bytes':len(asset),'foregroundPreserved':True}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: council-native-white-reviewed
          path: council-master-review
          retention-days: 14
