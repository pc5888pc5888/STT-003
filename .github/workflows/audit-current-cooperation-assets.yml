name: Audit current cooperation background and portrait candidates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-current-cooperation-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, 'audit: record cooperation asset ranking') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rank repository images against the two user-approved cooperation assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy
          mkdir -p .audit
          python - <<'PY' > .audit/current-cooperation-rank.txt
          from pathlib import Path
          from PIL import Image
          import numpy as np, hashlib

          targets={
            'background':'8801a54485648524a6c485b585259526955a9cd998cc844c844d87cdb0098c03',
            'portrait':'13c001a9032303cb23f50b701138131f3dcb19231997019b0d970a62586b2068',
          }

          def normalize(im):
              im=im.convert('RGBA')
              box=im.getchannel('A').getbbox()
              if box: im=im.crop(box)
              base=Image.new('RGBA',im.size,(255,255,255,255))
              base.alpha_composite(im)
              return base.convert('L')

          def dhash(path,hs=16):
              im=normalize(Image.open(path)).resize((hs+1,hs),Image.Resampling.LANCZOS)
              a=np.asarray(im); d=a[:,1:]>a[:,:-1]
              return int(''.join('1' if x else '0' for x in d.flatten()),2)

          candidates=[]
          for p in Path('public').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.png','.jpg','.jpeg','.webp'}: continue
              try:
                  candidates.append((p,dhash(p),Image.open(p).size,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()))
              except Exception:
                  pass

          for label,target_hex in targets.items():
              target=int(target_hex,16)
              print(f'### {label}')
              rows=sorted(((target^h).bit_count(),str(p),size,bytes_,sha) for p,h,size,bytes_,sha in candidates)[:25]
              for row in rows: print(*row)
              print()
          PY
      - name: Commit audit evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Visual Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add .audit/current-cooperation-rank.txt
          git commit -m 'audit: record cooperation asset ranking [skip ci]'
          git push origin HEAD:main
