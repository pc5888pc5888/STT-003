name: STT Primary Production Verification
on:
  push:
    branches: [main]
    paths:
      - 'src/components/STTPageHero.tsx'
      - 'src/components/FullBleedHero.tsx'
      - 'src/components/AccessibilityWidget.tsx'
      - 'src/pages/HomeCanonical.tsx'
      - 'src/pages/Cooperation.tsx'
      - 'src/styles/stt-mobile-first-editorial.css'
      - 'public/humanistic-interview/stt-mobile-bridge.css'
      - 'public/humanistic-interview/index.html'
      - 'scripts/test_mobile_editorial.mjs'
      - 'public/data/stt-primary-release.json'
      - '.github/workflows/stt-primary-production.yml'
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for this release on the fixed public URL
        run: |
          python - <<'PY'
          import urllib.request,json,time
          from pathlib import Path
          expected=json.loads(Path('public/data/stt-primary-release.json').read_text())
          for i in range(60):
              try:
                  request=urllib.request.Request('https://stt-003.vercel.app/data/stt-primary-release.json?check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  result=json.loads(urllib.request.urlopen(request,timeout=15).read())
                  if result==expected:print('Expected release is publicly served.');break
              except Exception:pass
              time.sleep(5)
          else:raise SystemExit('Fixed domain has not served the expected release; production not verified.')
          PY
      - name: Verify the live website without mocked data
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix /tmp/stt-browser --no-save playwright
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export STT_TEST_ORIGIN=https://stt-003.vercel.app
          node scripts/test_mobile_editorial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-mobile-editorial-production-evidence
          path: mobile-editorial-evidence/
          retention-days: 14
