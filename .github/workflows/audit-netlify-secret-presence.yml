name: Audit Netlify secret presence

on:
  push:
    branches: [fix/stt-current-uploaded-visuals-20260914]
    paths:
      - .github/workflows/audit-netlify-secret-presence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_HUMANISTIC_SITE_ID: ${{ secrets.NETLIFY_HUMANISTIC_SITE_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for key in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID NETLIFY_TOKEN NETLIFY_HUMANISTIC_SITE_ID RESEND_API_KEY; do
            if [ -n "${!key:-}" ]; then echo "$key=PRESENT"; else echo "$key=ABSENT"; fi
          done
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          urls=[
            'https://api.netlify.com/api/v1/sites/shimmering-longma-509244.netlify.app',
            'https://api.netlify.com/api/v1/sites/f8c02cb6-8da1-4177-8057-67dce48cb86e',
          ]
          for url in urls:
            try:
              with urlopen(Request(url,headers={'User-Agent':'STT-Governance-Audit/1.0'}),timeout=30) as r:
                b=r.read(2000)
                print('PUBLIC_API',url,r.status,b.decode('utf-8','replace'))
            except HTTPError as e:
              print('PUBLIC_API',url,'HTTP',e.code,e.read(1000).decode('utf-8','replace'))
            except Exception as e:
              print('PUBLIC_API',url,'ERROR',type(e).__name__,str(e))
          PY
