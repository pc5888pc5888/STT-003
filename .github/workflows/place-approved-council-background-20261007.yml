name: Place owner-approved council background portrait
'on':
  push:
    branches: [gcsda-release-20261005]
    paths: ['.github/workflows/place-approved-council-background-20261007.yml']
permissions:
  contents: write
jobs:
  publish-approved-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Receive approved image and verify exact original bytes
        env:
          APPROVED_ASSET_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-76a0-820b-9ead-e1848bffa1ee/raw?se=2026-10-07T02%3A05%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=3e718342-23b8-5609-b665-7ca8e7e153b6&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T20%3A43%3A17Z&ske=2026-10-07T20%3A43%3A17Z&sks=b&skv=2026-02-06&sig=uEa%2BqNxuF5dt7WQVOPkxcWtrGmmFGvUwKG0U5u70TNI%3D'
        run: |
          python3 - <<'PY'
          import hashlib, os, struct, urllib.request
          from pathlib import Path
          data=urllib.request.urlopen(os.environ['APPROVED_ASSET_URL'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()=='908ea4dbcf5e15e26e3760760f7362b9c020426fcf879b0a69cf8c0e76f2791f'
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',data[16:24])==(1672,941)
          Path('/tmp/gcsda-approved-master.png').write_bytes(data)
          PY
      - uses: actions/checkout@v4
        with:
          ref: gcsda-release-20261005
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the approved asset, display sizing and scoped amendment
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          p=Path('src/GCSDAStandaloneV3.tsx')
          before=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest()=='4614e70c58623f2fedde6db48379d98fda485e21','Source changed; stop rather than overwrite'
          text=before.decode()
          replacements=[('/images/gcsda-council-members-original-3074.webp','/images/gcsda-council-approved-background-1672.png'),('width="3074" height="1728"','width="1672" height="941"'),('<div className="g4-council-evidence">','<div className="g4-council-evidence" id="council-members">')]
          for old,new in replacements:
              assert text.count(old)==1,(old,text.count(old))
              text=text.replace(old,new,1)
          caption='策略治理聯席會成員團體照，人物辨識依照片由左至右列示如下。（學會提供）'
          assert caption in text
          p.write_text(text,encoding='utf-8')
          css=Path('src/styles/cis-page-system.css')
          before_css=css.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(before_css)).encode()+b'\0'+before_css).hexdigest()=='7a0b28485f50a44f42fd2c82484c639926f84f70','Styles changed; stop rather than overwrite'
          text=before_css.decode()
          old='#root .g4-council-photo{margin:30px auto 0;max-width:700px;'
          assert text.count(old)==1
          text=text.replace(old,'#root .g4-council-photo{margin:30px auto 0;max-width:860px;',1)
          assert text.count('aspect-ratio:3074/1728')==1
          text=text.replace('aspect-ratio:3074/1728','aspect-ratio:1672/941',1)
          css.write_text(text,encoding='utf-8')
          image=Path('public/images/gcsda-council-approved-background-1672.png')
          assert not image.exists()
          image.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile('/tmp/gcsda-approved-master.png',image)
          registry={'assetId':'GCSDA-COUNCIL-APPROVED-BACKGROUND-20261007','status':'OWNER_APPROVED','sourceFilename':'策略治理聯席會企業合影.png','sourceFileId':'file_0000000081c481fd98efff78acd537f1','sourceType':'owner-approved AI-assisted background composite; not an event photograph','approval':'User approved this specific image and instructed high-resolution website placement, then requested direct website execution.','path':'/images/gcsda-council-approved-background-1672.png','width':1672,'height':941,'bytes':image.stat().st_size,'sha256':hashlib.sha256(image.read_bytes()).hexdigest(),'decodedRgbSha256':'3a726a3598772c76f3693cd79d158be5755ce499f893503eda3a6a44b59bf713','processing':'None: original PNG copied byte-for-byte. No generation, face editing, upscaling, crop, sharpen or recompression.','route':'/council#council-members','caption':caption,'oldAssetRetained':'/images/gcsda-council-members-original-3074.webp'}
          reg=Path('docs/assets/GCSDA_COUNCIL_APPROVED_BACKGROUND_20261007.json');reg.parent.mkdir(parents=True,exist_ok=True);reg.write_text(json.dumps(registry,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          cr=Path('docs/change-requests/CR-20261007-GCSDA-COUNCIL-APPROVED-BACKGROUND.md')
          cr.write_text('\n'.join(['# CR-20261007-GCSDA-COUNCIL-APPROVED-BACKGROUND','','Status: OWNER APPROVED / BUILT-SITE QA REQUIRED BEFORE COMMIT; live public acceptance is separate.','Approved source: 策略治理聯席會企業合影.png, file_0000000081c481fd98efff78acd537f1.','Owner instruction: 好喔請以高解析度放置網站中; 直接給我正確網站內容.','','## Scope and authority','Replace only the /council body group illustration with the specific approved professional-background composite. This is the expressly approved VIS-001 asset replacement and a narrow exception to the prior GCSDA visual-map no-dark/composite restriction for this one body image only. It does not authorize dark site styling or replacement of institutional Hero assets.','The reference is a designed composite, not proof of a real meeting, office location or photographed event. No new claim about an event or facility is added.','Keep all existing names, roles, ordering, caption, alt, other locked copy, header logo, navigation and STT pages. Do not change any person pixels in the approved PNG.','','## Before and after','Before: /images/gcsda-council-members-original-3074.webp in a 700px figure.','After: /images/gcsda-council-approved-background-1672.png, exact original 1672x941 PNG, in a responsive maximum 860px figure. The 830px desktop image supports 2x pixel density without source enlargement.','Add the non-navigational #council-members anchor to the existing body section. No route changes.','Caption retained: '+caption,'Original white image retained for traceability; no deletion or replacement of its bytes.','','## Asset registry and acceptance','Registry: docs/assets/GCSDA_COUNCIL_APPROVED_BACKGROUND_20261007.json.','Require PNG SHA-256 equality to approved source, native dimensions, proportional containment, eight unchanged member cards, exact caption, desktop/tablet/mobile browser tests and a successful build.','Release branch remains gcsda-release-20261005. Never merge/promote the association over STT main.','Do not change project-wide deployment protection, plans, secrets, social channels, forms or infrastructure. Public accessibility and whole-site BUILD_LOCK must not be inferred from build success.','']),encoding='utf-8')
          PY
          git diff --check
      - name: Build unchanged application with approved asset
        run: |
          npm ci
          npm run build
          npm install --prefix /tmp/gcsda-browser playwright
          /tmp/gcsda-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify native image, caption and responsive rendering
        run: |
          mkdir -p approved-council-qa
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 > /tmp/gcsda-preview.log 2>&1 &
          cat > /tmp/gcsda-browser/verify.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');const assert=require('assert/strict');const crypto=require('crypto');
          const caption='策略治理聯席會成員團體照，人物辨識依照片由左至右列示如下。（學會提供）';
          (async()=>{const browser=await chromium.launch({headless:true});const results=[];try{
            for(const [label,width,height,dpr] of [['desktop',1440,1000,2],['tablet',768,1024,2],['mobile',390,844,3]]){
              const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:dpr});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4173/council#council-members',{waitUntil:'networkidle'});
              const img=page.locator('[data-gcsda-council-photo]');await img.waitFor();await img.evaluate(i=>i.decode());
              const info=await img.evaluate(i=>{const r=i.getBoundingClientRect(),c=getComputedStyle(i);return {src:i.getAttribute('src'),naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,width:r.width,height:r.height,objectFit:c.objectFit,filter:c.filter,opacity:c.opacity,overflow:document.documentElement.scrollWidth>innerWidth+1};});
              assert.equal(info.src,'/images/gcsda-council-approved-background-1672.png');assert.equal(info.naturalWidth,1672);assert.equal(info.naturalHeight,941);assert.equal(info.objectFit,'contain');assert.equal(info.filter,'none');assert.equal(info.opacity,'1');assert(!info.overflow);assert(Math.abs(info.width/info.height-1672/941)<0.005);assert(info.width*dpr<=1672);
              assert.equal(await page.locator('.g4-council-photo figcaption').textContent(),caption);assert.equal(await page.locator('[data-council-photo-identification] .g4-person').count(),8);assert.deepEqual(errors,[]);
              const names=await page.locator('[data-council-photo-identification] .g4-person h3').allTextContents();assert.deepEqual(names,['林柏劭 律師','林政男 律師','劉煒達 律師','莊鈞翔 博士','高毓謙 律師','黃朝福 會計師','謝秉錡 律師','賴祺元 律師']);
              const response=await context.request.get('http://127.0.0.1:4173'+info.src);assert.equal(response.status(),200);assert.equal(crypto.createHash('sha256').update(await response.body()).digest('hex'),'908ea4dbcf5e15e26e3760760f7362b9c020426fcf879b0a69cf8c0e76f2791f');
              await page.locator('#council-members').screenshot({path:`approved-council-qa/${label}-section.png`});await page.screenshot({path:`approved-council-qa/${label}-page.png`,fullPage:true});results.push({label,viewport:{width,height,dpr},...info,names,caption});await context.close();
            }
            fs.writeFileSync('approved-council-qa/built-report.json',JSON.stringify({status:'PASS',scope:'approved-council-image-only',checkedAt:new Date().toISOString(),results},null,2));
          }finally{await browser.close();}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/gcsda-browser/verify.cjs
      - name: Commit only verified publication changes and remove one-time transfer runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GCSDAStandaloneV3.tsx src/styles/cis-page-system.css public/images/gcsda-council-approved-background-1672.png docs/assets/GCSDA_COUNCIL_APPROVED_BACKGROUND_20261007.json docs/change-requests/CR-20261007-GCSDA-COUNCIL-APPROVED-BACKGROUND.md
          git rm .github/workflows/place-approved-council-background-20261007.yml
          test "$(git diff --cached --name-only | wc -l)" = 6
          git diff --cached --check
          git commit -m 'publish: use exact owner-approved council background portrait at native resolution'
          git push origin HEAD:gcsda-release-20261005
          git rev-parse HEAD > approved-council-qa/release-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-council-background-evidence-20261007
          path: approved-council-qa
          retention-days: 30
