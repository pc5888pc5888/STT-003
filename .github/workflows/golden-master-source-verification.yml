name: Golden Master source-true verification
on:
  push:
    branches: [stt-convergence-20260923]
    paths: [.github/workflows/golden-master-source-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: stt
            ref: stt-convergence-20260923
            routes: '/,/problems,/how-stt-works,/engagement,/insights,/about,/eric-chuang,/institutions,/start,/privacy,/professional-boundary,/research,/books,/books/internal-compliance'
          - site: gcsda
            ref: gcsda-convergence-20260923
            routes: '/,/about,/governance,/council,/membership,/events,/knowledge,/charter,/privacy'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual branch
        run: |
          mkdir -p /tmp/golden
          git rev-parse HEAD > /tmp/golden/source-sha.txt
          npm ci > /tmp/golden/install.log 2>&1
          npm run lint > /tmp/golden/typecheck.log 2>&1
          npm run build > /tmp/golden/build.log 2>&1
          node --experimental-strip-types --test tests/*.test.mjs > /tmp/golden/unit-tests.log 2>&1
          npm install --no-save --package-lock=false playwright > /tmp/golden/browser-install.log 2>&1
          npx playwright install --with-deps chromium > /tmp/golden/browser-setup.log 2>&1
      - name: Browser verification from built site
        env:
          SITE: ${{ matrix.site }}
          ROUTES: ${{ matrix.routes }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/golden/server.log 2>&1 &
          cat > .golden-check.mjs <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';
          const site=process.env.SITE,routes=process.env.ROUTES.split(',');
          const browser=await chromium.launch({headless:true}),results=[];
          for(const [label,width,height] of [['desktop',1440,1000],['tablet',820,1100],['mobile',390,844]]){
            const context=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});
            const page=await context.newPage();
            for(const route of routes){
              const errors=[];const h=e=>errors.push(e.message);page.on('pageerror',h);
              try{
                const response=await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle',timeout:30000});
                await page.evaluate(()=>document.fonts.ready);
                await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await new Promise(r=>setTimeout(r,25));}scrollTo(0,0);});
                await page.waitForTimeout(120);
                const state=await page.evaluate(()=>{
                  const hero=document.querySelector('.cis-hero'),img=hero?.querySelector('img'),r=img?.getBoundingClientRect(),copy=hero?.querySelector('.cis-hero-copy'),cs=copy?getComputedStyle(copy):null;
                  return {
                    h1:[...document.querySelectorAll('h1')].map(x=>x.textContent?.trim()),
                    overflow:document.documentElement.scrollWidth>innerWidth+1,
                    heroSrc:img?.getAttribute('src')||null,
                    heroLoaded:img?img.complete&&img.naturalWidth>0:null,
                    heroRect:r?[Math.round(r.left),Math.round(r.width),Math.round(r.height)]:null,
                    natural:[img?.naturalWidth||0,img?.naturalHeight||0],
                    copyBg:cs?.backgroundColor||null,
                    broken:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),
                    header:[...document.querySelectorAll('header a')].map(a=>({text:a.textContent?.trim(),href:a.getAttribute('href'),cls:a.className})),
                    links:[...document.querySelectorAll('a[href]')].map(a=>({text:a.textContent?.trim(),href:a.getAttribute('href')}))
                  };
                });
                const fullWidth=state.heroRect?Math.abs(state.heroRect[0])<=2&&Math.abs(state.heroRect[1]-width)<=2:true;
                const cardOk=!state.heroSrc||label!=='desktop'||['rgba(0, 0, 0, 0)','transparent'].includes(state.copyBg);
                const passed=response?.status()===200&&state.h1.length===1&&!state.overflow&&!state.broken.length&&!errors.length&&fullWidth&&cardOk;
                results.push({route,label,width,...state,fullWidth,cardOk,errors,passed});
                if(label==='desktop'&&['/','/problems','/how-stt-works','/engagement','/insights','/about','/eric-chuang','/institutions','/start','/membership','/knowledge','/books'].includes(route))await page.screenshot({path:`/tmp/golden/${site}-${route==='/'?'home':route.slice(1).replaceAll('/','-')}.png`,fullPage:true});
              }catch(error){results.push({route,label,width,error:String(error),passed:false});}
              page.off('pageerror',h);
            }
            await context.close();
          }
          if(site==='stt'){
            const home=results.find(x=>x.route==='/'&&x.label==='desktop');
            if(!home.header.some(x=>x.text==='開始治理判讀'&&x.href==='/start'))results.push({check:'STT primary CTA',passed:false});
            const eric=results.find(x=>x.route==='/eric-chuang'&&x.label==='desktop');
            if(eric?.heroSrc!=='/visual-approved/eric-page-owner-original.png')results.push({check:'owner portrait path',passed:false,actual:eric?.heroSrc});
            const raw=await (await fetch('http://127.0.0.1:4173/visual-approved/eric-page-owner-original.png')).arrayBuffer();
            const sha=createHash('sha256').update(Buffer.from(raw)).digest('hex');
            results.push({check:'owner portrait exact bytes',sha,passed:sha==='891c3d1b19ba4ac32792543928473f0938fae0bfe529d1ac46e3dabf34f780fe'});
            const eng=results.find(x=>x.route==='/engagement'&&x.label==='desktop');
            results.push({check:'engagement approved visual 34',actual:eng?.heroSrc,passed:eng?.heroSrc==='/visual-approved/bank-14.png'});
            const startPage=results.find(x=>x.route==='/start'&&x.label==='desktop');
            results.push({check:'start has approved intake/cooperation visual',actual:startPage?.heroSrc,passed:startPage?.heroSrc==='/visual-bank/stt/cooperation-hero-20260917.png'});
            const method=results.find(x=>x.route==='/how-stt-works'&&x.label==='desktop');
            results.push({check:'method uses 9/15 Golden Reference visual',actual:method?.heroSrc,passed:method?.heroSrc==='/visual-bank/stt/user-approved-six/method.png'});
            const about=results.find(x=>x.route==='/about'&&x.label==='desktop');
            results.push({check:'about uses 9/15 Golden Reference visual',actual:about?.heroSrc,passed:about?.heroSrc==='/visual-bank/stt/user-approved-six/about-stt.png'});
            const navProbe=await (async()=>{const ctx=await browser.newContext({viewport:{width:1440,height:1000}});const p=await ctx.newPage();await p.goto('http://127.0.0.1:4173/how-stt-works',{waitUntil:'networkidle'});const v=await p.evaluate(()=>{const a=document.querySelector('.stt-g0-nav-link.is-active');if(!a)return null;const cs=getComputedStyle(a),after=getComputedStyle(a,'::after');return{border:cs.borderStyle,afterHeight:after.height,afterDisplay:after.display}});await ctx.close();return v;})();
            results.push({check:'STT active navigation is underline not box',actual:navProbe,passed:navProbe?.border==='none'&&navProbe?.afterHeight==='2px'});
            const inst=results.find(x=>x.route==='/institutions'&&x.label==='desktop');
            results.push({check:'institutions approved path-convergence visual',actual:inst?.heroSrc,passed:inst?.heroSrc==='/visual-approved/secondary-05.png'});
            const books=results.find(x=>x.route==='/books'&&x.label==='desktop');
            results.push({check:'both Heyzine publications on STT books',passed:books?.links.some(x=>x.href==='https://heyzine.com/flip-book/c700d8beb2.html'&&x.text?.includes('內在法遵'))&&books?.links.some(x=>x.href==='https://heyzine.com/flip-book/e424001f8c.html'&&x.text?.includes('2026 永續家族治理實務實錄'))});
          }else{
            const home=results.find(x=>x.route==='/'&&x.label==='desktop');
            results.push({check:'GCSDA primary CTA',passed:home?.header.some(x=>x.text==='申請入會'&&x.href==='/membership')});
            results.push({check:'STT is not GCSDA primary CTA',passed:!home?.header.some(x=>x.text?.includes('STT Governance')&&String(x.cls).includes('g4-join'))});
            const knowledge=results.find(x=>x.route==='/knowledge'&&x.label==='desktop');
            results.push({check:'family governance flipbook labeled by title',passed:knowledge?.links.some(x=>x.href==='https://heyzine.com/flip-book/e424001f8c.html'&&x.text?.includes('2026 永續家族治理實務實錄'))});
            const gcsdaDesktop=results.filter(x=>x.site===undefined?false:true);
            const gcsdaCore=results.filter(x=>x.label==='desktop');
            results.push({check:'GCSDA core pages do not use STT-style hero background art',passed:gcsdaCore.every(x=>!x.heroSrc),actual:gcsdaCore.map(x=>({route:x.route,heroSrc:x.heroSrc}))});
            const membership=results.find(x=>x.route==='/membership'&&x.label==='desktop');
            const membershipProbe=await (async()=>{const ctx=await browser.newContext({viewport:{width:1440,height:1200}});const p=await ctx.newPage();await p.goto('http://127.0.0.1:4173/membership',{waitUntil:'networkidle'});const v=await p.evaluate(()=>({brand:document.querySelector('.g4-brand img')?.getAttribute('src')||null,text:document.body.textContent||'',fields:document.querySelectorAll('#gcsda-membership-form input,#gcsda-membership-form select,#gcsda-membership-form textarea').length,activeBorder:document.querySelector('.g4-nav a.active')?getComputedStyle(document.querySelector('.g4-nav a.active')).borderStyle:null,activeAfter:document.querySelector('.g4-nav a.active')?getComputedStyle(document.querySelector('.g4-nav a.active'),'::after').height:null}));await ctx.close();return v;})();
            results.push({check:'GCSDA header uses institutional logo image',actual:membershipProbe?.brand,passed:membershipProbe?.brand==='/images/gcsda-logo.png'});
            results.push({check:'GCSDA membership is a real qualification application',actual:{fields:membershipProbe?.fields},passed:(membershipProbe?.fields||0)>=15&&['姓名','聯絡電話','電子郵件','現職單位／機構','主要專業領域','申請加入學會的原因','會員資格治理聲明'].every(t=>membershipProbe?.text.includes(t))});
            results.push({check:'GCSDA active navigation is underline not box',actual:{border:membershipProbe?.activeBorder,after:membershipProbe?.activeAfter},passed:membershipProbe?.activeBorder==='none'&&membershipProbe?.activeAfter==='2px'});
          }
          await browser.close();
          const failed=results.filter(x=>x.passed===false);
          fs.writeFileSync('/tmp/golden/results.json',JSON.stringify(results,null,2));
          fs.writeFileSync('/tmp/golden/summary.json',JSON.stringify({site,pages:routes.length,renders:routes.length*3,failed,productionChanged:false,realMailVerified:false},null,2));
          console.log(JSON.stringify({site,failed},null,2));
          if(failed.length)process.exitCode=1;
          JS
          node .golden-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-source-${{ matrix.site }}
          path: /tmp/golden/
          retention-days: 7
