name: Audit Humanistic privacy surface

on:
  push:
    paths:
      - '.github/workflows/audit-humanistic-privacy.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect privacy-relevant frontend code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/humanistic-interview/index.html')
          s=p.read_text(encoding='utf-8', errors='replace')
          print('length', len(s), 'lines', s.count('\n')+1)
          terms=['/api/humanistic-submit','localStorage','sessionStorage','participant_name','participant_email','送出','確認','review','q20']
          for term in terms:
              print('\n=== TERM:', term, '===')
              start=0
              hits=0
              while True:
                  i=s.find(term,start)
                  if i<0 or hits>=12: break
                  a=max(0,i-500); b=min(len(s),i+1200)
                  print(s[a:b].replace('\n','\\n'))
                  print('\n---')
                  start=i+len(term); hits+=1
              print('hits_shown', hits)
          PY
