name: Retire reviewed STT branches once
on:
  push:
    branches: [main]
    paths: [.github/workflows/retire-stt-branches-20261020.yml]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: stt-reviewed-branch-retirement-20261020
  cancel-in-progress: false
jobs:
  retire:
    if: github.repository == 'pc5888pc5888/STT-003' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: docs/qa
      - name: Archive trace evidence and delete only the 68 reviewed obsolete STT branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          """One-time owner-authorized retirement; no Vercel/Netlify credentials or browser."""
          import base64
          import datetime
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          REPO = 'pc5888pc5888/STT-003'
          API = 'https://api.github.com/repos/' + REPO
          REPORT = 'docs/qa/BRANCH-RETIREMENT-20261020.json'
          ARCHIVE = 'retired-stt-20261020/'
          NAMES = '''asset/cooperation-hero-transfer-20260916
          asset/stt-six-hero-selection-20260911
          design/stt-correct-hero-presentation-20260912
          feature/humanistic-20q-9feb5e
          feature/humanistic-20q-9feb5e-css-base
          fix/approved-hero-assets-20260917
          fix/approved-hero-assets-v2-20260917
          fix/approved-hero-assets-v3-20260917
          fix/humanistic-exact-static-20260912
          fix/humanistic-publish-exact-v2-20260912
          fix/humanistic-vercel-fallback-20260915
          fix/stt-current-uploaded-visuals-20260914
          fix/stt-distinct-hero-visuals-20260911
          fix/stt-exact-six-user-visuals-20260912
          fix/stt-final-user-approved-20260913
          fix/stt-food-only-20260911
          fix/stt-hero-native-dimensions-20260912
          fix/stt-hires-humanistic-20260911
          fix/stt-user-six-heroes-20260912
          fix/two-hero-display-20260917
          fix/user-exact-hero-backgrounds-20260917-direct
          fix/user-exact-hero-backgrounds-20260917-direct2
          fix/user-exact-hero-backgrounds-20260917-direct3
          fix/user-exact-hero-backgrounds-20260917-final-delivery
          fix/user-exact-hero-backgrounds-20260917-live
          fix/user-exact-hero-backgrounds-20260917-q70-final
          fix/user-exact-hero-backgrounds-20260917-q70-work
          fix/user-exact-hero-backgrounds-20260917-q70
          fix/user-exact-hero-backgrounds-20260917-stage
          fix/user-exact-hero-backgrounds-20260917
          fix-approved-heroes-20260916
          g0-global-shell-20260921
          g1-home-20260921
          g2-problems-20260921
          g3-method-20260921
          g4-engagement-20260923
          g5-about-eric-20260923
          g6-insights-20260923
          g7-institutions-20260923
          g8-start-utility-20260923
          g9-seo-aeo-a11y-20260923
          g10-final-acceptance-20260923
          preview/legal-mortgage-20260923-r2
          preview/legal-mortgage-20260923
          preview/two-hero-fix-20260917
          rebuild/stt-25-visuals-final-20260911
          rebuild/stt-approved-25-20260911
          rebuild/stt-approved-white-gold-v1
          rebuild/white-gold-governance-os-v1
          rebuild/white-gold-governance-os-v2-gold
          rebuild/white-gold-governance-os-v2
          rebuild/white-gold-governance-os-v3-assets
          revamp/stt-25-approved-visuals-20260911
          stt-convergence-20260923
          stt-cooperation-hero-20260916
          stt-final-approved-two-heroes-20260916
          stt-final-direct-assets-20260916
          stt-final-hero-local-assets-20260916
          stt-final-local-assets-20260916
          stt-local-static-assets-final
          stt-two-hero-delivery-20260917
          stt-two-heroes-20260917
          stt-two-heroes-clean-20260917
          temp-do-not-use
          temp-do-not-use-2
          tmp-ignore
          tmp-noop-do-not-use
          verify/stt-six-primary-20260912'''.splitlines()
          assert len(NAMES) == len(set(NAMES)) == 68
          assert all(n != 'main' and 'gcsda' not in n.lower() for n in NAMES)
          TOKEN = os.environ['GH_TOKEN']
          def api(path, method='GET', data=None, allow404=False):
              encoded = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(API + path, encoded, method=method, headers={
                  'Authorization': 'Bearer ' + TOKEN,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'STT-owner-authorized-retirement',
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  if allow404 and e.code == 404:
                      return None
                  raise RuntimeError(f'GitHub {method} {path}: HTTP {e.code}; stopped without changing permissions') from None
          def collection(path):
              rows = []
              for page in range(1, 21):
                  data = api(path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  rows.extend(data)
                  if len(data) < 100:
                      return rows
              raise RuntimeError('Pagination limit reached; no deletion permitted')
          def ref(kind, name):
              return api('/git/ref/' + kind + '/' + urllib.parse.quote(name, safe=''), allow404=True)
          def remote_heads():
              out = subprocess.check_output(['git', 'ls-remote', '--heads', 'origin'], text=True)
              return {r.split('\t')[1].removeprefix('refs/heads/'): r.split('\t')[0] for r in out.splitlines()}
          def write_report(report, old_sha=None):
              payload = {'message': 'docs: record owner-authorized branch retirement [mirror-skip]', 'branch': 'main',
                         'content': base64.b64encode((json.dumps(report, ensure_ascii=False, indent=2)+'\n').encode()).decode()}
              if old_sha:
                  payload['sha'] = old_sha
              return api('/contents/' + REPORT, 'PUT', payload)
          repo = api('')
          assert repo['id'] == 1244028440 and repo['default_branch'] == 'main' and not repo['private']
          assert os.environ['GITHUB_REPOSITORY'] == REPO and os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert api('/contents/' + REPORT, allow404=True) is None, 'One-time report already exists; review instead of rerunning'
          branches = {b['name']: b for b in collection('/branches')}
          heads = remote_heads()
          assert heads['main'] == os.environ['GITHUB_SHA'], 'main changed since authorized workflow started'
          assert all(heads[n] == b['commit']['sha'] for n,b in branches.items())
          selected = {n: heads[n] for n in NAMES if n in heads}
          assert len(selected) == 68, 'Branch inventory changed; do not broaden or guess'
          assert all(not branches[n]['protected'] for n in selected), 'Protected branch: stop, never change protection'
          pulls = collection('/pulls?state=open')
          for pr in pulls:
              related = {pr['head']['ref'], pr['base']['ref']}
              if related & selected.keys():
                  assert not any('gcsda' in n.lower() for n in related), 'GCSDA dependency: stop'
                  assert pr['head']['repo'] and pr['head']['repo']['full_name'] == REPO and pr['head']['ref'] in selected, 'Unrelated open PR depends on selected branch: stop'
          retained = {n: s for n,s in heads.items() if n not in selected}
          report = {'change_request':'CR-SINGLE-CURRENT-20261020-03', 'status':'PREPARED_NOT_DELETED',
                    'started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'workflow_run':os.environ['GITHUB_RUN_ID'], 'current_branch':'main',
                    'before_branch_count':len(heads), 'selected':selected, 'retained_before':retained,
                    'closed_pull_requests':[], 'archive_tags':[], 'deleted_branches':[],
                    'content_changes':'Only this audit report; no website source, API, assets or responses modified',
                    'netlify_status':'BLOCKED_NO_AUTHENTICATED_MANAGEMENT',
                    'vercel_deployment_deletion':'NOT_PERFORMED_BY_THIS_WORKFLOW'}
          written = write_report(report)
          report_sha = written['content']['sha']
          expected_main = written['commit']['sha']
          print('PREPARED_REPORT',len(selected),'candidate branches; main/GCSDA retained',flush=True)
          try:
              for name, sha in selected.items():
                  tag = ARCHIVE + name
                  existing = ref('tags',tag)
                  if existing is None:
                      api('/git/refs','POST',{'ref':'refs/tags/'+tag,'sha':sha})
                  assert ref('tags',tag)['object']['sha'] == sha, 'Archive mismatch; stop'
                  report['archive_tags'].append(tag)
              check = remote_heads()
              assert check['main'] == expected_main, 'main changed during retirement; stop'
              assert all(check.get(n) == s for n,s in selected.items()), 'Candidate changed; stop'
              assert all(check.get(n) == s for n,s in retained.items() if n != 'main'), 'Retained branch changed; stop'
              for pr in pulls:
                  if pr['head']['ref'] in selected:
                      result = api('/pulls/'+str(pr['number']),'PATCH',{'state':'closed'})
                      assert result['state'] == 'closed'
                      report['closed_pull_requests'].append(pr['number'])
              cmd = ['git','push','--atomic','--porcelain']
              cmd += ['--force-with-lease=refs/heads/'+n+':'+s for n,s in selected.items()]
              cmd += ['origin'] + [':refs/heads/'+n for n in selected]
              subprocess.run(cmd, check=True, timeout=120)
              after = remote_heads()
              assert not any(n in after for n in selected)
              assert after['main'] == expected_main
              assert all(after.get(n) == s for n,s in retained.items() if n != 'main')
              assert all(ref('tags',ARCHIVE+n)['object']['sha'] == s for n,s in selected.items())
              report['status']='VERIFIED'
              report['deleted_branches']=sorted(selected)
              report['retained_after']=after
              report['after_branch_count']=len(after)
              report['finished_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          except Exception as exc:
              report['status']='STOPPED_REQUIRES_REVIEW'
              report['error']=str(exc)
              after=remote_heads()
              report['deleted_branches']=[n for n in selected if n not in after]
              write_report(report,report_sha)
              raise
          write_report(report,report_sha)
          print('VERIFIED_RETIRED',len(report['deleted_branches']),'RETAINED',report['after_branch_count'],'CLOSED_PRS',report['closed_pull_requests'],flush=True)
          PY
