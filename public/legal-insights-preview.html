</style></head><body><div class="app"><aside class="sidebar"><div class="brand">STT Legal Insights<small>94m HTML PREVIEW WORKBENCH</small></div><div class="status">Canonical Content：十二篇 DOCX<br>Shell：LEGAL INSIGHTS Profile<br>狀態：STATIC PREVIEW｜94m CMS-PENDING</div><div class="nav"></div></aside><section class="main"><div class="toolbar"><div class="article-name"></div><div class="device"><button data-w="390">390</button><button data-w="768">768</button><button class="active" data-w="900">900</button></div><button id="previewBtn" class="btn primary">線上預覽</button><button id="sourceBtn" class="btn">檢視原始碼</button><button id="copyBtn" class="btn primary">一鍵複製 CMS 原始碼</button></div><div class="workspace"><div class="frame-wrap"><iframe title="94m HTML preview" sandbox="allow-same-origin"></iframe></div><div class="source"><div class="source-head"><span>目前篇章 CMS HTML（預覽版資產路徑）</span><span>複製內容為 CMS-safe HTML；不含 JavaScript</span></div><pre></pre></div></div></section></div><div class="toast"></div><script>window.STT_ARTICLES=[{"id":1,"label":"第一篇","title":"密室中的非對稱作戰","subtitle":"晉升會議「隱揚揭惡」的賽局解碼","abstract_html":"<p>中華企業策略永續發展學會 創會理事長 莊鈞翔 博士觀察到，一場晉升會議最值得追問的，不只是最後選了誰，而是為什麼同一位同仁在平時和年度關鍵決策的評價可以相差甚遠。多年管理經驗提醒我們，資源重新分配時，人的敘事方式、證據選擇與風險感知會同時變動；倘若企業把突如其來的稱讚或指控都當成真相，真正失守的是選任制度。這篇文章從「隱揚揭惡」出發，討論如何保護提出異議的權利，也避免異議成為任意貶抑他人的工具，讓晉升決策回到職位要求、長期軌跡與程序公正。</p>","body_html":"<h2>從日常合作進入資源競爭，評價為何改變</h2>\n<p>日常營運反覆需要同事交換資源、分享資訊並共同承擔交付責任；晉升決策則往往牽涉有限職缺、部門權力、未來預算與推薦人的影響力，因此不同場景確實會改變發言誘因。不過不能把所有負面意見一律認為出於嫉妒，也不能把協作時的禮貌當成完整績效證明；制度真正要處理的是資訊不對稱與評價提出的時間差。 莊博士所要求的不是把人事選擇簡化成好人與壞人的對決，而是把證據、權力與責任放回同一張決策桌，這也正是本篇討論的尺度。</p>\n<p>年度決策的一個切面是這樣的：年度晉升投票前五分鐘，某主管第一次聲稱候選人難以跨部門合作。問題若只停在雙方誰較可信，便會錯過真正需要釐清的沒有列出事實基礎的新指控，可能立即改變其他評委風險感知。對此，核對評價首次形成日期、曾否回饋當事人及是否具體指向專案，才能把原本模糊的說法化成可檢驗的事實。尤其當決策直接影響職位、收入或人格評價，資料形成時間和對照條件必須先清楚，不能用發言者的資歷取代證據的分量。</p>\n<p>反過來說，候選人確可能在近期發生新的重大協作失誤，因此在未完成交叉檢驗前不應排除不同解釋。比較穩妥的處置是主持人要求記錄爭點並給雙方合理查證時間，並向受到影響的人交代決策條件與後續窗口。最終應回頭檢查會議能否說明為何採納或暫緩某個新出現的負面評價；若新的資料顯示原判斷有誤，應允許程序修正，而不要求當事人以名譽承擔組織的判斷成本。</p>\n<p>這個議題還牽涉一個次序問題：先辨認沒有列出事實基礎的新指控，可能立即改變其他評委風險感知所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，核對評價首次形成日期、曾否回饋當事人及是否具體指向專案便可能淪為選擇性證明的工具；保留候選人確可能在近期發生新的重大協作失誤接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>觀察兩位候選人都達到最低資格，但各部門輪流強調對自己有利的能力標準，最容易犯的錯是先把表面結果當作動機證明；實際上，臨場改變評分權重使人事結果取決於話語權而非職位需求。必須先從檢查公開徵才或晉升公告、職務說明及事前核定權重著手，確認資料是否完整、期間是否相同、是否受外部條件影響。如此才知道問題是個人的行為、組織的安排，還是一項需要再查的未決事實，而非單純換一種更強烈的形容詞。</p>\n<p>制度亦須容許產業策略突然改變，新的能力需求也可能真有必要這一種可能，否則所謂客觀很容易只是對單一故事的放大。建議依次採取由不具利益衝突者提出調整理由並統一適用所有候選人，先記錄理由、再確認責任人與檢查節點。真正的成效不是某一方無話可說，而是下一次選任可否在投票前就看見同一套衡量尺標，這會決定下一位主管接任時能否沿用同一套可理解的方法。</p>\n<p>這個議題還牽涉一個次序問題：先辨認臨場改變評分權重使人事結果取決於話語權而非職位需求所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，檢查公開徵才或晉升公告、職務說明及事前核定權重便可能淪為選擇性證明的工具；保留產業策略突然改變，新的能力需求也可能真有必要接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>當高階主管平日對候選人客氣，閉門時卻轉而提出強烈保留，真正的難題不是要不要立即表態，而是如何回答禮貌、真實評價與競爭利益並不必然一致。若只聽一方陳述，整個決策容易建立在選擇性資料上。比較過往正式考績、專案回饋、申訴紀錄及會議陳述應當進入正式記錄，並與既有基準比較；如果尚無充分資訊，就應承認資料不足，而不能把未知包裝成確定的專業判斷。</p>\n<p>可是，平時未公開的敏感問題也可能因保密義務而延後浮現同樣可能成立；治理者必須保留這個變數，以免把善意警訊當作攻擊或把不實指控當成事實。應實施建立保密且可供候選人申復的重要負面資訊審核程序，並讓當事人有補充、反駁與再次核對的機會。下一階段最值得追蹤的不是誰在會議中佔上風，而是制度能否同時避免報復與阻擋無依據的最後一刻攻擊，因為這才接近組織的長期利益。</p>\n<p>這個議題還牽涉一個次序問題：先辨認禮貌、真實評價與競爭利益並不必然一致所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，比較過往正式考績、專案回饋、申訴紀錄及會議陳述便可能淪為選擇性證明的工具；保留平時未公開的敏感問題也可能因保密義務而延後浮現接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>從年度晉升投票前五分鐘，某主管第一次聲稱候選人難以跨部門合作延伸到這一節其他情境，可以看到真正有價值的改革不是要求員工或主管少說話，而是讓每個重要主張找到可查證的資料、相同的衡量條件與必要的反駁空間。若企業只把制度寫成宣示，制度能否同時避免報復與阻擋無依據的最後一刻攻擊便始終無法實現；只有將方法變成例行職責，才可能防止相同矛盾在下一次決策中重演。</p>\n<h2>「隱揚揭惡」不是情緒標籤，而是證據選擇問題</h2>\n<p>對真正重要的工作風險，適度揭示缺失是高階主管的責任；但如果只摘錄某人一次失誤、不提他在相同條件下長期解決的困難，評估便容易失衡。此時最有價值的做法，是要求每一項正負主張交出可比較的資料、明確的職務關聯及可以反駁的具體內容，避免讓好惡偽裝成專業裁量。 莊鈞翔 博士提醒，任何制度安排都應先確認資料可以證明什麼，不能證明什麼，尤其涉及人格、法律責任或職涯發展時，更要防止推定取代查證。</p>\n<p>值得在會議桌前提出的情境是候選人帶領專案連續八季交付，但推薦人只展示最近一次延遲。從表面看來，爭議似乎只是個別人的態度，仔細分析卻牽涉單一延遲的嚴重性應由原因與影響決定，不能自行代表全年能力。此時查核各季交付率、延遲根因、責任歸屬與修復成效不只是補一份文件，更是使不同立場使用相同尺度的起點。沒有共同事實底座，任何強調效率或公平的口號都可能被各方拿來為既定立場服務。</p>\n<p>從另一面看，一次延遲也可能涉及重大安全或誠信違規而足以改變決策提醒我們任何單一資料都有侷限。處理方法不是用主管直覺補足，而是按事前風險權重衡量該事件並保留說明空間，把程序寫入可追溯紀錄。當檢驗重點移向長期成果與重大例外能否在同一張表中並列呈現時，評價就比較不容易成為權勢使用的附屬品，也較能使不同部門在不完全同意時接受相同規則。</p>\n<p>要避免程序成為另一種儀式，查核各季交付率、延遲根因、責任歸屬與修復成效應轉化為可重複核對的工作紀錄，一次延遲也可能涉及重大安全或誠信違規而足以改變決策也要列入同一比較表。唯有如此，按事前風險權重衡量該事件並保留說明空間才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>假設某主管以「沒有大局觀」否定高績效員工的管理潛力，管理者必須避免過早把結果歸咎於某個人的品格，因為抽象形容詞缺少行為定義，很容易成為難以反駁的標籤。最有用的資訊來自要求列出跨部門資源協調、衝突處理、人才培育的實例，並應把來源、涵蓋範圍和例外情形一併說明。這個過程也可能發現原有制度的缺口，使人事問題不再被簡化為某位主管與某位員工誰比較會說話。</p>\n<p>若領導潛力部分本就難以完全量化，質性訪談仍有價值，一味先行處分便可能製造新的不公平，因此應採事前設計行為式題目並要求評委分別給出具體證據，將事實調查與必要的暫時保護區分。此後觀察主管的主觀判斷是否受到一致方法與理由紀錄約束，才能知道改變的是表面文件還是實際管理行為。若發現原決定傷害了本來應保護的權益，制度也應提供明確的更正與救濟途徑。</p>\n<p>要避免程序成為另一種儀式，要求列出跨部門資源協調、衝突處理、人才培育的實例應轉化為可重複核對的工作紀錄，領導潛力部分本就難以完全量化，質性訪談仍有價值也要列入同一比較表。唯有如此，事前設計行為式題目並要求評委分別給出具體證據才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>企業遇到有人以少數員工私下抱怨作為不升遷的主要原因時，往往希望迅速有個結論，但速度不能省略匿名訊息對安全揭露有益，單獨使用卻缺乏可交叉查證性這個判斷。為免短期情緒主導，應先整理比對匿名調查題目、樣本大小、時間點及必要的其他資料，必要時讓相關人員補充不利於自己的事實。決策者真正要管理的是錯誤代價，而不是讓每場會議看起來毫無歧見。</p>\n<p>在反面檢驗中，少數真實受害者不應因人數少而被忽略不能被排除。管理層應選擇區分一般滿意度與具體違規指控，必要時分流調查，並避免把尚未證實的可能性寫成某人的人格特質。長期而言，若能否兼顧保護吹哨者與避免匿名數字直接定罪仍無法獲得解答，代表目前採集的資料尚不足以支撐高強度人事處分，組織就應補強標準而不是加重語氣。</p>\n<p>要避免程序成為另一種儀式，比對匿名調查題目、樣本大小、時間點及必要的其他資料應轉化為可重複核對的工作紀錄，少數真實受害者不應因人數少而被忽略也要列入同一比較表。唯有如此，區分一般滿意度與具體違規指控，必要時分流調查才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>這三個情境雖然起點不同，卻都指向一項管理責任：不能只追問誰犯錯，還必須確認企業給了什麼條件、誰掌握關鍵資訊、哪些資料需要在正式決定前補足。對有人以少數員工私下抱怨作為不升遷的主要原因尤其如此，能否兼顧保護吹哨者與避免匿名數字直接定罪應是後續檢討的核心，而不應在一份漂亮的結案報告後就失去追蹤。</p>\n<h2>用鏡像提問讓會議從立場回到事實</h2>\n<p>在會場上直接指責別人有派系私心，往往讓各方更投入身分防衛；反過來要求說明時間、比較基準與具體影響，才是低衝突的主持技術。所謂鏡像提問，不是為了羞辱提出異議的人，而是把同一問題對所有人提出，並要求肯定與否定主張承擔對等的舉證責任。 中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，治理者不應用單一口號取代制度，而應將爭議拆為可檢驗的事實、可說明的準則與可修正的後續行動。</p>\n<p>在推薦人以最近一次大型專案成功要求候選人立即破格升遷的案例裡，如果直接接受第一個看似合理的說法，就可能忽略亮點成果與持續擔任管理職務所需能力未必相同。看過去十二至二十四個月常態成果及事件後續維持情形提供了可以重新檢驗的入口，也迫使評估者說清楚其比較標準。比起當場擴大衝突，這種先還原事實、再討論責任的方法，能讓後續選擇有比較穩定的正當性。</p>\n<p>然而具有突破性創新的單一成果確可能證明重要新能力，這使事件不宜由一個最方便的標籤收束。以要求比較同等職位所需的組織帶領與風險承擔紀錄作為下一步，可以讓各方知道哪些條件已被確認、哪些仍有爭論；後續再以突發高光應成為新證據而不是抹去既有資料的橡皮擦作為評估點，檢驗此次處理是否真的降低風險。最忌諱的是把暫時措施做成終局處罰，卻不再追蹤結果。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存看過去十二至二十四個月常態成果及事件後續維持情形和具有突破性創新的單一成果確可能證明重要新能力，接任者便無法理解處理基礎。將突發高光應成為新證據而不是抹去既有資料的橡皮擦轉為可觀察的後續指標，並為要求比較同等職位所需的組織帶領與風險承擔紀錄保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>有些治理漏洞藏在熟悉的流程裡，例如負評集中指向某個人的溝通語氣而忽略其實際協作成效。它真正揭露的未必是哪個人有惡意，而是溝通品質重要，但需要避免以個人喜好代替可觀察行為。公司若要避免再次出現相同爭議，首先需要核對具體郵件語句、合作方回饋與衝突後修復紀錄；對涉及私人評價與法律效果的資訊，更應記錄哪些是直接觀察，哪些只是轉述或推測。</p>\n<p>當然，高產出者也可能以不當方式傷害同仁，不能拿業績抵銷必須納入討論，否則評估只剩下證明原決策正確。採取由主持人請評委說明問題嚴重程度及改善可能性之後，管理者還要安排適切的溝通和後續檢討，因為對績效與人格尊嚴應維持兩個並列而非互相抵銷的尺度並非靠一次會議自然完成。若制度能接受新的反證，員工更可能在問題擴大前提出真實訊息，而不是被迫等待衝突爆發。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存核對具體郵件語句、合作方回饋與衝突後修復紀錄和高產出者也可能以不當方式傷害同仁，不能拿業績抵銷，接任者便無法理解處理基礎。將對績效與人格尊嚴應維持兩個並列而非互相抵銷的尺度轉為可觀察的後續指標，並為由主持人請評委說明問題嚴重程度及改善可能性保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>另一項典型情況是會議臨時有人聲稱一項財務風險將在明年爆發，這使不確定資訊可能是真正預警，也可能只是放大猜測浮現。若管理層只想在當下表決通過，事後往往很難重建為何如此判斷。把核對已簽核合約、應收帳款、風險評級與財會意見納入可追溯資料，並對照當時實際的業務條件，才能讓一項有爭議的決定仍有被理解、修正與改善的可能。</p>\n<p>仍要注意尚未實現的重大風險不應只因無法當場證明而被排除，這提醒決策者在查證前保留判斷彈性。應依照建立限期專案查核與暫時性條件決策處理，並同步記錄措施的必要性與可撤回條件。日後衡量成功與否，可看未證實的推測如何被妥善管理而不是任意轉化為人格評價，不宜只以發出多少通知、完成多少表單來自我證明，因為程序的價值終究在於是否改善真實關係。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存核對已簽核合約、應收帳款、風險評級與財會意見和尚未實現的重大風險不應只因無法當場證明而被排除，接任者便無法理解處理基礎。將未證實的推測如何被妥善管理而不是任意轉化為人格評價轉為可觀察的後續指標，並為建立限期專案查核與暫時性條件決策保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>把這裡的討論帶回高階會議，應先對齊目標，再評估可採證據，最後決定誰負責執行與回報。即使具有突破性創新的單一成果確可能證明重要新能力，制度也不能因此省略公正的解釋機會；同樣地，若未證實的推測如何被妥善管理而不是任意轉化為人格評價仍無法確認，這就不是再發一份政策文件可以解決的問題，而是需要持續改善的管理缺口。</p>\n<h2>讓人才自我呈現從形象包裝轉為制度資產</h2>\n<p>長年做事的人不需要學習操弄人際關係，但需要讓其貢獻可以被決策者理解、驗證與交接。將成果轉化為季度紀錄、標準作業程序、人才培育成果與風險控制計畫，能同時協助候選人正當主張價值，也降低組織對單一明星員工的脆弱依賴。 依莊博士的治理視角，即使某項提議在倫理上令人同情，也應區分已證實的事實、當事人的主張及仍待驗證的假說，讓決策不因發言者身分而預先偏向。</p>\n<p>考慮到長期負責維護重大客戶的員工，工作穩定因此缺乏新聞式亮點，管理者最需要克制的是用單一結果替代完整分析。因為穩定續約與降低流失風險不容易被一次性簡報捕捉，證據不能只選擇符合既有偏好的部分。透過製作客戶留存、回款、客訴及交叉銷售的縱向資料，可以逐步確認各方主張的核心事實；同時應明示尚未確認的因素，使爭議不必為了求快而被永久貼上標籤。</p>\n<p>在這裡，若指標完全由市場景氣決定，不能把團隊成果都算在個人身上提供重要的反向測試。較可行的步驟是在報告中明示個人可控因素與協作部門的共同貢獻，再以清楚時間點檢查是否收到新資料或需要調整。對公司而言，企業能否辨識維持底盤的人與放大短期聲量的人才是值得投入管理注意力的結果；在未能證明之前，單方的強烈語氣不應轉化為另一方必須承擔的確定法律後果。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若若指標完全由市場景氣決定，不能把團隊成果都算在個人身上後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>當組織出現候選人在考核前提出一份三年部門策略計畫，有人可能立即主張應嚴懲，也有人主張不必理會，但兩種立場都應先面對策略報告容易展現思考格局，也可能只是沒有資源約束的願望清單。實務查核宜從檢查方案的成本、優先級、關鍵風險及衡量節點出發，避免把流程便利或單次印象直接作為責任判定。對高階決策而言，可解釋性往往比語氣上的果斷更重要。</p>\n<p>倘若尚未掌權者無法掌握全部資料，應容許合理假設與不確定，原本最直觀的歸責方式就可能產生誤差。公司宜先由相同題目對所有候選人進行情境問答與反面追問，並把蒐證、說明和改善責任分配給具適當權限者。最終未來任用能否評估其承擔不確定性而不只看雄辯能力是否達成，會比「我們一向很重視公平」的口號更有說服力，也能降低管理者換人後制度迅速失效的風險。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若尚未掌權者無法掌握全部資料，應容許合理假設與不確定後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>從員工完成跨部門重大專案後僅有口頭稱讚沒有正式交接可以看見，決策者收到的資訊不一定等於完整實況；其中無形貢獻在一年後可能完全失去記憶憑據尤其容易被忽略。將保留驗收紀錄、問題清單、合作單位署名與成果可重複程度納入比較，可先分辨事實差異與價值判斷的差異，避免用一份數據去回答它根本沒有能力回答的問題。如此形成的制度，不需要把任何一方預設為贏家。</p>\n<p>而過度自我歸功也會侵蝕團隊信任也有必要被認真核對。由此推導的做法是建立由實際協作方共同確認的成果報告，不是當場選邊，而是建立讓不同資料被同樣檢驗的過程。若能使個人成就是否已轉化為可以傳承而非必須仰賴個人的組織能力成為後續例行觀察，公司才不會每逢重大決定就重新發明同一場爭論；缺乏必要證據時則應承認保留事項。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若過度自我歸功也會侵蝕團隊信任後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>一項好的制度不可能讓所有參與者立即滿意，但至少應讓各方知道自己正在承擔哪一種責任，以及如何透過正式程序修正事實認定。當長期負責維護重大客戶的員工，工作穩定因此缺乏新聞式亮點和員工完成跨部門重大專案後僅有口頭稱讚沒有正式交接等情境獲得相同的查證標準時，管理權才不必依靠個人威望維持；這也是企業不斷擴大規模後仍能維持信任的必要條件。</p>\n<h2>法律邊界與制度問責，不讓考評變成未審先判</h2>\n<p>合理負評、適度管理與職場霸凌並不是同一件事。依2026年施行之《職業安全衛生法》第22條之1，職場霸凌須按法定定義與個案情節判斷，不能僅因有人在會議上表達反對就認定成立；相反地，若出現利用權勢、持續貶抑或刻意孤立且造成身心健康危害等情形，雇主便有防治與適當處理義務。 莊鈞翔 博士強調，制度成熟的標誌不是爭議從此消失，而是即使面對高度緊張的情境，組織仍能維持相同的查證方法、相當的程序保障與後續修正空間。</p>\n<p>在實際部門管理裡，候選人認為某段批評已構成職場霸凌而要求立即撤銷考評並不罕見，難處在於調查是否成立與考評是否公平是不同問題，不能互相自動替代。要讓專業判斷可受檢驗，應以保全原始會議紀錄、評分依據及涉嫌不當言行的脈絡補足判斷的缺口，也要問清楚相同情況下其他人是否受到相同待遇。這些資料不會消除所有裁量，但至少能降低任意性並讓異議有切入點。</p>\n<p>另一方面，批評可能是合理督導，也可能是持續人格羞辱的一環；此時堅持一種單向敘事只會擴大誤解。適當路徑是依法提供安全申訴與獨立查證，同時維持必要人事覆核，把程序的正當性建立在行動及其理由之上。往後應檢驗程序能否保護相關人員並在證據成熟後妥善校正決策，確認沒有因一時處理便利而犧牲長期人才、誠信或權益；制度若有錯誤也應留出修正空間。</p>\n<p>尤其當候選人認為某段批評已構成職場霸凌而要求立即撤銷考評涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓依法提供安全申訴與獨立查證，同時維持必要人事覆核在下一次相似事件仍可被使用，並使程序能否保護相關人員並在證據成熟後妥善校正決策可作為制度是否改善的具體尺度。</p>\n<p>一個常被輕忽的警訊是為求公平而全面公開所有同仁匿名評價與私人訊息。此時值得追問的不是誰先抱怨，而是透明不是無條件揭露隱私，反而可能引發報復。若公司能先取得區分必要的評價事實、身分資訊與個資敏感程度，就有機會把模糊的人格爭論轉成可分析的工作安排與具體言行；做不到時，至少應暫列待查，而不是讓懷疑自然長成確定結論。</p>\n<p>不要忽略被評者也需要得知足以有效反駁不利決策的理由這項反論，因為它可能直接改變原先的歸責方向。較穩健的方式是採摘要、去識別化及有限權限查閱等分層程序，讓申辯與必要保護同時存在。至於資料使用能否符合必要性與比例原則並兼顧雙方保障，不應留成抽象願景，而要在下一次正式檢討時確認能否由資料支持，否則管理決策只是在不同權力者間換一種說法。</p>\n<p>尤其當為求公平而全面公開所有同仁匿名評價與私人訊息涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓採摘要、去識別化及有限權限查閱等分層程序在下一次相似事件仍可被使用，並使資料使用能否符合必要性與比例原則並兼顧雙方保障可作為制度是否改善的具體尺度。</p>\n<p>面對企業將每次對主管提出的負評都視作惡意抹黑，成熟的主管不宜只求自己支持的人勝出，而要思考壓制正當質疑會使真正的管理風險再度進入黑箱。查證檢查異議是否具體、有無文件支持及相同標準是否適用所有候選人之後，才有機會確認哪些原因在個人可控制範圍內，哪些則源自環境或制度。這樣的劃分不是為了替問題找藉口，而是防止錯誤處方，使相同危險在下一次人事決策中重演。</p>\n<p>最後還須衡量善意反映問題的人也可能掌握不完整資訊。在未把握所有條件以前，將揭露保護與不實資訊處理分軌，禁止用立場判斷動機比單純宣示誰對誰錯更能守住制度；其合理性應以是否仍有人敢在關鍵會議提出有根據但不討喜的意見是否逐步實現來檢驗。如此即使決策的結果未獲所有人支持，也能讓人理解組織沒有為方便而忽略反面證據。</p>\n<p>尤其當企業將每次對主管提出的負評都視作惡意抹黑涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓將揭露保護與不實資訊處理分軌，禁止用立場判斷動機在下一次相似事件仍可被使用，並使是否仍有人敢在關鍵會議提出有根據但不討喜的意見可作為制度是否改善的具體尺度。</p>\n<p>本節最後需要回到長期效果，而不是案件或專案的當日勝負。若公司願意正視調查是否成立與考評是否公平是不同問題，不能互相自動替代，也願意檢驗是否仍有人敢在關鍵會議提出有根據但不討喜的意見，就有可能把一次衝突轉成制度學習。反過來說，若永遠只依主管印象或單方文件決定，短期或許節省會議時間，長期卻會讓人才、法遵與營運風險一起累積。</p>\n<p>真正高明的人事治理不是讓晉升會議沒有衝突，而是讓衝突的事實基礎、質疑方式與最終理由經得起下一次複查。當企業能區分新出現的有效警訊與刻意放大的局部瑕疵，也能把長期績效與領導適任能力分別衡量時，會議室不再需要靠權勢決定何者可信。這是從競爭現實走向制度信任的起點。 莊博士始終將制度的可追溯性置於語氣的強硬之前；一套制度若只能用來證明主管正確，不能保護不同意見，終將再次複製最初所欲解決的問題。</p>","legal_html":"<div class=\"section-label\">▍法律依據與資料來源說明</div>\n<p>法源查核基準日：2026年11月1日</p>\n<p class=\"legal-note\">本節以正式法令／裁判及研究來源為據；「條文原文／要旨」與「本文對照」分開書寫，治理建議不等同法定義務。</p>\n<p><strong>• 《職業安全衛生法》第22條之1｜條文要旨：職場霸凌涉及利用職務或權勢關係，逾越業務上必要且合理範圍，持續以不當言詞或行為致勞工身心健康受危害；情節重大者，不以持續發生為必要。</strong></p>\n<p>本文對照：晉升會議中的負面評價不當然是職場霸凌；只有涉及權勢、業務界線與健康危害等法定條件，才有必要進入本條分析。</p>\n<p><strong>• 《職場霸凌防治措施準則》第2條｜條文要旨：職場霸凌須符合母法定義，並綜合審酌背景、頻率、場所、動機、目的及排擠、刁難、不合理工作分配、散布謠言等具體情形。</strong></p>\n<p>本文對照：對「隱揚揭惡」的評價必須回到具體言行、形成背景及實際資料，不能因與會者觀點尖銳就逕行認定違法。</p>\n<p><strong>• 《個人資料保護法》第5條｜條文：個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。</strong></p>\n<p>本文對照：常態同儕回饋、考績歷史與匿名調查涉及個資蒐集與利用，應設明確目的、權限及保存界線。</p>\n<div class=\"section-label\">▍治理思想依據 GOVERNANCE REFERENCE</div>\n<p><strong>▮ 莊鈞翔（2026）《企業策略導入公司治理法遵精神｜以外部法律顧問團隊協助為例》</strong></p>\n<p>治理對照：本文將企業策略與公司治理之責任可追溯思維，運用於晉升會議的客觀評價、決策理由及資訊治理；這屬治理方法的延伸，不等於原研究對任何個別人事會議作成事實認定。</p>\n<p><strong>▮ 莊鈞翔（2026）《內在法遵 Internal Compliance｜為你的內心，打造一座不可侵犯的至聖所》</strong></p>\n<p>治理對照：以內在法遵所強調的主動辨識界線，要求評委在制度未強制之前即誠實面對證據、偏誤與對候選人的責任。</p>","notes_html":"<p>註 3：本文以莊鈞翔博士之研究、思想與治理判讀為架構，AI僅輔助資料整理、草稿生成及編修；發表版本以作者本人審定為準。AI不取代作者的學術責任、專業判斷與最終決策。</p>\n<p>註 4：本文為企業治理、制度設計與法律風險之一般分析，不構成執業律師對具體案件之正式法律意見、訴訟代理或結果保證。個案仍須依適用時間、完整事證、法律與程序狀態，由具資格之律師審閱。</p>"},{"id":2,"label":"第二篇","title":"格式化大腦偷懶","subtitle":"峰終定律、近因效應與「短期煙火」逆轉秀","abstract_html":"<p>中華企業策略永續發展學會 創會理事長 莊鈞翔 博士觀察到，一名員工過去十個月平實履行職責，另一名同仁長期成績突出卻在年度最後兩週缺乏可見新作，前者忽然完成一項具話題的專案，就可能在決策者心中取得超出證據的印象優勢。這種現象值得研究，但不能誤用心理學：峰終定律原始實驗研究的是對痛苦經驗的回憶評價，不是直接證明每一位主管的晉升投票必然只看最近兩週。本篇討論認知偏誤與人事制度之間可以合理建立的橋梁。</p>","body_html":"<h2>峰終、近因與可得性，是不同的心理命題</h2>\n<p>卡尼曼等研究者在1993年以冷水實驗觀察回顧性評價，發現人對一段不舒服經驗的回憶可能受到最強烈與最後片段的影響，持續時間的權重未必如直覺預期。這個發現對管理有啟發，但應與記憶序列中的近因效應、決策者提取鮮明事件的可得性捷思分開討論，不可把實驗的外部效度擴張成直接的人事定律。 莊博士所要求的不是把人事選擇簡化成好人與壞人的對決，而是把證據、權力與責任放回同一張決策桌，這也正是本篇討論的尺度。</p>\n<p>年度決策的一個切面是這樣的：績效會議中有人引用冷水實驗聲稱最近兩週必然決定主管印象。問題若只停在雙方誰較可信，便會錯過真正需要釐清的從痛苦經驗的回溯記憶跨越到複雜人事決策，缺少直接證據。對此，查核原始研究對象、實驗條件與企業績效研究是否相符，才能把原本模糊的說法化成可檢驗的事實。尤其當決策直接影響職位、收入或人格評價，資料形成時間和對照條件必須先清楚，不能用發言者的資歷取代證據的分量。</p>\n<p>反過來說，高壓或資訊不足環境仍可能增加近期事件的重要性，因此在未完成交叉檢驗前不應排除不同解釋。比較穩妥的處置是把心理學作為風險提醒而非精確因果證明，並向受到影響的人交代決策條件與後續窗口。最終應回頭檢查是否能容許研究啟發與實際人事判斷存在落差；若新的資料顯示原判斷有誤，應允許程序修正，而不要求當事人以名譽承擔組織的判斷成本。</p>\n<p>這個議題還牽涉一個次序問題：先辨認從痛苦經驗的回溯記憶跨越到複雜人事決策，缺少直接證據所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，查核原始研究對象、實驗條件與企業績效研究是否相符便可能淪為選擇性證明的工具；保留高壓或資訊不足環境仍可能增加近期事件的重要性接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>觀察主管回憶員工一年成績時首先提到一個突發事故，最容易犯的錯是先把表面結果當作動機證明；實際上，鮮明負面事件可能主導敘述，但其實際嚴重性未經定量比較。必須先從比較全年缺失頻率、事故後果、修復速度及業務重要性著手，確認資料是否完整、期間是否相同、是否受外部條件影響。如此才知道問題是個人的行為、組織的安排，還是一項需要再查的未決事實，而非單純換一種更強烈的形容詞。</p>\n<p>制度亦須容許一次重大事故可以合法且合理地超過多次小成績的權重這一種可能，否則所謂客觀很容易只是對單一故事的放大。建議依次採取預先設定重大事件單列審查及量化評級，先記錄理由、再確認責任人與檢查節點。真正的成效不是某一方無話可說，而是評估能否同時避免忽略長期與輕視真正重大風險，這會決定下一位主管接任時能否沿用同一套可理解的方法。</p>\n<p>這個議題還牽涉一個次序問題：先辨認鮮明負面事件可能主導敘述，但其實際嚴重性未經定量比較所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，比較全年缺失頻率、事故後果、修復速度及業務重要性便可能淪為選擇性證明的工具；保留一次重大事故可以合法且合理地超過多次小成績的權重接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>當兩名候選人本月各有一項漂亮成果而過往紀錄差異很大，真正的難題不是要不要立即表態，而是如何回答當前訊號應視為增量資訊，不應清除之前的評價基礎。若只聽一方陳述，整個決策容易建立在選擇性資料上。整理逐季達標趨勢、職務環境、工作複雜度與外部資源應當進入正式記錄，並與既有基準比較；如果尚無充分資訊，就應承認資料不足，而不能把未知包裝成確定的專業判斷。</p>\n<p>可是，近期改善可能代表真實學習曲線而非一時運氣同樣可能成立；治理者必須保留這個變數，以免把善意警訊當作攻擊或把不實指控當成事實。應實施以持續觀察與同等機會驗證爆發是否可複製，並讓當事人有補充、反駁與再次核對的機會。下一階段最值得追蹤的不是誰在會議中佔上風，而是企業能否辨認真正轉型的人而不是固定偏愛舊強者，因為這才接近組織的長期利益。</p>\n<p>這個議題還牽涉一個次序問題：先辨認當前訊號應視為增量資訊，不應清除之前的評價基礎所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，整理逐季達標趨勢、職務環境、工作複雜度與外部資源便可能淪為選擇性證明的工具；保留近期改善可能代表真實學習曲線而非一時運氣接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>從績效會議中有人引用冷水實驗聲稱最近兩週必然決定主管印象延伸到這一節其他情境，可以看到真正有價值的改革不是要求員工或主管少說話，而是讓每個重要主張找到可查證的資料、相同的衡量條件與必要的反駁空間。若企業只把制度寫成宣示，企業能否辨認真正轉型的人而不是固定偏愛舊強者便始終無法實現；只有將方法變成例行職責，才可能防止相同矛盾在下一次決策中重演。</p>\n<h2>績效數據要拉長時間，也要比較同等條件</h2>\n<p>單純把二十四個月的KPI畫成折線，雖然比臨場口頭印象更好，卻未必已經公平。職務性質改變、公司策略調整、客戶流失及團隊人力不同，可能讓數字不可直接相比；治理者必須對資料設計與評分權重負責，否則數位儀表板只是另一種可視化偏差。 莊鈞翔 博士提醒，任何制度安排都應先確認資料可以證明什麼，不能證明什麼，尤其涉及人格、法律責任或職涯發展時，更要防止推定取代查證。</p>\n<p>值得在會議桌前提出的情境是銷售甲全年金額領先，但大量營收來自前手留下的成熟客戶。從表面看來，爭議似乎只是個別人的態度，仔細分析卻牽涉營收高低不能直接等同個人開發與維護能力。此時檢視新客開發、留存、續約及毛利率的可控貢獻不只是補一份文件，更是使不同立場使用相同尺度的起點。沒有共同事實底座，任何強調效率或公平的口號都可能被各方拿來為既定立場服務。</p>\n<p>從另一面看，甲維持高價值客戶也可能有不易量化的防守成果提醒我們任何單一資料都有侷限。處理方法不是用主管直覺補足，而是區分承接資產與主動貢獻後重新計分，把程序寫入可追溯紀錄。當檢驗重點移向長期資料能否支持對不同職務本質的公平比較時，評價就比較不容易成為權勢使用的附屬品，也較能使不同部門在不完全同意時接受相同規則。</p>\n<p>要避免程序成為另一種儀式，檢視新客開發、留存、續約及毛利率的可控貢獻應轉化為可重複核對的工作紀錄，甲維持高價值客戶也可能有不易量化的防守成果也要列入同一比較表。唯有如此，區分承接資產與主動貢獻後重新計分才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>假設研發乙前三季看似沒有交付，第四季技術突破成功，管理者必須避免過早把結果歸咎於某個人的品格，因為季度產出形式不同不能只用數量高低定優劣。最有用的資訊來自查核研發階段、試驗風險、里程碑、技術成果與未來轉移價值，並應把來源、涵蓋範圍和例外情形一併說明。這個過程也可能發現原有制度的缺口，使人事問題不再被簡化為某位主管與某位員工誰比較會說話。</p>\n<p>若長期基礎研究可能不符合短週期營收標準，一味先行處分便可能製造新的不公平，因此應採按專案生命週期設計不同評量方法與專業同儕審查，將事實調查與必要的暫時保護區分。此後觀察數據能否看見價值形成的時滯與專業深度，才能知道改變的是表面文件還是實際管理行為。若發現原決定傷害了本來應保護的權益，制度也應提供明確的更正與救濟途徑。</p>\n<p>要避免程序成為另一種儀式，查核研發階段、試驗風險、里程碑、技術成果與未來轉移價值應轉化為可重複核對的工作紀錄，長期基礎研究可能不符合短週期營收標準也要列入同一比較表。唯有如此，按專案生命週期設計不同評量方法與專業同儕審查才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>企業遇到某主管提出二十四個月平均分數來否定近六個月快速進步者時，往往希望迅速有個結論，但速度不能省略歷史平均可能低估真實能力提升與新職務匹配這個判斷。為免短期情緒主導，應先整理比較改善速度、訓練投入、成果可靠性及不同考評者一致性，必要時讓相關人員補充不利於自己的事實。決策者真正要管理的是錯誤代價，而不是讓每場會議看起來毫無歧見。</p>\n<p>在反面檢驗中，少數亮眼月度成績也可能只是市場景氣回升不能被排除。管理層應選擇設定持續驗證區間並清楚列示成功標準，並避免把尚未證實的可能性寫成某人的人格特質。長期而言，若組織是否避免把過去表現永久定義為個人上限仍無法獲得解答，代表目前採集的資料尚不足以支撐高強度人事處分，組織就應補強標準而不是加重語氣。</p>\n<p>要避免程序成為另一種儀式，比較改善速度、訓練投入、成果可靠性及不同考評者一致性應轉化為可重複核對的工作紀錄，少數亮眼月度成績也可能只是市場景氣回升也要列入同一比較表。唯有如此，設定持續驗證區間並清楚列示成功標準才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>這三個情境雖然起點不同，卻都指向一項管理責任：不能只追問誰犯錯，還必須確認企業給了什麼條件、誰掌握關鍵資訊、哪些資料需要在正式決定前補足。對某主管提出二十四個月平均分數來否定近六個月快速進步者尤其如此，組織是否避免把過去表現永久定義為個人上限應是後續檢討的核心，而不應在一份漂亮的結案報告後就失去追蹤。</p>\n<h2>讓評委先獨立判讀，再進入相互說服</h2>\n<p>一場會議如果先聽最有權勢的主管下結論，其他人後續再評分，分數往往已受到社會壓力影響。較好的程序是預先定義職位需求、安排獨立初評、公開事實但不公開個人好惡，最後才討論有分歧的項目，以降低近因與同儕從眾的交互作用。 中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，治理者不應用單一口號取代制度，而應將爭議拆為可檢驗的事實、可說明的準則與可修正的後續行動。</p>\n<p>在董事長在開場先說某位候選人最近表現令人驚豔的案例裡，如果直接接受第一個看似合理的說法，就可能忽略權威意見先發容易影響其他評委原本不同的判斷。保留獨立初評與統一盲看資料的評分時間提供了可以重新檢驗的入口，也迫使評估者說清楚其比較標準。比起當場擴大衝突，這種先還原事實、再討論責任的方法，能讓後續選擇有比較穩定的正當性。</p>\n<p>然而董事長可能掌握重要新資訊而不宜完全禁止說明，這使事件不宜由一個最方便的標籤收束。以先記錄未受影響評分再開放追加證據與覆評作為下一步，可以讓各方知道哪些條件已被確認、哪些仍有爭論；後續再以評委能否以資料修正觀點而非只順應主事者作為評估點，檢驗此次處理是否真的降低風險。最忌諱的是把暫時措施做成終局處罰，卻不再追蹤結果。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存保留獨立初評與統一盲看資料的評分時間和董事長可能掌握重要新資訊而不宜完全禁止說明，接任者便無法理解處理基礎。將評委能否以資料修正觀點而非只順應主事者轉為可觀察的後續指標，並為先記錄未受影響評分再開放追加證據與覆評保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>有些治理漏洞藏在熟悉的流程裡，例如評委只拿到華麗簡報卻沒有完整績效與風險資料。它真正揭露的未必是哪個人有惡意，而是簡報製作能力與崗位能力被錯置在同一指標。公司若要避免再次出現相同爭議，首先需要要求同版面、同欄位、同長度的績效摘要及反面風險；對涉及私人評價與法律效果的資訊，更應記錄哪些是直接觀察，哪些只是轉述或推測。</p>\n<p>當然，有些職位確實需要對外溝通與說服能力必須納入討論，否則評估只剩下證明原決策正確。採取把表達能力單獨評分，不讓其取代技術與管理證據之後，管理者還要安排適切的溝通和後續檢討，因為最終結果能否被其他未參與會議者重算與理解並非靠一次會議自然完成。若制度能接受新的反證，員工更可能在問題擴大前提出真實訊息，而不是被迫等待衝突爆發。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存要求同版面、同欄位、同長度的績效摘要及反面風險和有些職位確實需要對外溝通與說服能力，接任者便無法理解處理基礎。將最終結果能否被其他未參與會議者重算與理解轉為可觀察的後續指標，並為把表達能力單獨評分，不讓其取代技術與管理證據保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>另一項典型情況是評委在短時間被要求對十二人同時打分，這使時間壓力使人只記得具情緒性的最近消息浮現。若管理層只想在當下表決通過，事後往往很難重建為何如此判斷。把核對時間配置、資料預讀期間與重大爭點是否提前通知納入可追溯資料，並對照當時實際的業務條件，才能讓一項有爭議的決定仍有被理解、修正與改善的可能。</p>\n<p>仍要注意高層時間有限，不可能無限延長所有程序，這提醒決策者在查證前保留判斷彈性。應依照針對高分歧候選人設置額外審查而不是全員延長處理，並同步記錄措施的必要性與可撤回條件。日後衡量成功與否，可看有限管理資源是否被用在最可能造成錯誤的環節，不宜只以發出多少通知、完成多少表單來自我證明，因為程序的價值終究在於是否改善真實關係。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存核對時間配置、資料預讀期間與重大爭點是否提前通知和高層時間有限，不可能無限延長所有程序，接任者便無法理解處理基礎。將有限管理資源是否被用在最可能造成錯誤的環節轉為可觀察的後續指標，並為針對高分歧候選人設置額外審查而不是全員延長保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>把這裡的討論帶回高階會議，應先對齊目標，再評估可採證據，最後決定誰負責執行與回報。即使董事長可能掌握重要新資訊而不宜完全禁止說明，制度也不能因此省略公正的解釋機會；同樣地，若有限管理資源是否被用在最可能造成錯誤的環節仍無法確認，這就不是再發一份政策文件可以解決的問題，而是需要持續改善的管理缺口。</p>\n<h2>讓真正有貢獻的人被看見，而不鼓勵造假亮點</h2>\n<p>真正優秀的員工可以主動提交長期成果與可驗證的階段性報告，但不能為了呼應「結尾效應」故意操縱交付日期、拆分數字或忽略風險。提升資訊可見性，應以誠實、定期與可比為前提；主管也有責任建立固定回饋機制，不把自我行銷能力當作任用門票。 依莊博士的治理視角，即使某項提議在倫理上令人同情，也應區分已證實的事實、當事人的主張及仍待驗證的假說，讓決策不因發言者身分而預先偏向。</p>\n<p>考慮到資深工程師多年降低系統故障但沒有單次爆紅專案，管理者最需要克制的是用單一結果替代完整分析。因為穩定性是重要資產卻難以進入記憶性敘事，證據不能只選擇符合既有偏好的部分。透過彙整故障率、恢復時間、預防事故及維護成本變化，可以逐步確認各方主張的核心事實；同時應明示尚未確認的因素，使爭議不必為了求快而被永久貼上標籤。</p>\n<p>在這裡，沒有故障也可能因整體投入與產品成熟而非個人成果提供重要的反向測試。較可行的步驟是請團隊共同確認作用來源與可稽核的運作改善，再以清楚時間點檢查是否收到新資料或需要調整。對公司而言，長期防損成果是否獲得與短期營收相當的重視才是值得投入管理注意力的結果；在未能證明之前，單方的強烈語氣不應轉化為另一方必須承擔的確定法律後果。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若沒有故障也可能因整體投入與產品成熟而非個人成果後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>當組織出現業務員為了年度表揚把尚未交付的訂單提前列為成果，有人可能立即主張應嚴懲，也有人主張不必理會，但兩種立場都應先面對名義上漂亮的結尾可能扭曲會計認列與真實業務風險。實務查核宜從核對訂單狀態、合約條件、履約成本與回款階段出發，避免把流程便利或單次印象直接作為責任判定。對高階決策而言，可解釋性往往比語氣上的果斷更重要。</p>\n<p>倘若提前取得意向書仍可作為未來能力的有限證據，原本最直觀的歸責方式就可能產生誤差。公司宜先分開表述已實現、已簽約與仍待完成的里程碑，並把蒐證、說明和改善責任分配給具適當權限者。最終誠實呈現成果是否比製造聲量更能促進長期信任是否達成，會比「我們一向很重視公平」的口號更有說服力，也能降低管理者換人後制度迅速失效的風險。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若提前取得意向書仍可作為未來能力的有限證據後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>從人資只鼓勵員工在考核前一週上傳成就故事可以看見，決策者收到的資訊不一定等於完整實況；其中把績效紀錄集中在最後時點反而制度化近因偏差尤其容易被忽略。將檢查月度例行報告、跨部門驗收與年度評語結構納入比較，可先分辨事實差異與價值判斷的差異，避免用一份數據去回答它根本沒有能力回答的問題。如此形成的制度，不需要把任何一方預設為贏家。</p>\n<p>而員工也可能需要年度回顧整合整體故事也有必要被認真核對。由此推導的做法是採每季累積與年度整合並行，禁止臨時更換評分基準，不是當場選邊，而是建立讓不同資料被同樣檢驗的過程。若能使平時靜默做事者是否有穩定的被理解管道成為後續例行觀察，公司才不會每逢重大決定就重新發明同一場爭論；缺乏必要證據時則應承認保留事項。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若員工也可能需要年度回顧整合整體故事後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>一項好的制度不可能讓所有參與者立即滿意，但至少應讓各方知道自己正在承擔哪一種責任，以及如何透過正式程序修正事實認定。當資深工程師多年降低系統故障但沒有單次爆紅專案和人資只鼓勵員工在考核前一週上傳成就故事等情境獲得相同的查證標準時，管理權才不必依靠個人威望維持；這也是企業不斷擴大規模後仍能維持信任的必要條件。</p>\n<h2>法律治理只提供邊界，不能把偏誤直接定罪</h2>\n<p>人事評分偏差通常不是刑事或行政不法的自動證明；但若涉及基於性別或性傾向的差別待遇、利用權勢長期羞辱，或對提出申訴者採取報復，企業就不能再用「認知偏誤」輕輕帶過。法律要求的要件與一般管理品質指標必須分清，讓審查不因無根據的刑事化想像而偏離主題。 莊鈞翔 博士強調，制度成熟的標誌不是爭議從此消失，而是即使面對高度緊張的情境，組織仍能維持相同的查證方法、相當的程序保障與後續修正空間。</p>\n<p>在實際部門管理裡，員工認為因沒有華麗簡報而落選就主張一定違法並不罕見，難處在於選任欠佳不等於有可直接認定的法定歧視或霸凌。要讓專業判斷可受檢驗，應以查核是否存在受保護身分差別待遇或不當權勢行為補足判斷的缺口，也要問清楚相同情況下其他人是否受到相同待遇。這些資料不會消除所有裁量，但至少能降低任意性並讓異議有切入點。</p>\n<p>另一方面，個案仍可能有真正隱蔽的歧視線索；此時堅持一種單向敘事只會擴大誤解。適當路徑是分開啟動法律查證與績效流程改進，把程序的正當性建立在行動及其理由之上。往後應檢驗不同類型爭議是否走向適當的救濟而非互相取代，確認沒有因一時處理便利而犧牲長期人才、誠信或權益；制度若有錯誤也應留出修正空間。</p>\n<p>尤其當員工認為因沒有華麗簡報而落選就主張一定違法涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓分開啟動法律查證與績效流程改進在下一次相似事件仍可被使用，並使不同類型爭議是否走向適當的救濟而非互相取代可作為制度是否改善的具體尺度。</p>\n<p>一個常被輕忽的警訊是主管用心理安全感作理由掩飾沒有具體證據的低分。此時值得追問的不是誰先抱怨，而是健康管理指標不應被任意當成投票話術。若公司能先取得檢查具體管理行為、員工感受的來源及相同標準，就有機會把模糊的人格爭論轉成可分析的工作安排與具體言行；做不到時，至少應暫列待查，而不是讓懷疑自然長成確定結論。</p>\n<p>不要忽略高績效主管的團隊也可能真有心理健康風險這項反論，因為它可能直接改變原先的歸責方向。較穩健的方式是另設適切職場風險審查而不以業績抵銷，讓申辯與必要保護同時存在。至於評估者是否能同時肯定成果並面對不當言行，不應留成抽象願景，而要在下一次正式檢討時確認能否由資料支持，否則管理決策只是在不同權力者間換一種說法。</p>\n<p>尤其當主管用心理安全感作理由掩飾沒有具體證據的低分涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓另設適切職場風險審查而不以業績抵銷在下一次相似事件仍可被使用，並使評估者是否能同時肯定成果並面對不當言行可作為制度是否改善的具體尺度。</p>\n<p>面對公司準備全面蒐集每封員工郵件作為近因偏誤防線，成熟的主管不宜只求自己支持的人勝出，而要思考全量監控會侵蝕隱私並製造新的權力濫用風險。查證檢查蒐集必要性、保留期限、存取授權與去識別方式之後，才有機會確認哪些原因在個人可控制範圍內，哪些則源自環境或制度。這樣的劃分不是為了替問題找藉口，而是防止錯誤處方，使相同危險在下一次人事決策中重演。</p>\n<p>最後還須衡量真正重大爭議可能需要保存特定原始訊息。在未把握所有條件以前，採最低必要資料和正式調取程序比單純宣示誰對誰錯更能守住制度；其合理性應以績效客觀化是否沒有以犧牲尊嚴作為代價是否逐步實現來檢驗。如此即使決策的結果未獲所有人支持，也能讓人理解組織沒有為方便而忽略反面證據。</p>\n<p>尤其當公司準備全面蒐集每封員工郵件作為近因偏誤防線涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓採最低必要資料和正式調取程序在下一次相似事件仍可被使用，並使績效客觀化是否沒有以犧牲尊嚴作為代價可作為制度是否改善的具體尺度。</p>\n<p>本節最後需要回到長期效果，而不是案件或專案的當日勝負。若公司願意正視選任欠佳不等於有可直接認定的法定歧視或霸凌，也願意檢驗績效客觀化是否沒有以犧牲尊嚴作為代價，就有可能把一次衝突轉成制度學習。反過來說，若永遠只依主管印象或單方文件決定，短期或許節省會議時間，長期卻會讓人才、法遵與營運風險一起累積。</p>\n<p>大腦確實不是一部可無限制儲存資訊的機器，但組織不必因此接受錯誤決策。關鍵不在於把每個主管訓練成認知心理學家，而在於讓正反證據被有秩序地呈現，讓重大例外另有處理路徑，讓近期的突破既被認真看見又不抹除長期事實。行為科學在此應當幫助制度更謙遜，而不是提供任何人不可質疑的定律。 莊博士始終將制度的可追溯性置於語氣的強硬之前；一套制度若只能用來證明主管正確，不能保護不同意見，終將再次複製最初所欲解決的問題。</p>","legal_html":"<div class=\"section-label\">▍法律依據與資料來源說明</div>\n<p>法源查核基準日：2026年11月1日</p>\n<p class=\"legal-note\">本節以正式法令／裁判及研究來源為據；「條文原文／要旨」與「本文對照」分開書寫，治理建議不等同法定義務。</p>\n<p><strong>• Kahneman et al.（1993），〈When More Pain Is Preferred to Less: Adding a Better End〉｜研究來源：該研究探討經驗結尾與回憶評價之關聯；由實驗結果延伸到職場晉升，仍屬管理情境的理論應用而非個別人事決定的直接證據。</strong></p>\n<p>本文對照：峰終與近因之討論屬行為科學推論；不能直接宣稱任何一位評委必受偏誤左右，也不應讓單一實驗取代績效驗證。</p>\n<p><strong>• 《勞動基準法》第70條｜條文要旨：僱用勞工30人以上的雇主，應依事業性質訂定工作規則，內容包括考勤、獎懲、升遷及其他事項，報請主管機關核備並公開揭示。</strong></p>\n<p>本文對照：對三十人以上雇主，晉升及獎懲應置於已揭示工作規則的框架內；法條並未強制每家公司使用24個月績效儀表板。</p>\n<p><strong>• 《個人資料保護法》第5條｜條文：個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。</strong></p>\n<p>本文對照：量化考績與跨期資料比較仍受個資比例原則限制，資料越長越多不代表就越合法或客觀。</p>\n<div class=\"section-label\">▍治理思想依據 GOVERNANCE REFERENCE</div>\n<p><strong>▮ 莊鈞翔《不同世代企業家人格特質、創新能力對企業經營績效之影響｜以領導風格為中介變數》</strong></p>\n<p>治理對照：援引該研究題旨中「世代、人格、創新與領導風格」的關聯問題意識，延伸探討人員評價如何避免把單一亮點等同長期能力；不將該研究當作峰終定律的直接實驗證據。</p>\n<p><strong>▮ 莊鈞翔（2026）《內在法遵 Internal Compliance｜為你的內心，打造一座不可侵犯的至聖所》</strong></p>\n<p>治理對照：將內在法遵的自我約束轉成對績效資料的主動求證，讓決策者對自己喜好的候選人也使用同一套評量原則。</p>","notes_html":"<p>註 3：本文以莊鈞翔博士之研究、思想與治理判讀為架構，AI僅輔助資料整理、草稿生成及編修；發表版本以作者本人審定為準。AI不取代作者的學術責任、專業判斷與最終決策。</p>\n<p>註 4：本文為企業治理、制度設計與法律風險之一般分析，不構成執業律師對具體案件之正式法律意見、訴訟代理或結果保證。個案仍須依適用時間、完整事證、法律與程序狀態，由具資格之律師審閱。</p>"},{"id":3,"label":"第三篇","title":"時代的創新恐懼","subtitle":"當形式包裝（新玩意）集體綁架管理高層","abstract_html":"<p>中華企業策略永續發展學會 創會理事長 莊鈞翔 博士觀察到，在許多企業的重大會議裡，讓人緊張的並非創新本身，而是創新被用成衡量主管是否與時俱進的象徵。當新產品、新平台、生成式人工智慧或炫目的數據看板被放在台前，長期改善交付品質、維持客戶信任及降低事故風險的工作，便可能因缺乏故事感而退居背景。問題不是該不該引進新工具，而是誰負責證明新工具值得投入、誰承擔失敗代價、誰有權決定舊有成果不再重要。</p>","body_html":"<h2>創新焦慮不該成為資源配置的捷徑</h2>\n<p>科技更新速度快，董事會自然有理由關心競爭對手是否取得突破，但速度壓力本身不構成任何專案的投資理由。當主管因為害怕被貼上落伍標籤而支持最新口號，真正需要被審查的是投資假設、替代方案與放棄原本業務的機會成本，不能只檢查簡報視覺是否完整。 莊博士所要求的不是把人事選擇簡化成好人與壞人的對決，而是把證據、權力與責任放回同一張決策桌，這也正是本篇討論的尺度。</p>\n<p>年度決策的一個切面是這樣的：某部門提議立即導入全公司AI客服，卻尚未定義哪些問題適合自動處理。問題若只停在雙方誰較可信，便會錯過真正需要釐清的技術潮流與實際顧客服務需求之間缺乏可核實的對應。對此，蒐集現有問題分類、人工回覆成本、錯誤風險與可用知識庫，才能把原本模糊的說法化成可檢驗的事實。尤其當決策直接影響職位、收入或人格評價，資料形成時間和對照條件必須先清楚，不能用發言者的資歷取代證據的分量。</p>\n<p>反過來說，小規模試用可能有學習價值，即使初期不立刻賺錢，因此在未完成交叉檢驗前不應排除不同解釋。比較穩妥的處置是以有限客群試驗並建立人工接管與退出條件，並向受到影響的人交代決策條件與後續窗口。最終應回頭檢查投入資本是否真正轉化為品質與信任而非只有新聞稿；若新的資料顯示原判斷有誤，應允許程序修正，而不要求當事人以名譽承擔組織的判斷成本。</p>\n<p>這個議題還牽涉一個次序問題：先辨認技術潮流與實際顧客服務需求之間缺乏可核實的對應所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，蒐集現有問題分類、人工回覆成本、錯誤風險與可用知識庫便可能淪為選擇性證明的工具；保留小規模試用可能有學習價值，即使初期不立刻賺錢接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>觀察主管把導入最新數位工具直接視為領導者創新的證明，最容易犯的錯是先把表面結果當作動機證明；實際上，使用新工具與改善營運兩者尚未建立因果關係。必須先從核對流程前後的時間、錯誤率、員工負擔與實際採用比例著手，確認資料是否完整、期間是否相同、是否受外部條件影響。如此才知道問題是個人的行為、組織的安排，還是一項需要再查的未決事實，而非單純換一種更強烈的形容詞。</p>\n<p>制度亦須容許新流程可能尚在學習曲線，短期數據會低估長期效益這一種可能，否則所謂客觀很容易只是對單一故事的放大。建議依次採取以分階段指標而非一次性發布儀式驗收，先記錄理由、再確認責任人與檢查節點。真正的成效不是某一方無話可說，而是組織是否能在不顧面子的情況下停止無效專案，這會決定下一位主管接任時能否沿用同一套可理解的方法。</p>\n<p>這個議題還牽涉一個次序問題：先辨認使用新工具與改善營運兩者尚未建立因果關係所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，核對流程前後的時間、錯誤率、員工負擔與實際採用比例便可能淪為選擇性證明的工具；保留新流程可能尚在學習曲線，短期數據會低估長期效益接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>當董事會因競爭對手公布大型轉型計畫而要求同步跟進，真正的難題不是要不要立即表態，而是如何回答模仿市場聲量可能忽略自家客戶、資料與人才條件。若只聽一方陳述，整個決策容易建立在選擇性資料上。分析競品公開成果、實際市場需求及本公司可承擔的投資應當進入正式記錄，並與既有基準比較；如果尚無充分資訊，就應承認資料不足，而不能把未知包裝成確定的專業判斷。</p>\n<p>可是，先行者的嘗試也可能揭示真正的產業變局同樣可能成立；治理者必須保留這個變數，以免把善意警訊當作攻擊或把不實指控當成事實。應實施用多情境投資分析判斷跟進、觀察或另闢路線，並讓當事人有補充、反駁與再次核對的機會。下一階段最值得追蹤的不是誰在會議中佔上風，而是策略能否在快速與克制之間保有合理選擇權，因為這才接近組織的長期利益。</p>\n<p>這個議題還牽涉一個次序問題：先辨認模仿市場聲量可能忽略自家客戶、資料與人才條件所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，分析競品公開成果、實際市場需求及本公司可承擔的投資便可能淪為選擇性證明的工具；保留先行者的嘗試也可能揭示真正的產業變局接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>從某部門提議立即導入全公司AI客服，卻尚未定義哪些問題適合自動處理延伸到這一節其他情境，可以看到真正有價值的改革不是要求員工或主管少說話，而是讓每個重要主張找到可查證的資料、相同的衡量條件與必要的反駁空間。若企業只把制度寫成宣示，策略能否在快速與克制之間保有合理選擇權便始終無法實現；只有將方法變成例行職責，才可能防止相同矛盾在下一次決策中重演。</p>\n<h2>把創新拆成可驗證的投資命題</h2>\n<p>所謂「創新項目脫水」，並不是每個新計畫都必須立刻交出營收，而是讓提案人能回答問題從哪裡來、成功的可觀察證據是什麼、試驗失敗的損失上限是多少。基礎研究、流程改善與市場開拓各有不同成熟週期，不能單用季度營業額比較，也不能把無法衡量當成無須衡量。 莊鈞翔 博士提醒，任何制度安排都應先確認資料可以證明什麼，不能證明什麼，尤其涉及人格、法律責任或職涯發展時，更要防止推定取代查證。</p>\n<p>值得在會議桌前提出的情境是研發團隊提出尚無收入的核心演算法專案。從表面看來，爭議似乎只是個別人的態度，仔細分析卻牽涉以短期營收一刀切可能扼殺重要但高不確定的長期能力。此時查核可重現測試、專利風險、技術壁壘及可用場景不只是補一份文件，更是使不同立場使用相同尺度的起點。沒有共同事實底座，任何強調效率或公平的口號都可能被各方拿來為既定立場服務。</p>\n<p>從另一面看，技術成果可能在商業化前經歷多次失敗提醒我們任何單一資料都有侷限。處理方法不是用主管直覺補足，而是設置技術里程碑、資本上限與獨立審查門檻，把程序寫入可追溯紀錄。當檢驗重點移向投入是否逐步降低關鍵未知而非無限追加經費時，評價就比較不容易成為權勢使用的附屬品，也較能使不同部門在不完全同意時接受相同規則。</p>\n<p>要避免程序成為另一種儀式，查核可重現測試、專利風險、技術壁壘及可用場景應轉化為可重複核對的工作紀錄，技術成果可能在商業化前經歷多次失敗也要列入同一比較表。唯有如此，設置技術里程碑、資本上限與獨立審查門檻才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>假設一套看板號稱讓團隊效率提升五成但未說明比較期間，管理者必須避免過早把結果歸咎於某個人的品格，因為儀表板數字容易受統計口徑與選樣偏誤影響。最有用的資訊來自對照導入前後總工時、返工量、工作難度與資料缺漏，並應把來源、涵蓋範圍和例外情形一併說明。這個過程也可能發現原有制度的缺口，使人事問題不再被簡化為某位主管與某位員工誰比較會說話。</p>\n<p>若初期效率提升也可能來自員工趕工或環境變動，一味先行處分便可能製造新的不公平，因此應採由財務及使用部門共同確認效益口徑，將事實調查與必要的暫時保護區分。此後觀察改善是否可在不同團隊與淡旺季重現，才能知道改變的是表面文件還是實際管理行為。若發現原決定傷害了本來應保護的權益，制度也應提供明確的更正與救濟途徑。</p>\n<p>要避免程序成為另一種儀式，對照導入前後總工時、返工量、工作難度與資料缺漏應轉化為可重複核對的工作紀錄，初期效率提升也可能來自員工趕工或環境變動也要列入同一比較表。唯有如此，由財務及使用部門共同確認效益口徑才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>企業遇到業務部宣稱新社群活動創造大量流量與轉換時，往往希望迅速有個結論，但速度不能省略點擊數不等於新增客戶，更不等於有品質的淨貢獻這個判斷。為免短期情緒主導，應先整理核算取得成本、轉換、退貨、回購及毛利淨值，必要時讓相關人員補充不利於自己的事實。決策者真正要管理的是錯誤代價，而不是讓每場會議看起來毫無歧見。</p>\n<p>在反面檢驗中，品牌曝光可能產生較長期且難立刻歸因的效果不能被排除。管理層應選擇分開短期轉換與品牌資產假說並設追蹤期，並避免把尚未證實的可能性寫成某人的人格特質。長期而言，若資源是否從漂亮數字轉向可持續商業結果仍無法獲得解答，代表目前採集的資料尚不足以支撐高強度人事處分，組織就應補強標準而不是加重語氣。</p>\n<p>要避免程序成為另一種儀式，核算取得成本、轉換、退貨、回購及毛利淨值應轉化為可重複核對的工作紀錄，品牌曝光可能產生較長期且難立刻歸因的效果也要列入同一比較表。唯有如此，分開短期轉換與品牌資產假說並設追蹤期才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>這三個情境雖然起點不同，卻都指向一項管理責任：不能只追問誰犯錯，還必須確認企業給了什麼條件、誰掌握關鍵資訊、哪些資料需要在正式決定前補足。對業務部宣稱新社群活動創造大量流量與轉換尤其如此，資源是否從漂亮數字轉向可持續商業結果應是後續檢討的核心，而不應在一份漂亮的結案報告後就失去追蹤。</p>\n<h2>避免新工具評價吞沒原本的穩健工作</h2>\n<p>企業真正珍貴的資產往往同時包括可成長的機會與不能出錯的底盤。無論是工廠良率、資安維護、客戶保留或關鍵流程遵循，這些工作因為成果是「沒有災難」，在會議中很容易顯得平淡；若人事考評只獎勵看得見的新發布，反而可能刺激員工放棄最值得守住的基本盤。 中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，治理者不應用單一口號取代制度，而應將爭議拆為可檢驗的事實、可說明的準則與可修正的後續行動。</p>\n<p>在工廠品質主管把重大缺失率維持極低卻未獲年度創新獎的案例裡，如果直接接受第一個看似合理的說法，就可能忽略防止損失的貢獻常被誤認為沒有進展。整理避免返工、召回、停線及客訴的風險成本資料提供了可以重新檢驗的入口，也迫使評估者說清楚其比較標準。比起當場擴大衝突，這種先還原事實、再討論責任的方法，能讓後續選擇有比較穩定的正當性。</p>\n<p>然而品質穩定部分也可能來自設備更新與供應鏈改善，這使事件不宜由一個最方便的標籤收束。以在評核中設防損、可維護性與創新價值各自的指標作為下一步，可以讓各方知道哪些條件已被確認、哪些仍有爭論；後續再以長期守住安全及信任的團隊是否得到合理資源作為評估點，檢驗此次處理是否真的降低風險。最忌諱的是把暫時措施做成終局處罰，卻不再追蹤結果。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存整理避免返工、召回、停線及客訴的風險成本資料和品質穩定部分也可能來自設備更新與供應鏈改善，接任者便無法理解處理基礎。將長期守住安全及信任的團隊是否得到合理資源轉為可觀察的後續指標，並為在評核中設防損、可維護性與創新價值各自的指標保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>有些治理漏洞藏在熟悉的流程裡，例如資安工程師全年完成多項無聲漏洞修補，對外卻沒有亮眼成果。它真正揭露的未必是哪個人有惡意，而是看不見的預防性工作一旦被低估會推高未來事故風險。公司若要避免再次出現相同爭議，首先需要蒐集弱點修補時效、暴露面、演練結果與基礎設施健康度；對涉及私人評價與法律效果的資訊，更應記錄哪些是直接觀察，哪些只是轉述或推測。</p>\n<p>當然，沒有事故不代表控制措施必然有效必須納入討論，否則評估只剩下證明原決策正確。採取以風險降低的可驗證指標補足成果敘述之後，管理者還要安排適切的溝通和後續檢討，因為企業是否把不出事當作值得管理的績效並非靠一次會議自然完成。若制度能接受新的反證，員工更可能在問題擴大前提出真實訊息，而不是被迫等待衝突爆發。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存蒐集弱點修補時效、暴露面、演練結果與基礎設施健康度和沒有事故不代表控制措施必然有效，接任者便無法理解處理基礎。將企業是否把不出事當作值得管理的績效轉為可觀察的後續指標，並為以風險降低的可驗證指標補足成果敘述保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>另一項典型情況是客服團隊持續維繫老客戶，市場部新活動反而獲得全部資源，這使新增客戶與既有顧客終身價值並非互斥浮現。若管理層只想在當下表決通過，事後往往很難重建為何如此判斷。把比較取得成本、留存率、服務成本及推薦貢獻納入可追溯資料，並對照當時實際的業務條件，才能讓一項有爭議的決定仍有被理解、修正與改善的可能。</p>\n<p>仍要注意擴大新客可能仍是未來成長必要投資，這提醒決策者在查證前保留判斷彈性。應依照配置成長與保留雙重投資預算並定期檢討處理，並同步記錄措施的必要性與可撤回條件。日後衡量成功與否，可看資源是否支持完整客戶生命週期而非一時聲勢，不宜只以發出多少通知、完成多少表單來自我證明，因為程序的價值終究在於是否改善真實關係。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存比較取得成本、留存率、服務成本及推薦貢獻和擴大新客可能仍是未來成長必要投資，接任者便無法理解處理基礎。將資源是否支持完整客戶生命週期而非一時聲勢轉為可觀察的後續指標，並為配置成長與保留雙重投資預算並定期檢討保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>把這裡的討論帶回高階會議，應先對齊目標，再評估可採證據，最後決定誰負責執行與回報。即使品質穩定部分也可能來自設備更新與供應鏈改善，制度也不能因此省略公正的解釋機會；同樣地，若資源是否支持完整客戶生命週期而非一時聲勢仍無法確認，這就不是再發一份政策文件可以解決的問題，而是需要持續改善的管理缺口。</p>\n<h2>建立董事會可接受的試驗與退出紀律</h2>\n<p>創新不需要被關進冗長審批，但需要有資金邊界、責任歸屬和成果回顧。最好在立項當下就寫清楚可能成功的理由、最容易失敗的假設、何時停止、何時可以擴大，以及如果要轉型誰負責支援原有客戶與員工，才能防止創新名義變成不必問責的通行證。 依莊博士的治理視角，即使某項提議在倫理上令人同情，也應區分已證實的事實、當事人的主張及仍待驗證的假說，讓決策不因發言者身分而預先偏向。</p>\n<p>考慮到新產品試點初步客戶反應良好，提案人要求立刻全面擴張，管理者最需要克制的是用單一結果替代完整分析。因為試點客群與正式市場的規模差異可能令成功不具可複製性，證據不能只選擇符合既有偏好的部分。透過檢查分眾效果、容量瓶頸、資安及售後服務負荷，可以逐步確認各方主張的核心事實；同時應明示尚未確認的因素，使爭議不必為了求快而被永久貼上標籤。</p>\n<p>在這裡，過度謹慎也可能錯失競爭時間窗口提供重要的反向測試。較可行的步驟是設分級放量與停止條件，允許快速但可逆的投入，再以清楚時間點檢查是否收到新資料或需要調整。對公司而言，決策是否保留改變方向的成本與時間才是值得投入管理注意力的結果；在未能證明之前，單方的強烈語氣不應轉化為另一方必須承擔的確定法律後果。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若過度謹慎也可能錯失競爭時間窗口後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>當組織出現專案落後後有人用「創新本來就會失敗」拒絕提出檢討，有人可能立即主張應嚴懲，也有人主張不必理會，但兩種立場都應先面對合理試錯與不負責任地耗用資源不能混為一談。實務查核宜從追查哪些假設錯誤、哪些資料新獲得、是否按階段停損出發，避免把流程便利或單次印象直接作為責任判定。對高階決策而言，可解釋性往往比語氣上的果斷更重要。</p>\n<p>倘若探索型專案的收穫可能不是當初設定的財務數字，原本最直觀的歸責方式就可能產生誤差。公司宜先將可轉用知識列入結案但不得替代風險揭露，並把蒐證、說明和改善責任分配給具適當權限者。最終組織能否獎勵誠實止損而不是持續押注面子是否達成，會比「我們一向很重視公平」的口號更有說服力，也能降低管理者換人後制度迅速失效的風險。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若探索型專案的收穫可能不是當初設定的財務數字後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>從某高階主管為了年報敘事要求所有部門冠上AI轉型名稱可以看見，決策者收到的資訊不一定等於完整實況；其中名詞統一可能掩蓋不同流程的實際成熟程度尤其容易被忽略。將辨識哪些流程使用模型、哪些只是統計自動化納入比較，可先分辨事實差異與價值判斷的差異，避免用一份數據去回答它根本沒有能力回答的問題。如此形成的制度，不需要把任何一方預設為贏家。</p>\n<p>而統一品牌敘事有助於內部動員但不能代替真實說明也有必要被認真核對。由此推導的做法是建立對外說明與內部技術驗收的雙層語言，不是當場選邊，而是建立讓不同資料被同樣檢驗的過程。若能使企業是否能向利害關係人交付可核實的承諾成為後續例行觀察，公司才不會每逢重大決定就重新發明同一場爭論；缺乏必要證據時則應承認保留事項。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若統一品牌敘事有助於內部動員但不能代替真實說明後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>一項好的制度不可能讓所有參與者立即滿意，但至少應讓各方知道自己正在承擔哪一種責任，以及如何透過正式程序修正事實認定。當新產品試點初步客戶反應良好，提案人要求立刻全面擴張和某高階主管為了年報敘事要求所有部門冠上AI轉型名稱等情境獲得相同的查證標準時，管理權才不必依靠個人威望維持；這也是企業不斷擴大規模後仍能維持信任的必要條件。</p>\n<h2>把倫理、法律與科技治理放在同一層</h2>\n<p>導入數位工具還可能觸及個人資料、營業秘密、員工監測與工作壓力等治理問題；這不是說新工具天然違法，而是管理者須先建立目的限制、存取權限、人工覆核與適當安全措施。職場管理若因導入工具而造成持續羞辱或不合理要求，也不能以「數位轉型必要」直接排除職業安全衛生法上個案審查。 莊鈞翔 博士強調，制度成熟的標誌不是爭議從此消失，而是即使面對高度緊張的情境，組織仍能維持相同的查證方法、相當的程序保障與後續修正空間。</p>\n<p>在實際部門管理裡，為了提高效率要求全員把客戶個資輸入未審查的外部生成式模型並不罕見，難處在於方便性與資料合法使用、營業秘密保護之間存在高度風險。要讓專業判斷可受檢驗，應以核對工具條款、資料類型、保存機制與第三方接觸範圍補足判斷的缺口，也要問清楚相同情況下其他人是否受到相同待遇。這些資料不會消除所有裁量，但至少能降低任意性並讓異議有切入點。</p>\n<p>另一方面，經合法契約與技術保護的工具可能允許適當處理；此時堅持一種單向敘事只會擴大誤解。適當路徑是先做資料分級與授權審查，敏感內容採替代方案，把程序的正當性建立在行動及其理由之上。往後應檢驗企業是否把信任成本納入創新投資評估，確認沒有因一時處理便利而犧牲長期人才、誠信或權益；制度若有錯誤也應留出修正空間。</p>\n<p>尤其當為了提高效率要求全員把客戶個資輸入未審查的外部生成式模型涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓先做資料分級與授權審查，敏感內容採替代方案在下一次相似事件仍可被使用，並使企業是否把信任成本納入創新投資評估可作為制度是否改善的具體尺度。</p>\n<p>一個常被輕忽的警訊是主管利用新系統即時比較員工每分鐘的滑鼠與訊息活動。此時值得追問的不是誰先抱怨，而是活動量與工作成果可能無關，過度監控還會侵蝕尊嚴。若公司能先取得確認蒐集目的、衡量有效性、隱私風險與申訴機制，就有機會把模糊的人格爭論轉成可分析的工作安排與具體言行；做不到時，至少應暫列待查，而不是讓懷疑自然長成確定結論。</p>\n<p>不要忽略對高風險操作流程適當稽核可能具有安全必要這項反論，因為它可能直接改變原先的歸責方向。較穩健的方式是限定資料範圍、告知方式及用途，不作未經驗證的績效代理，讓申辯與必要保護同時存在。至於數位管理是否仍以人而非打卡頻率為主體，不應留成抽象願景，而要在下一次正式檢討時確認能否由資料支持，否則管理決策只是在不同權力者間換一種說法。</p>\n<p>尤其當主管利用新系統即時比較員工每分鐘的滑鼠與訊息活動涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓限定資料範圍、告知方式及用途，不作未經驗證的績效代理在下一次相似事件仍可被使用，並使數位管理是否仍以人而非打卡頻率為主體可作為制度是否改善的具體尺度。</p>\n<p>面對員工提出工具導入使工作負荷失衡卻被視為抗拒改革，成熟的主管不宜只求自己支持的人勝出，而要思考變革摩擦可能是學習期，也可能反映真正不合理的制度負擔。查證核對訓練時間、工作量變化、可用資源與錯誤回報之後，才有機會確認哪些原因在個人可控制範圍內，哪些則源自環境或制度。這樣的劃分不是為了替問題找藉口，而是防止錯誤處方，使相同危險在下一次人事決策中重演。</p>\n<p>最後還須衡量短期學習成本未必足以否定長期效益。在未把握所有條件以前，設回饋與調整窗口並區分業務必要與不當對待比單純宣示誰對誰錯更能守住制度；其合理性應以變革是否讓不同層級都能提出可改進的事實是否逐步實現來檢驗。如此即使決策的結果未獲所有人支持，也能讓人理解組織沒有為方便而忽略反面證據。</p>\n<p>尤其當員工提出工具導入使工作負荷失衡卻被視為抗拒改革涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓設回饋與調整窗口並區分業務必要與不當對待在下一次相似事件仍可被使用，並使變革是否讓不同層級都能提出可改進的事實可作為制度是否改善的具體尺度。</p>\n<p>本節最後需要回到長期效果，而不是案件或專案的當日勝負。若公司願意正視方便性與資料合法使用、營業秘密保護之間存在高度風險，也願意檢驗變革是否讓不同層級都能提出可改進的事實，就有可能把一次衝突轉成制度學習。反過來說，若永遠只依主管印象或單方文件決定，短期或許節省會議時間，長期卻會讓人才、法遵與營運風險一起累積。</p>\n<p>創新的真正敵人不是質疑，而是不願接受驗證的焦慮。當公司敢在公開會議中承認新技術尚有未知、也敢給長期守護品質的人合理評價，就能把流行語變成可檢驗的選項，把資本投入變成可調整的承諾。高階治理的任務是替企業留下前進能力，而不是替任何人證明他永遠站在潮流最前方。 莊博士始終將制度的可追溯性置於語氣的強硬之前；一套制度若只能用來證明主管正確，不能保護不同意見，終將再次複製最初所欲解決的問題。</p>","legal_html":"<div class=\"section-label\">▍法律依據與資料來源說明</div>\n<p>法源查核基準日：2026年11月1日</p>\n<p class=\"legal-note\">本節以正式法令／裁判及研究來源為據；「條文原文／要旨」與「本文對照」分開書寫，治理建議不等同法定義務。</p>\n<p><strong>• 《公司法》第23條第1項｜條文要旨：公司負責人應忠實執行業務並盡善良管理人之注意義務；違反義務致公司受損害者，依法負損害賠償責任。</strong></p>\n<p>本文對照：董事及公司負責人的創新投資決策應以公司利益與審慎注意為基礎；不宜將「支持新工具」或「反對新工具」單獨等同忠實義務的違反。</p>\n<p><strong>• 《個人資料保護法》第5條｜條文：個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。</strong></p>\n<p>本文對照：導入人員績效監測、數位工具足跡或AI分析前，應交代蒐集目的、使用範圍與資料治理界線。</p>\n<p><strong>• 《職業安全衛生法》第22條之1｜條文要旨：職場霸凌涉及利用職務或權勢關係，逾越業務上必要且合理範圍，持續以不當言詞或行為致勞工身心健康受危害；情節重大者，不以持續發生為必要。</strong></p>\n<p>本文對照：對員工創新能力的評論仍須區分合理專業判斷與利用權勢不當侵害，不能把負面考評自動刑事化或霸凌化。</p>\n<div class=\"section-label\">▍治理思想依據 GOVERNANCE REFERENCE</div>\n<p><strong>▮ 莊鈞翔《不同世代企業家人格特質、創新能力對企業經營績效之影響｜以領導風格為中介變數》</strong></p>\n<p>治理對照：借用該研究對創新能力與領導風格之題旨，重新追問「懂科技名詞」與「可持續創造組織價值」之間是否真有證據。</p>\n<p><strong>▮ 莊鈞翔（2026）《企業策略導入公司治理法遵精神｜以外部法律顧問團隊協助為例》</strong></p>\n<p>治理對照：以企業策略及法遵治理視角，要求新專案具備效益、風險、權責與退出條件，避免用創新口號替代投資判斷。</p>","notes_html":"<p>註 3：本文以莊鈞翔博士之研究、思想與治理判讀為架構，AI僅輔助資料整理、草稿生成及編修；發表版本以作者本人審定為準。AI不取代作者的學術責任、專業判斷與最終決策。</p>\n<p>註 4：本文為企業治理、制度設計與法律風險之一般分析，不構成執業律師對具體案件之正式法律意見、訴訟代理或結果保證。個案仍須依適用時間、完整事證、法律與程序狀態，由具資格之律師審閱。</p>"},{"id":4,"label":"第四篇","title":"控制權焦慮的致命長臂","subtitle":"中階派系「代理人戰爭」的解構與制衡","abstract_html":"<p>中華企業策略永續發展學會 創會理事長 莊鈞翔 博士觀察到，組織裡的代理人戰爭，不一定從密謀開始，有時只是主管長期提攜熟悉、配合度高的人，卻在不知不覺間把職位適任性與個人可控制性混在一起。若晉升名額稀少，推薦權就可能成為不同部門交換影響力的工具。將這種現象一概歸咎於「黑派系」太粗糙；真正需要分析的是推薦制度、評委利益關係、候選人能力證據，以及董事會如何守住對人才任用的最終責任。</p>","body_html":"<h2>推薦人、候選人與組織利益不總是一致</h2>\n<p>有能力又獨立的員工可能為公司帶來長遠價值，也可能在現階段缺乏必要的團隊領導經驗；資深主管推薦熟悉部屬可能基於合理觀察，也可能受到自身部門資源與管理便利性的誘惑。制度不應先入為主認定誰善誰惡，而應讓推薦理由能被不具相同利益的人實際檢驗。 莊博士所要求的不是把人事選擇簡化成好人與壞人的對決，而是把證據、權力與責任放回同一張決策桌，這也正是本篇討論的尺度。</p>\n<p>年度決策的一個切面是這樣的：部門主管推薦多年追隨自己的副理擔任跨部門總監。問題若只停在雙方誰較可信，便會錯過真正需要釐清的熟悉與忠誠是合作資產，但不等於具備跨領域整合能力。對此，核對候選人跨部門成果、衝突處理及失敗經驗，才能把原本模糊的說法化成可檢驗的事實。尤其當決策直接影響職位、收入或人格評價，資料形成時間和對照條件必須先清楚，不能用發言者的資歷取代證據的分量。</p>\n<p>反過來說，推薦人也可能是最了解其深層能力的人，因此在未完成交叉檢驗前不應排除不同解釋。比較穩妥的處置是以事前職位需求和獨立評核補足推薦盲點，並向受到影響的人交代決策條件與後續窗口。最終應回頭檢查決定是否可由與候選人無利益關係的人重新解讀；若新的資料顯示原判斷有誤，應允許程序修正，而不要求當事人以名譽承擔組織的判斷成本。</p>\n<p>這個議題還牽涉一個次序問題：先辨認熟悉與忠誠是合作資產，但不等於具備跨領域整合能力所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，核對候選人跨部門成果、衝突處理及失敗經驗便可能淪為選擇性證明的工具；保留推薦人也可能是最了解其深層能力的人接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>觀察幾個部門在選任會議中互相支持彼此推薦人選，最容易犯的錯是先把表面結果當作動機證明；實際上，相互支持可能是專業認同，也可能形成利益交換。必須先從檢查表決紀錄、過去推薦模式與評委利益迴避情形著手，確認資料是否完整、期間是否相同、是否受外部條件影響。如此才知道問題是個人的行為、組織的安排，還是一項需要再查的未決事實，而非單純換一種更強烈的形容詞。</p>\n<p>制度亦須容許不同部門對同一人才有高度共識並不當然不當這一種可能，否則所謂客觀很容易只是對單一故事的放大。建議依次採取要求每位評委分別提供可驗證理由並適度揭露關係，先記錄理由、再確認責任人與檢查節點。真正的成效不是某一方無話可說，而是推薦權是否受到透明規則而非人情網絡主導，這會決定下一位主管接任時能否沿用同一套可理解的方法。</p>\n<p>這個議題還牽涉一個次序問題：先辨認相互支持可能是專業認同，也可能形成利益交換所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，檢查表決紀錄、過去推薦模式與評委利益迴避情形便可能淪為選擇性證明的工具；保留不同部門對同一人才有高度共識並不當然不當接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>當獨立思考的高績效者因「不夠聽話」被視為管理風險，真正的難題不是要不要立即表態，而是如何回答服從命令與對公司負責的專業異議需要分開。若只聽一方陳述，整個決策容易建立在選擇性資料上。查核其反對是否涉及法遵、安全或重大營運風險應當進入正式記錄，並與既有基準比較；如果尚無充分資訊，就應承認資料不足，而不能把未知包裝成確定的專業判斷。</p>\n<p>可是，該員也可能真的不擅協商，影響領導職適任性同樣可能成立；治理者必須保留這個變數，以免把善意警訊當作攻擊或把不實指控當成事實。應實施同時評估異議品質、協作能力與尊重程序的態度，並讓當事人有補充、反駁與再次核對的機會。下一階段最值得追蹤的不是誰在會議中佔上風，而是企業能否讓有原則的不同意見成為制度資產，因為這才接近組織的長期利益。</p>\n<p>這個議題還牽涉一個次序問題：先辨認服從命令與對公司負責的專業異議需要分開所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，查核其反對是否涉及法遵、安全或重大營運風險便可能淪為選擇性證明的工具；保留該員也可能真的不擅協商，影響領導職適任性接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>從部門主管推薦多年追隨自己的副理擔任跨部門總監延伸到這一節其他情境，可以看到真正有價值的改革不是要求員工或主管少說話，而是讓每個重要主張找到可查證的資料、相同的衡量條件與必要的反駁空間。若企業只把制度寫成宣示，企業能否讓有原則的不同意見成為制度資產便始終無法實現；只有將方法變成例行職責，才可能防止相同矛盾在下一次決策中重演。</p>\n<h2>將「代理人」問題回到崗位匹配與利益衝突</h2>\n<p>真正值得警覺的不是有人跟主管關係好，而是關係好是否獲得了與職務要求無關的額外分數。若選任職位需要扛起長期財務結果與跨團隊責任，應具體列出這些能力；若需要照顧高風險團隊文化，也應有證據支撐，而非把「人緣好」和「績效強」粗暴對立。 莊鈞翔 博士提醒，任何制度安排都應先確認資料可以證明什麼，不能證明什麼，尤其涉及人格、法律責任或職涯發展時，更要防止推定取代查證。</p>\n<p>值得在會議桌前提出的情境是兩名候選人一位業績突出、一位長於團隊培育。從表面看來，爭議似乎只是個別人的態度，仔細分析卻牽涉對比方式若被簡化為業績對親和力就忽略職務完整性。此時依新職位工作責任衡量財務、人才、風控、溝通各項能力不只是補一份文件，更是使不同立場使用相同尺度的起點。沒有共同事實底座，任何強調效率或公平的口號都可能被各方拿來為既定立場服務。</p>\n<p>從另一面看，新設團隊可能真正更需要修復信任而非短期營收提醒我們任何單一資料都有侷限。處理方法不是用主管直覺補足，而是事先公開權重並以多元證據評分，把程序寫入可追溯紀錄。當檢驗重點移向員工是否知道公司究竟在選擇哪一種領導責任時，評價就比較不容易成為權勢使用的附屬品，也較能使不同部門在不完全同意時接受相同規則。</p>\n<p>要避免程序成為另一種儀式，依新職位工作責任衡量財務、人才、風控、溝通各項能力應轉化為可重複核對的工作紀錄，新設團隊可能真正更需要修復信任而非短期營收也要列入同一比較表。唯有如此，事先公開權重並以多元證據評分才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>假設推薦人聲稱候選人特別穩定且不會對現有主管構成挑戰，管理者必須避免過早把結果歸咎於某個人的品格，因為低衝突不必然等於高能力，仍需評估獨立決策。最有用的資訊來自檢視在資訊不足與壓力情境下的判斷及承擔紀錄，並應把來源、涵蓋範圍和例外情形一併說明。這個過程也可能發現原有制度的缺口，使人事問題不再被簡化為某位主管與某位員工誰比較會說話。</p>\n<p>若成熟組織仍需要能協調而非凡事反對的管理者，一味先行處分便可能製造新的不公平，因此應採以情境評估與跨職能訪談補足人格印象，將事實調查與必要的暫時保護區分。此後觀察組織是否培養敢負責的主管而非只選擇可預測的代理人，才能知道改變的是表面文件還是實際管理行為。若發現原決定傷害了本來應保護的權益，制度也應提供明確的更正與救濟途徑。</p>\n<p>要避免程序成為另一種儀式，檢視在資訊不足與壓力情境下的判斷及承擔紀錄應轉化為可重複核對的工作紀錄，成熟組織仍需要能協調而非凡事反對的管理者也要列入同一比較表。唯有如此，以情境評估與跨職能訪談補足人格印象才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>企業遇到評委同時是候選人的導師與部門預算決策者時，往往希望迅速有個結論，但速度不能省略身分重疊容易使個人利益混入人才選擇這個判斷。為免短期情緒主導，應先整理登錄實際隸屬、親屬、獎酬與利益關係，必要時讓相關人員補充不利於自己的事實。決策者真正要管理的是錯誤代價，而不是讓每場會議看起來毫無歧見。</p>\n<p>在反面檢驗中，完全排除熟悉人才的評委可能失去重要情報不能被排除。管理層應選擇要求揭露利益後決定迴避或限制表決範圍，並避免把尚未證實的可能性寫成某人的人格特質。長期而言，若程序可否在保留專業資訊與防止利益偏差間取得平衡仍無法獲得解答，代表目前採集的資料尚不足以支撐高強度人事處分，組織就應補強標準而不是加重語氣。</p>\n<p>要避免程序成為另一種儀式，登錄實際隸屬、親屬、獎酬與利益關係應轉化為可重複核對的工作紀錄，完全排除熟悉人才的評委可能失去重要情報也要列入同一比較表。唯有如此，要求揭露利益後決定迴避或限制表決範圍才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>這三個情境雖然起點不同，卻都指向一項管理責任：不能只追問誰犯錯，還必須確認企業給了什麼條件、誰掌握關鍵資訊、哪些資料需要在正式決定前補足。對評委同時是候選人的導師與部門預算決策者尤其如此，程序可否在保留專業資訊與防止利益偏差間取得平衡應是後續檢討的核心，而不應在一份漂亮的結案報告後就失去追蹤。</p>\n<h2>推薦責任不能變成非法薪酬處罰</h2>\n<p>原規劃主張推薦人承擔績效責任，方向值得發展；然而「推薦錯人就自動扣薪、扣年終」並非法定結果，也可能涉及工資及勞動契約限制。真正成熟的推薦問責，是事前設置人才培育義務、六個月支持與追蹤計畫、獨立檢討推薦判斷，而非要求主管以財產下注。 中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，治理者不應用單一口號取代制度，而應將爭議拆為可檢驗的事實、可說明的準則與可修正的後續行動。</p>\n<p>在董事長提出推薦人若選錯就扣發整年獎金的條款的案例裡，如果直接接受第一個看似合理的說法，就可能忽略不分原因的經濟懲罰可能違反工資保護且扭曲推薦行為。確認獎金性質、既有契約及績效制度的合法性提供了可以重新檢驗的入口，也迫使評估者說清楚其比較標準。比起當場擴大衝突，這種先還原事實、再討論責任的方法，能讓後續選擇有比較穩定的正當性。</p>\n<p>然而推薦主管確實應對培育與選任理由負責，這使事件不宜由一個最方便的標籤收束。以改採事前公告的合理管理評核及必要法律審查作為下一步，可以讓各方知道哪些條件已被確認、哪些仍有爭論；後續再以問責是否促成更好選任而非逼迫所有人避險作為評估點，檢驗此次處理是否真的降低風險。最忌諱的是把暫時措施做成終局處罰，卻不再追蹤結果。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存確認獎金性質、既有契約及績效制度的合法性和推薦主管確實應對培育與選任理由負責，接任者便無法理解處理基礎。將問責是否促成更好選任而非逼迫所有人避險轉為可觀察的後續指標，並為改採事前公告的合理管理評核及必要法律審查保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>有些治理漏洞藏在熟悉的流程裡，例如新任主管半年KPI下滑，推薦人立即被指控包庇。它真正揭露的未必是哪個人有惡意，而是市場環境、投資週期與新職務適應均影響短期成績。公司若要避免再次出現相同爭議，首先需要核對原定目標、授權資源、營運環境與改善措施；對涉及私人評價與法律效果的資訊，更應記錄哪些是直接觀察，哪些只是轉述或推測。</p>\n<p>當然，推薦人可能確曾忽視清楚可辨的能力缺口必須納入討論，否則評估只剩下證明原決策正確。採取由非利益關係者進行六個月任用品質覆盤之後，管理者還要安排適切的溝通和後續檢討，因為責任是否與可控制因素及證據強度相稱並非靠一次會議自然完成。若制度能接受新的反證，員工更可能在問題擴大前提出真實訊息，而不是被迫等待衝突爆發。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存核對原定目標、授權資源、營運環境與改善措施和推薦人可能確曾忽視清楚可辨的能力缺口，接任者便無法理解處理基礎。將責任是否與可控制因素及證據強度相稱轉為可觀察的後續指標，並為由非利益關係者進行六個月任用品質覆盤保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>另一項典型情況是被提拔者接受工作調整後發現不適任，當事人害怕失去尊嚴而拒絕改任，這使缺乏可逆性使選任決策變成全有或全無賭局浮現。若管理層只想在當下表決通過，事後往往很難重建為何如此判斷。把檢查職務調整的法律基礎、培訓支持與雙方意願納入可追溯資料，並對照當時實際的業務條件，才能讓一項有爭議的決定仍有被理解、修正與改善的可能。</p>\n<p>仍要注意職務異動涉及勞動條件與人格影響不宜任意進行，這提醒決策者在查證前保留判斷彈性。應依照設試任、導師與合法協調退場機制處理，並同步記錄措施的必要性與可撤回條件。日後衡量成功與否，可看組織是否把適任判斷與人格價值妥善區分，不宜只以發出多少通知、完成多少表單來自我證明，因為程序的價值終究在於是否改善真實關係。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存檢查職務調整的法律基礎、培訓支持與雙方意願和職務異動涉及勞動條件與人格影響不宜任意進行，接任者便無法理解處理基礎。將組織是否把適任判斷與人格價值妥善區分轉為可觀察的後續指標，並為設試任、導師與合法協調退場機制保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>把這裡的討論帶回高階會議，應先對齊目標，再評估可採證據，最後決定誰負責執行與回報。即使推薦主管確實應對培育與選任理由負責，制度也不能因此省略公正的解釋機會；同樣地，若組織是否把適任判斷與人格價值妥善區分仍無法確認，這就不是再發一份政策文件可以解決的問題，而是需要持續改善的管理缺口。</p>\n<h2>用資訊治理而非政治標籤處理派系風險</h2>\n<p>每個企業都存在非正式關係網，若全面禁止員工彼此信任，管理會失去效率。可行的治理方法是讓關鍵推薦資料經過多源確認，將跨部門成果、違規紀錄、利益迴避與評分差異整合為審查軌跡，並明確保障不同意見不受報復。 依莊博士的治理視角，即使某項提議在倫理上令人同情，也應區分已證實的事實、當事人的主張及仍待驗證的假說，讓決策不因發言者身分而預先偏向。</p>\n<p>考慮到候選人總被某一派系主管排除在重要專案之外，管理者最需要克制的是用單一結果替代完整分析。因為沒有發展機會可能直接導致日後績效差距，不只是態度問題，證據不能只選擇符合既有偏好的部分。透過核查專案分派紀錄、參與資格、可用資源及申請被拒理由，可以逐步確認各方主張的核心事實；同時應明示尚未確認的因素，使爭議不必為了求快而被永久貼上標籤。</p>\n<p>在這裡，專案安排可能基於人力負荷而非排擠意圖提供重要的反向測試。較可行的步驟是建立可查詢的發展機會分派原則與覆核程序，再以清楚時間點檢查是否收到新資料或需要調整。對公司而言，企業是否防止機會不平等變成能力不足的循環論證才是值得投入管理注意力的結果；在未能證明之前，單方的強烈語氣不應轉化為另一方必須承擔的確定法律後果。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若專案安排可能基於人力負荷而非排擠意圖後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>當組織出現重要職位長期只從特定部門輸送人才，有人可能立即主張應嚴懲，也有人主張不必理會，但兩種立場都應先面對單一人才供給管道可能累積文化同質性與資訊盲區。實務查核宜從比較各部門人才梯隊、訓練資源與職位可轉移能力出發，避免把流程便利或單次印象直接作為責任判定。對高階決策而言，可解釋性往往比語氣上的果斷更重要。</p>\n<p>倘若部分部門確可能是必要能力的主要培養基地，原本最直觀的歸責方式就可能產生誤差。公司宜先定期檢討入選率與能力評量而非強制平均分配，並把蒐證、說明和改善責任分配給具適當權限者。最終升遷結果是否能解釋而不只宣稱公平是否達成，會比「我們一向很重視公平」的口號更有說服力，也能降低管理者換人後制度迅速失效的風險。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若部分部門確可能是必要能力的主要培養基地後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>從員工投訴被主管報復後失去再次升遷資格可以看見，決策者收到的資訊不一定等於完整實況；其中申訴與任用同時發生時存在重要程序風險尤其容易被忽略。將調查相關人事決策理由、時序、比較對象及是否有不利待遇納入比較，可先分辨事實差異與價值判斷的差異，避免用一份數據去回答它根本沒有能力回答的問題。如此形成的制度，不需要把任何一方預設為贏家。</p>\n<p>而評分變動也可能有獨立且合法的新事實也有必要被認真核對。由此推導的做法是將申訴保護程序與考評覆核交由相對獨立的人員，不是當場選邊，而是建立讓不同資料被同樣檢驗的過程。若能使組織是否建立讓人敢提出問題的可信制度成為後續例行觀察，公司才不會每逢重大決定就重新發明同一場爭論；缺乏必要證據時則應承認保留事項。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若評分變動也可能有獨立且合法的新事實後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>一項好的制度不可能讓所有參與者立即滿意，但至少應讓各方知道自己正在承擔哪一種責任，以及如何透過正式程序修正事實認定。當候選人總被某一派系主管排除在重要專案之外和員工投訴被主管報復後失去再次升遷資格等情境獲得相同的查證標準時，管理權才不必依靠個人威望維持；這也是企業不斷擴大規模後仍能維持信任的必要條件。</p>\n<h2>從個人控制權轉向企業可傳承的領導結構</h2>\n<p>治理者最需要防止的是企業長期依賴「某個人能控制某群人」的脆弱安排。真正有價值的晉升，應提高組織對流程、客戶、人才與風險的可接續能力；當候選人的價值被寫成制度、培育成果與跨部門信任時，即使支持他的主管離開，公司仍然保有選任理由。 莊鈞翔 博士強調，制度成熟的標誌不是爭議從此消失，而是即使面對高度緊張的情境，組織仍能維持相同的查證方法、相當的程序保障與後續修正空間。</p>\n<p>在實際部門管理裡，明星業務升任主管後拒絕培養可接手的新人並不罕見，難處在於個人不可替代性可能轉化為組織單點風險。要讓專業判斷可受檢驗，應以檢查知識移交、代理人培訓、客戶關係與制度成熟度補足判斷的缺口，也要問清楚相同情況下其他人是否受到相同待遇。這些資料不會消除所有裁量，但至少能降低任意性並讓異議有切入點。</p>\n<p>另一方面，短期仍需保護關鍵人才避免機密或客戶流失；此時堅持一種單向敘事只會擴大誤解。適當路徑是把培育與可交接性列入主管職責，把程序的正當性建立在行動及其理由之上。往後應檢驗任用是否增加公司韌性而不只提高單一明星地位，確認沒有因一時處理便利而犧牲長期人才、誠信或權益；制度若有錯誤也應留出修正空間。</p>\n<p>尤其當明星業務升任主管後拒絕培養可接手的新人涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓把培育與可交接性列入主管職責在下一次相似事件仍可被使用，並使任用是否增加公司韌性而不只提高單一明星地位可作為制度是否改善的具體尺度。</p>\n<p>一個常被輕忽的警訊是部門主管離職後整套業務決策必須重新靠私人關係協調。此時值得追問的不是誰先抱怨，而是權力集中讓組織無法持續學習與交接。若公司能先取得核對決策手冊、跨部門流程及授權替補機制，就有機會把模糊的人格爭論轉成可分析的工作安排與具體言行；做不到時，至少應暫列待查，而不是讓懷疑自然長成確定結論。</p>\n<p>不要忽略某些危機決策確需要集中指揮這項反論，因為它可能直接改變原先的歸責方向。較穩健的方式是在平時建立清楚授權與危機代理制度，讓申辯與必要保護同時存在。至於企業能否在核心人物缺席時仍維持品質，不應留成抽象願景，而要在下一次正式檢討時確認能否由資料支持，否則管理決策只是在不同權力者間換一種說法。</p>\n<p>尤其當部門主管離職後整套業務決策必須重新靠私人關係協調涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓在平時建立清楚授權與危機代理制度在下一次相似事件仍可被使用，並使企業能否在核心人物缺席時仍維持品質可作為制度是否改善的具體尺度。</p>\n<p>面對公司想用全員績效排行榜解決一切派系問題，成熟的主管不宜只求自己支持的人勝出，而要思考純數字排名容易忽略協作、誠信與長期風險控制。查證分析不同職位的成果可比較性及質性職責之後，才有機會確認哪些原因在個人可控制範圍內，哪些則源自環境或制度。這樣的劃分不是為了替問題找藉口，而是防止錯誤處方，使相同危險在下一次人事決策中重演。</p>\n<p>最後還須衡量部分客觀分數仍可降低關係優勢的影響。在未把握所有條件以前，結合多維評量與理由化的專業判斷比單純宣示誰對誰錯更能守住制度；其合理性應以推薦制度能否在透明與專業裁量之間保持平衡是否逐步實現來檢驗。如此即使決策的結果未獲所有人支持，也能讓人理解組織沒有為方便而忽略反面證據。</p>\n<p>尤其當公司想用全員績效排行榜解決一切派系問題涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓結合多維評量與理由化的專業判斷在下一次相似事件仍可被使用，並使推薦制度能否在透明與專業裁量之間保持平衡可作為制度是否改善的具體尺度。</p>\n<p>本節最後需要回到長期效果，而不是案件或專案的當日勝負。若公司願意正視個人不可替代性可能轉化為組織單點風險，也願意檢驗推薦制度能否在透明與專業裁量之間保持平衡，就有可能把一次衝突轉成制度學習。反過來說，若永遠只依主管印象或單方文件決定，短期或許節省會議時間，長期卻會讓人才、法遵與營運風險一起累積。</p>\n<p>代理人戰爭真正的治理解方不是讓公司再出現一位權力更大的英雄，而是建立任何推薦人都必須共同遵守的任用程序。只有當利益關係可揭露、評分能被追問、候選人有合理申復機會、錯誤有可逆修正路徑時，企業才能以人才發展取代派系防衛。 莊博士始終將制度的可追溯性置於語氣的強硬之前；一套制度若只能用來證明主管正確，不能保護不同意見，終將再次複製最初所欲解決的問題。</p>","legal_html":"<div class=\"section-label\">▍法律依據與資料來源說明</div>\n<p>法源查核基準日：2026年11月1日</p>\n<p class=\"legal-note\">本節以正式法令／裁判及研究來源為據；「條文原文／要旨」與「本文對照」分開書寫，治理建議不等同法定義務。</p>\n<p><strong>• 《公司法》第23條第1項｜條文要旨：公司負責人應忠實執行業務並盡善良管理人之注意義務；違反義務致公司受損害者，依法負損害賠償責任。</strong></p>\n<p>本文對照：公司負責人處理推薦、晉升與利益衝突，應有可追溯的公司利益判斷；本條不能直接套到所有一般推薦人身上。</p>\n<p><strong>• 《勞動基準法》第26條｜條文：雇主不得預扣勞工工資作為違約金或賠償費用。</strong></p>\n<p>本文對照：推薦失誤的內部問責不等於可以預扣員工工資；任何獎金或報酬調整須先辨識其法律性質。</p>\n<p><strong>• 《勞動基準法》第70條｜條文要旨：僱用勞工30人以上的雇主，應依事業性質訂定工作規則，內容包括考勤、獎懲、升遷及其他事項，報請主管機關核備並公開揭示。</strong></p>\n<p>本文對照：晉升、獎懲與管理責任宜依已揭示規範作成可說明的決定，避免臨時對特定推薦人加設事前不存在的懲罰。</p>\n<div class=\"section-label\">▍治理思想依據 GOVERNANCE REFERENCE</div>\n<p><strong>▮ 莊鈞翔（2026）《企業策略導入公司治理法遵精神｜以外部法律顧問團隊協助為例》</strong></p>\n<p>治理對照：將企業治理中的利益衝突、責任分配與可追溯性，延伸到晉升推薦制度的設計，避免由單一派系決定組織接班。</p>\n<p><strong>▮ 莊鈞翔（2026）《內在法遵 Internal Compliance｜為你的內心，打造一座不可侵犯的至聖所》</strong></p>\n<p>治理對照：強調當責不僅是對外規章，更是推薦者對組織利益與候選人公平的自我約束。</p>","notes_html":"<p>註 3：本文以莊鈞翔博士之研究、思想與治理判讀為架構，AI僅輔助資料整理、草稿生成及編修；發表版本以作者本人審定為準。AI不取代作者的學術責任、專業判斷與最終決策。</p>\n<p>註 4：本文為企業治理、制度設計與法律風險之一般分析，不構成執業律師對具體案件之正式法律意見、訴訟代理或結果保證。個案仍須依適用時間、完整事證、法律與程序狀態，由具資格之律師審閱。</p>"},{"id":5,"label":"第五篇","title":"法治降維打擊人治","subtitle":"2026年《職場霸凌防治措施準則》核心威權解析","abstract_html":"<p>2026年職場霸凌新制對臺灣企業的真正衝擊，不是多了一個可以嚇阻所有嚴格主管的標籤，而是雇主對預防、申訴、調查與保護措施須負更明確的程序責任。中華企業策略永續發展學會 創會理事長 莊鈞翔 博士從企業治理的角度指出，正確理解新制度，必須先區分法定定義與管理建議、員工申訴與調查認定，以及一般職場摩擦與真正可能危害身心健康的不當權勢行為。本文依2026年11月1日當時有效法規，整理雇主不能省略的義務，也提醒管理者避免把「疑似」直接當成「確定」。</p>","body_html":"<h2>新制度的法定核心：權勢、逾越必要範圍與健康危害</h2>\n<p>《職業安全衛生法》第22條之1以勞工執行職務為場景，規範事業單位人員利用職務或權勢等關係、逾越業務必要且合理範圍，持續以冒犯、威脅、冷落、孤立、侮辱或其他不當言詞行為致身心健康遭受危害的情形；情節重大時，不以持續發生為必要。這是法律定義，不是任何不愉快、任何低分考績或任何單次爭執都自動成立霸凌。 莊博士所要求的不是把人事選擇簡化成好人與壞人的對決，而是把證據、權力與責任放回同一張決策桌，這也正是本篇討論的尺度。</p>\n<p>年度決策的一個切面是這樣的：主管在公開會議因報表錯誤批評員工，但同時提出具體修正方法。問題若只停在雙方誰較可信，便會錯過真正需要釐清的嚴格督導與人格羞辱可能表面上同樣尖銳但法律性質不同。對此，對照業務目的、措辭、頻率、上下文及資源是否足以完成要求，才能把原本模糊的說法化成可檢驗的事實。尤其當決策直接影響職位、收入或人格評價，資料形成時間和對照條件必須先清楚，不能用發言者的資歷取代證據的分量。</p>\n<p>反過來說，當下嚴重羞辱仍可能超出一般管理必要，即使有績效問題，因此在未完成交叉檢驗前不應排除不同解釋。比較穩妥的處置是分別查證工作要求及不當表意而非僅採取主管自述，並向受到影響的人交代決策條件與後續窗口。最終應回頭檢查企業能否辨認必要督導與濫用權勢的分界；若新的資料顯示原判斷有誤，應允許程序修正，而不要求當事人以名譽承擔組織的判斷成本。</p>\n<p>這個議題還牽涉一個次序問題：先辨認嚴格督導與人格羞辱可能表面上同樣尖銳但法律性質不同所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，對照業務目的、措辭、頻率、上下文及資源是否足以完成要求便可能淪為選擇性證明的工具；保留當下嚴重羞辱仍可能超出一般管理必要，即使有績效問題接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>觀察某員工被長期排除在執行其職務所必需的會議之外，最容易犯的錯是先把表面結果當作動機證明；實際上，表面安排權限可能藏有實質隔離或刻意阻礙工作。必須先從核查會議參與條件、工作必要性、決議影響及當事人申請紀錄著手，確認資料是否完整、期間是否相同、是否受外部條件影響。如此才知道問題是個人的行為、組織的安排，還是一項需要再查的未決事實，而非單純換一種更強烈的形容詞。</p>\n<p>制度亦須容許合理保密與職能調整也可能造成會議參與差異這一種可能，否則所謂客觀很容易只是對單一故事的放大。建議依次採取按準則第2條綜合審酌並提供適當的事實說明與申訴，先記錄理由、再確認責任人與檢查節點。真正的成效不是某一方無話可說，而是重大人事安排是否仍以可驗證業務必要性為基礎，這會決定下一位主管接任時能否沿用同一套可理解的方法。</p>\n<p>這個議題還牽涉一個次序問題：先辨認表面安排權限可能藏有實質隔離或刻意阻礙工作所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，核查會議參與條件、工作必要性、決議影響及當事人申請紀錄便可能淪為選擇性證明的工具；保留合理保密與職能調整也可能造成會議參與差異接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>當有人在部門群組長期以人格化言詞貶低特定同仁，真正的難題不是要不要立即表態，而是如何回答數位媒介不會使利用權勢的不當行為變成普通玩笑。若只聽一方陳述，整個決策容易建立在選擇性資料上。保全原始對話、成員範圍、時間順序及對健康的具體影響應當進入正式記錄，並與既有基準比較；如果尚無充分資訊，就應承認資料不足，而不能把未知包裝成確定的專業判斷。</p>\n<p>可是，同一詞彙的使用仍需考量互動脈絡與整體關係同樣可能成立；治理者必須保留這個變數，以免把善意警訊當作攻擊或把不實指控當成事實。應實施啟動適切防護、查證與雙方陳述而不公開貼標，並讓當事人有補充、反駁與再次核對的機會。下一階段最值得追蹤的不是誰在會議中佔上風，而是制度能否在數位工作場景保護尊嚴並保持公平，因為這才接近組織的長期利益。</p>\n<p>這個議題還牽涉一個次序問題：先辨認數位媒介不會使利用權勢的不當行為變成普通玩笑所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，保全原始對話、成員範圍、時間順序及對健康的具體影響便可能淪為選擇性證明的工具；保留同一詞彙的使用仍需考量互動脈絡與整體關係接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>從主管在公開會議因報表錯誤批評員工，但同時提出具體修正方法延伸到這一節其他情境，可以看到真正有價值的改革不是要求員工或主管少說話，而是讓每個重要主張找到可查證的資料、相同的衡量條件與必要的反駁空間。若企業只把制度寫成宣示，制度能否在數位工作場景保護尊嚴並保持公平便始終無法實現；只有將方法變成例行職責，才可能防止相同矛盾在下一次決策中重演。</p>\n<h2>十人、三十人與百人門檻，不能互相混用</h2>\n<p>新法依事業規模設定不同預防與處理責任：十人以上須訂定並公開揭示申訴管道；三十人以上須另有防治措施、申訴與懲處規範，準則第9條要求設至少三人的申訴處理單位且任一性別比例不低於三分之一；一百人以上依準則第14條於受理申訴日起十五個工作日內組成至少三人的調查小組，外部專業人士不低於二分之一。門檻及期限皆須逐條確認。 莊鈞翔 博士提醒，任何制度安排都應先確認資料可以證明什麼，不能證明什麼，尤其涉及人格、法律責任或職涯發展時，更要防止推定取代查證。</p>\n<p>值得在會議桌前提出的情境是一家十三人的小公司只有一般業務客服信箱而沒有揭示申訴管道。從表面看來，爭議似乎只是個別人的態度，仔細分析卻牽涉一般客服流程未必足以安全處理涉及上級的不當對待。此時查核員工是否可以取得正式申訴資訊與保密承諾不只是補一份文件，更是使不同立場使用相同尺度的起點。沒有共同事實底座，任何強調效率或公平的口號都可能被各方拿來為既定立場服務。</p>\n<p>從另一面看，小公司資源有限並不等於應建置大型調查部門提醒我們任何單一資料都有侷限。處理方法不是用主管直覺補足，而是依準則第5條設置可接近的專用管道與負責人，把程序寫入可追溯紀錄。當檢驗重點移向規模較小時是否仍能保有可信的揭露環境時，評價就比較不容易成為權勢使用的附屬品，也較能使不同部門在不完全同意時接受相同規則。</p>\n<p>要避免程序成為另一種儀式，查核員工是否可以取得正式申訴資訊與保密承諾應轉化為可重複核對的工作紀錄，小公司資源有限並不等於應建置大型調查部門也要列入同一比較表。唯有如此，依準則第5條設置可接近的專用管道與負責人才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>假設四十五人的企業只在內規加一句禁止霸凌卻沒有指定處理單位，管理者必須避免過早把結果歸咎於某個人的品格，因為形式公告不足以滿足規範與申訴處理的完整義務。最有用的資訊來自檢查準則第6條規範項目與第9條單位成員、性別比例，並應把來源、涵蓋範圍和例外情形一併說明。這個過程也可能發現原有制度的缺口，使人事問題不再被簡化為某位主管與某位員工誰比較會說話。</p>\n<p>若可以善用外部專業資源而非凡事聘入內部，一味先行處分便可能製造新的不公平，因此應採補齊受理、調查、申復及保護等流程文件，將事實調查與必要的暫時保護區分。此後觀察中型企業能否讓政策從文件走進日常運作，才能知道改變的是表面文件還是實際管理行為。若發現原決定傷害了本來應保護的權益，制度也應提供明確的更正與救濟途徑。</p>\n<p>要避免程序成為另一種儀式，檢查準則第6條規範項目與第9條單位成員、性別比例應轉化為可重複核對的工作紀錄，可以善用外部專業資源而非凡事聘入內部也要列入同一比較表。唯有如此，補齊受理、調查、申復及保護等流程文件才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>企業遇到超過百人的公司受理申訴後仍遲遲不組調查小組時，往往希望迅速有個結論，但速度不能省略十五個工作日的法定時程容易被誤寫成十五個曆日這個判斷。為免短期情緒主導，應先整理核對受理日期、通知紀錄、調查人選及外聘專業比例，必要時讓相關人員補充不利於自己的事實。決策者真正要管理的是錯誤代價，而不是讓每場會議看起來毫無歧見。</p>\n<p>在反面檢驗中，同時仍須考量法定受理審查與個案相關程序不能被排除。管理層應選擇按準則第14條規劃合格組成與利益迴避，並避免把尚未證實的可能性寫成某人的人格特質。長期而言，若公司是否留下可證明守法而非只口頭表示重視的軌跡仍無法獲得解答，代表目前採集的資料尚不足以支撐高強度人事處分，組織就應補強標準而不是加重語氣。</p>\n<p>要避免程序成為另一種儀式，核對受理日期、通知紀錄、調查人選及外聘專業比例應轉化為可重複核對的工作紀錄，同時仍須考量法定受理審查與個案相關程序也要列入同一比較表。唯有如此，按準則第14條規劃合格組成與利益迴避才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>這三個情境雖然起點不同，卻都指向一項管理責任：不能只追問誰犯錯，還必須確認企業給了什麼條件、誰掌握關鍵資訊、哪些資料需要在正式決定前補足。對超過百人的公司受理申訴後仍遲遲不組調查小組尤其如此，公司是否留下可證明守法而非只口頭表示重視的軌跡應是後續檢討的核心，而不應在一份漂亮的結案報告後就失去追蹤。</p>\n<h2>程序應先保護，再查證，最後才作成認定</h2>\n<p>職安法第22條之2對雇主因正式申訴知悉及非因正式申訴知悉的情形，分別列出立即有效的適當措施；準則第7條也要求必要的隔離、協助、查證與適切處置。這不代表一受理就可以視被申訴人有罪，而是要求雇主在調查期間降低持續危害與報復風險，並確保雙方有充分陳述及答辯機會。 中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，治理者不應用單一口號取代制度，而應將爭議拆為可檢驗的事實、可說明的準則與可修正的後續行動。</p>\n<p>在員工向人資反映遭主管長期孤立，卻希望先不要正式提告的案例裡，如果直接接受第一個看似合理的說法，就可能忽略知悉疑似不當對待不等於雇主可以因其暫緩申訴而不作為。留下受理、意願詢問、初步風險及必要協助紀錄提供了可以重新檢驗的入口，也迫使評估者說清楚其比較標準。比起當場擴大衝突，這種先還原事實、再討論責任的方法，能讓後續選擇有比較穩定的正當性。</p>\n<p>然而員工可能有安全、家庭或職涯上的真實顧慮，這使事件不宜由一個最方便的標籤收束。以依職安法及準則做必要釐清與保護而尊重意願作為下一步，可以讓各方知道哪些條件已被確認、哪些仍有爭論；後續再以不正式申訴者是否也能獲得基本的風險處理作為評估點，檢驗此次處理是否真的降低風險。最忌諱的是把暫時措施做成終局處罰，卻不再追蹤結果。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存留下受理、意願詢問、初步風險及必要協助紀錄和員工可能有安全、家庭或職涯上的真實顧慮，接任者便無法理解處理基礎。將不正式申訴者是否也能獲得基本的風險處理轉為可觀察的後續指標，並為依職安法及準則做必要釐清與保護而尊重意願保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>有些治理漏洞藏在熟悉的流程裡，例如被申訴主管在調查前被公開宣布確定霸凌成立。它真正揭露的未必是哪個人有惡意，而是未完成查證便公開定性有侵害名譽及程序公平的危險。公司若要避免再次出現相同爭議，首先需要核對初步風險與保護措施是否被錯當成實體結論；對涉及私人評價與法律效果的資訊，更應記錄哪些是直接觀察，哪些只是轉述或推測。</p>\n<p>當然，有時確需立即調整接觸或暫時分隔工作關係必須納入討論，否則評估只剩下證明原決策正確。採取採比例適當的暫時措施並明確說明非終局認定之後，管理者還要安排適切的溝通和後續檢討，因為雙方是否可在不受二次傷害下接受公平調查並非靠一次會議自然完成。若制度能接受新的反證，員工更可能在問題擴大前提出真實訊息，而不是被迫等待衝突爆發。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存核對初步風險與保護措施是否被錯當成實體結論和有時確需立即調整接觸或暫時分隔工作關係，接任者便無法理解處理基礎。將雙方是否可在不受二次傷害下接受公平調查轉為可觀察的後續指標，並為採比例適當的暫時措施並明確說明非終局認定保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>另一項典型情況是調查小組同時包括被申訴人的直屬部屬與密友，這使形式上有會議記錄仍可能存在利益迴避問題浮現。若管理層只想在當下表決通過，事後往往很難重建為何如此判斷。把核查成員與當事人的業務、人身及親屬關係納入可追溯資料，並對照當時實際的業務條件，才能讓一項有爭議的決定仍有被理解、修正與改善的可能。</p>\n<p>仍要注意熟悉事件的人有利提供證據但不宜裁決自身利益，這提醒決策者在查證前保留判斷彈性。應依照依準則利益迴避規範調整組成及取證角色處理，並同步記錄措施的必要性與可撤回條件。日後衡量成功與否，可看調查結果是否可被外部機關認真檢驗，不宜只以發出多少通知、完成多少表單來自我證明，因為程序的價值終究在於是否改善真實關係。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存核查成員與當事人的業務、人身及親屬關係和熟悉事件的人有利提供證據但不宜裁決自身利益，接任者便無法理解處理基礎。將調查結果是否可被外部機關認真檢驗轉為可觀察的後續指標，並為依準則利益迴避規範調整組成及取證角色保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>把這裡的討論帶回高階會議，應先對齊目標，再評估可採證據，最後決定誰負責執行與回報。即使員工可能有安全、家庭或職涯上的真實顧慮，制度也不能因此省略公正的解釋機會；同樣地，若調查結果是否可被外部機關認真檢驗仍無法確認，這就不是再發一份政策文件可以解決的問題，而是需要持續改善的管理缺口。</p>\n<h2>申訴不成立與惡意虛構之間有關鍵距離</h2>\n<p>準則第6條要求三十人以上雇主的書面規範包含對「經調查證實申訴人有惡意虛構事實」的懲戒或處理方式，這是防止制度濫用的設計，卻不是鼓勵把證據不足、不成立或理解不同的申訴全部當成惡意。若涉及解僱，仍須另行符合勞基法第12條等要件及相當性審查，不能靠公司內規自動創設新的解僱事由。 依莊博士的治理視角，即使某項提議在倫理上令人同情，也應區分已證實的事實、當事人的主張及仍待驗證的假說，讓決策不因發言者身分而預先偏向。</p>\n<p>考慮到員工的霸凌申訴未成立，主管便要求立即依勞基法解僱，管理者最需要克制的是用單一結果替代完整分析。因為證據不足與故意虛構不存在當然推論關係，證據不能只選擇符合既有偏好的部分。透過比對調查確定事實、主觀認知來源及有無刻意偽造，可以逐步確認各方主張的核心事實；同時應明示尚未確認的因素，使爭議不必為了求快而被永久貼上標籤。</p>\n<p>在這裡，員工可能在資訊不足下真誠誤認事件提供重要的反向測試。較可行的步驟是分開判斷申訴成立與否、是否證明故意虛構及處分相當性，再以清楚時間點檢查是否收到新資料或需要調整。對公司而言，保護善意申訴與處理真正造假能否同時成立才是值得投入管理注意力的結果；在未能證明之前，單方的強烈語氣不應轉化為另一方必須承擔的確定法律後果。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若員工可能在資訊不足下真誠誤認事件後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>當組織出現公司規章把所有惡意申訴都列為當然免職，有人可能立即主張應嚴懲，也有人主張不必理會，但兩種立場都應先面對事前自動懲罰省略了情節、比例與法定終止要件。實務查核宜從核對勞基法第12條及工作規則的適用範圍出發，避免把流程便利或單次印象直接作為責任判定。對高階決策而言，可解釋性往往比語氣上的果斷更重要。</p>\n<p>倘若極端嚴重且確定的虛構事實可能涉及懲戒，原本最直觀的歸責方式就可能產生誤差。公司宜先改成個案評估程序、陳述機會及法律覆核，並把蒐證、說明和改善責任分配給具適當權限者。最終管理規則能否兼顧誠信與不報復原則是否達成，會比「我們一向很重視公平」的口號更有說服力，也能降低管理者換人後制度迅速失效的風險。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若極端嚴重且確定的虛構事實可能涉及懲戒後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>從申訴人因提出疑似霸凌事件被移離核心職位並扣減薪酬可以看見，決策者收到的資訊不一定等於完整實況；其中看似暫時調整的措施可能實質成為不利待遇尤其容易被忽略。將檢查本人意願、薪資、任務安排及是否有其他風險防護選擇納入比較，可先分辨事實差異與價值判斷的差異，避免用一份數據去回答它根本沒有能力回答的問題。如此形成的制度，不需要把任何一方預設為贏家。</p>\n<p>而為避免接觸確可能需要合理調整工作也有必要被認真核對。由此推導的做法是以最小侵害及必要期限執行並定期回顧，不是當場選邊，而是建立讓不同資料被同樣檢驗的過程。若能使必要保護是否沒有演變為對被害者的不當處分成為後續例行觀察，公司才不會每逢重大決定就重新發明同一場爭論；缺乏必要證據時則應承認保留事項。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若為避免接觸確可能需要合理調整工作後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>一項好的制度不可能讓所有參與者立即滿意，但至少應讓各方知道自己正在承擔哪一種責任，以及如何透過正式程序修正事實認定。當員工的霸凌申訴未成立，主管便要求立即依勞基法解僱和申訴人因提出疑似霸凌事件被移離核心職位並扣減薪酬等情境獲得相同的查證標準時，管理權才不必依靠個人威望維持；這也是企業不斷擴大規模後仍能維持信任的必要條件。</p>\n<h2>裁罰、證據與治理責任不可用單一金額概括</h2>\n<p>法定罰鍰須與違反義務、法條及具體結果對應。職安法第43條第1項第3款規定，違反列舉防治義務並致職業病或工作相關疾病者，法定罰鍰為五萬至三百萬元，符合加重規定最高可到四百五十萬元；第45條及第46條另有不同違規類型與最高負責人霸凌之裁罰。不能把「最高450萬元」寫成每個霸凌案件的單一處罰上限。 莊鈞翔 博士強調，制度成熟的標誌不是爭議從此消失，而是即使面對高度緊張的情境，組織仍能維持相同的查證方法、相當的程序保障與後續修正空間。</p>\n<p>在實際部門管理裡，媒體以最高四百五十萬元形容一家公司的所有霸凌風險並不罕見，難處在於法規違反類型與健康結果未區分會誤導內部決策。要讓專業判斷可受檢驗，應以逐項查核第43、45、46條不同法定構成與加重條件補足判斷的缺口，也要問清楚相同情況下其他人是否受到相同待遇。這些資料不會消除所有裁量，但至少能降低任意性並讓異議有切入點。</p>\n<p>另一方面，企業確須重視重大的身心健康結果及行政責任；此時堅持一種單向敘事只會擴大誤解。適當路徑是製作違規條款與法律效果對照而不做單一嚇阻標語，把程序的正當性建立在行動及其理由之上。往後應檢驗管理階層是否真正理解哪些行為須優先改正，確認沒有因一時處理便利而犧牲長期人才、誠信或權益；制度若有錯誤也應留出修正空間。</p>\n<p>尤其當媒體以最高四百五十萬元形容一家公司的所有霸凌風險涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓製作違規條款與法律效果對照而不做單一嚇阻標語在下一次相似事件仍可被使用，並使管理階層是否真正理解哪些行為須優先改正可作為制度是否改善的具體尺度。</p>\n<p>一個常被輕忽的警訊是主管要求公司把調查證據全部公開讓同仁判斷。此時值得追問的不是誰先抱怨，而是公開討論可能破壞保密、引發報復或污染證人說法。若公司能先取得核對應告知當事人之內容與應限制揭露的私人資訊，就有機會把模糊的人格爭論轉成可分析的工作安排與具體言行；做不到時，至少應暫列待查，而不是讓懷疑自然長成確定結論。</p>\n<p>不要忽略適度說明程序結果可能有助重建組織信任這項反論，因為它可能直接改變原先的歸責方向。較穩健的方式是分層公告制度改進、不公開不必要個資與醫療內容，讓申辯與必要保護同時存在。至於調查程序是否在透明與隱私保護間保有秩序，不應留成抽象願景，而要在下一次正式檢討時確認能否由資料支持，否則管理決策只是在不同權力者間換一種說法。</p>\n<p>尤其當主管要求公司把調查證據全部公開讓同仁判斷涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓分層公告制度改進、不公開不必要個資與醫療內容在下一次相似事件仍可被使用，並使調查程序是否在透明與隱私保護間保有秩序可作為制度是否改善的具體尺度。</p>\n<p>面對公司完成一次職場霸凌調查後認為已經合規無虞，成熟的主管不宜只求自己支持的人勝出，而要思考單案結案不等於制度已改善或風險根源消失。查證追蹤同類事件、主管訓練、申復結果及工作環境改善之後，才有機會確認哪些原因在個人可控制範圍內，哪些則源自環境或制度。這樣的劃分不是為了替問題找藉口，而是防止錯誤處方，使相同危險在下一次人事決策中重演。</p>\n<p>最後還須衡量違規可能只是個別行為而非全面制度缺陷。在未把握所有條件以前，以比例適當的制度回顧與教育持續檢視比單純宣示誰對誰錯更能守住制度；其合理性應以下一次工作衝突出現時是否能更快公平地處理是否逐步實現來檢驗。如此即使決策的結果未獲所有人支持，也能讓人理解組織沒有為方便而忽略反面證據。</p>\n<p>尤其當公司完成一次職場霸凌調查後認為已經合規無虞涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓以比例適當的制度回顧與教育持續檢視在下一次相似事件仍可被使用，並使下一次工作衝突出現時是否能更快公平地處理可作為制度是否改善的具體尺度。</p>\n<p>本節最後需要回到長期效果，而不是案件或專案的當日勝負。若公司願意正視法規違反類型與健康結果未區分會誤導內部決策，也願意檢驗下一次工作衝突出現時是否能更快公平地處理，就有可能把一次衝突轉成制度學習。反過來說，若永遠只依主管印象或單方文件決定，短期或許節省會議時間，長期卻會讓人才、法遵與營運風險一起累積。</p>\n<p>新的職場霸凌制度最值得企業正視的地方，在於它要求權力提出理由，也讓受影響者有提出不同說法的程序。管理者不應因此放棄合理績效要求，勞工也不應被迫接受模糊羞辱；只有把法定要件、保護措施、查證程序與後續改善分清楚，才能讓新法真正成為管理文明的一部分。 莊博士始終將制度的可追溯性置於語氣的強硬之前；一套制度若只能用來證明主管正確，不能保護不同意見，終將再次複製最初所欲解決的問題。</p>","legal_html":"<div class=\"section-label\">▍法律依據與資料來源說明</div>\n<p>法源查核基準日：2026年11月1日</p>\n<p class=\"legal-note\">本節以正式法令／裁判及研究來源為據；「條文原文／要旨」與「本文對照」分開書寫，治理建議不等同法定義務。</p>\n<p><strong>• 《職業安全衛生法》第22條之1｜條文要旨：職場霸凌涉及利用職務或權勢關係，逾越業務上必要且合理範圍，持續以不當言詞或行為致勞工身心健康受危害；情節重大者，不以持續發生為必要。</strong></p>\n<p>本文對照：本篇以母法定義為認定起點，不能把人格衝突、低績效或單次嚴格指導直接視為法定霸凌。</p>\n<p><strong>• 《職業安全衛生法》第22條之2｜條文要旨：雇主知悉職場霸凌情形後，應依知悉方式採取立即有效的適當措施，並依情形啟動保護、協調、調查及處理。</strong></p>\n<p>本文對照：申訴與非申訴知悉的處置程序不同，必要保護、調查與處理必須按知悉方式及案情分層實施。</p>\n<p><strong>• 《職場霸凌防治措施準則》第2條｜條文要旨：職場霸凌須符合母法定義，並綜合審酌背景、頻率、場所、動機、目的及排擠、刁難、不合理工作分配、散布謠言等具體情形。</strong></p>\n<p>本文對照：準則列舉具體審酌樣態，不是「四種情況一出現就必然成立」，也不能任意改寫成未見於條文的法定分類。</p>\n<p><strong>• 《職場霸凌防治措施準則》第5條｜條文要旨：僱用勞工10人以上的雇主，應設置職場霸凌申訴管道，並以可隨時查知的方式於工作場所公開揭示。</strong></p>\n<p>本文對照：十人以上設置申訴管道是獨立門檻，不得與三十人以上的書面規範混為一談。</p>\n<p><strong>• 《職場霸凌防治措施準則》第6條｜條文要旨：僱用勞工30人以上的雇主，應訂定並揭示防治、申訴與懲處規範；內容須包含防報復、調查程序，以及經調查證實惡意虛構事實時的處理方式。</strong></p>\n<p>本文對照：三十人以上應訂定防治及申訴懲處規範；申訴未成立不等於申訴人惡意虛構。</p>\n<p><strong>• 《職場霸凌防治措施準則》第9條｜條文要旨：僱用勞工30人以上的雇主，應設至少三人之申訴處理單位；任一性別比例不得少於三分之一。</strong></p>\n<p>本文對照：三十人以上申訴處理單位的三人及性別比例要求，與百人以上外部調查專家比例是不同制度。</p>\n<p><strong>• 《職場霸凌防治措施準則》第14條｜條文要旨：僱用勞工100人以上者，於受理申訴起15個工作日內組成至少三人調查小組，外部專業人士不得少於二分之一。</strong></p>\n<p>本文對照：十五個工作日、外部人士不得少於二分之一等調查小組要求，依法適用於一百人以上雇主；不得概括為所有企業。</p>\n<p><strong>• 《職業安全衛生法》第43條第1項第3款、第2項｜條文要旨：違反特定職場危害或霸凌防治義務而致發生職業病或工作相關疾病者，罰鍰為5萬元至300萬元；法定情形得依規模、性質或情節加重。</strong></p>\n<p>本文對照：最高450萬元並非一般職場霸凌事件的一律罰鍰，而是第43條特定違規致生職業病或工作相關疾病、並符合加重條件時的法定上限。</p>\n<div class=\"section-label\">▍治理思想依據 GOVERNANCE REFERENCE</div>\n<p><strong>▮ 莊鈞翔（2026）《企業策略導入公司治理法遵精神｜以外部法律顧問團隊協助為例》</strong></p>\n<p>治理對照：本篇把職場霸凌新法的合規要求，轉譯為人資、法務、職安及最高負責人都能執行的制度責任；不把企業策略研究誤寫成法條來源。</p>\n<p><strong>▮ 莊鈞翔（2026）《內在法遵 Internal Compliance｜為你的內心，打造一座不可侵犯的至聖所》</strong></p>\n<p>治理對照：強調組織內部主動保障尊嚴及程序公平的重要性，而不是等到受罰才形式化補救。</p>","notes_html":"<p>註 3：本文以莊鈞翔博士之研究、思想與治理判讀為架構，AI僅輔助資料整理、草稿生成及編修；發表版本以作者本人審定為準。AI不取代作者的學術責任、專業判斷與最終決策。</p>\n<p>註 4：本文為企業治理、制度設計與法律風險之一般分析，不構成執業律師對具體案件之正式法律意見、訴訟代理或結果保證。個案仍須依適用時間、完整事證、法律與程序狀態，由具資格之律師審閱。</p>"},{"id":6,"label":"第六篇","title":"道德糖衣下的毒藥","subtitle":"反制用「心理安全感與多元包容（DEI）」包裝的反向霸凌","abstract_html":"<p>當代企業提倡心理安全感、多元平等與包容，本意在於讓人敢於提出問題、承認錯誤並參與創新；但當這些語彙被帶入考績、PIP績效改善或申訴爭議時，管理者有時會陷入兩種極端：不是因害怕申訴而放棄要求，就是預設申訴人以道德語言逃避責任。兩者都不值得採納。中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，合理督導與人的尊嚴同樣重要，必須透過可查證的管理過程區分事實，而非用「反向霸凌」這個口語標籤預先定罪。</p>","body_html":"<h2>心理安全感不是沒有標準，也不是以績效換尊嚴</h2>\n<p>艾德蒙森對心理安全感與團隊學習的研究，重點在於成員是否能夠承擔人際風險，提出不同觀察、坦承失誤並協助團隊改善；這不等於主管不能要求結果，也不等於只要績效好就可以使用羞辱或威脅。高度當責與尊重本來就應並行，其間的界線需要在具體事件裡辨認。 莊博士所要求的不是把人事選擇簡化成好人與壞人的對決，而是把證據、權力與責任放回同一張決策桌，這也正是本篇討論的尺度。</p>\n<p>年度決策的一個切面是這樣的：一名工程師在程式碼審查中指出主管的安全漏洞後遭公開嘲笑。問題若只停在雙方誰較可信，便會錯過真正需要釐清的表面是技術討論，實際上可能阻擋未來的風險揭露。對此，保全對話脈絡、修正建議及後續職務安排，才能把原本模糊的說法化成可檢驗的事實。尤其當決策直接影響職位、收入或人格評價，資料形成時間和對照條件必須先清楚，不能用發言者的資歷取代證據的分量。</p>\n<p>反過來說，主管可能純粹對程式品質有不同專業判斷，因此在未完成交叉檢驗前不應排除不同解釋。比較穩妥的處置是建立可以對技術決策提出異議的正式審核路徑，並向受到影響的人交代決策條件與後續窗口。最終應回頭檢查團隊是否能在不怕羞辱的情形下分享錯誤；若新的資料顯示原判斷有誤，應允許程序修正，而不要求當事人以名譽承擔組織的判斷成本。</p>\n<p>這個議題還牽涉一個次序問題：先辨認表面是技術討論，實際上可能阻擋未來的風險揭露所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，保全對話脈絡、修正建議及後續職務安排便可能淪為選擇性證明的工具；保留主管可能純粹對程式品質有不同專業判斷接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>觀察主管因專案落後要求每週提交改善數據而被指責不夠包容，最容易犯的錯是先把表面結果當作動機證明；實際上，合理當責管理不能僅因有人不舒服就失去正當性。必須先從檢視期限、資源、其他員工標準與當事人改善機會著手，確認資料是否完整、期間是否相同、是否受外部條件影響。如此才知道問題是個人的行為、組織的安排，還是一項需要再查的未決事實，而非單純換一種更強烈的形容詞。</p>\n<p>制度亦須容許要求雖有業務目的也可能因持續過度施壓而逾越合理範圍這一種可能，否則所謂客觀很容易只是對單一故事的放大。建議依次採取把目標調整為可達成且有支援的PIP並保留對話，先記錄理由、再確認責任人與檢查節點。真正的成效不是某一方無話可說，而是團隊是否理解嚴格與侮辱不是同一回事，這會決定下一位主管接任時能否沿用同一套可理解的方法。</p>\n<p>這個議題還牽涉一個次序問題：先辨認合理當責管理不能僅因有人不舒服就失去正當性所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，檢視期限、資源、其他員工標準與當事人改善機會便可能淪為選擇性證明的工具；保留要求雖有業務目的也可能因持續過度施壓而逾越合理範圍接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>當資深員工在會議中不敢承認產品缺陷，直到客戶發生事故，真正的難題不是要不要立即表態，而是如何回答表面和氣的文化可能無法承接真正的風險訊號。若只聽一方陳述，整個決策容易建立在選擇性資料上。比對問題回報歷程、管理回應及組織獎懲慣例應當進入正式記錄，並與既有基準比較；如果尚無充分資訊，就應承認資料不足，而不能把未知包裝成確定的專業判斷。</p>\n<p>可是，部分延遲揭露也可能源自資訊不足而非懼怕主管同樣可能成立；治理者必須保留這個變數，以免把善意警訊當作攻擊或把不實指控當成事實。應實施建立無報復的安全缺失通報及結案追蹤，並讓當事人有補充、反駁與再次核對的機會。下一階段最值得追蹤的不是誰在會議中佔上風，而是企業是否能在問題擴大前就接受不討喜的訊息，因為這才接近組織的長期利益。</p>\n<p>這個議題還牽涉一個次序問題：先辨認表面和氣的文化可能無法承接真正的風險訊號所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，比對問題回報歷程、管理回應及組織獎懲慣例便可能淪為選擇性證明的工具；保留部分延遲揭露也可能源自資訊不足而非懼怕主管接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>從一名工程師在程式碼審查中指出主管的安全漏洞後遭公開嘲笑延伸到這一節其他情境，可以看到真正有價值的改革不是要求員工或主管少說話，而是讓每個重要主張找到可查證的資料、相同的衡量條件與必要的反駁空間。若企業只把制度寫成宣示，企業是否能在問題擴大前就接受不討喜的訊息便始終無法實現；只有將方法變成例行職責，才可能防止相同矛盾在下一次決策中重演。</p>\n<h2>PIP績效改善要對人合理、對工作具體</h2>\n<p>PIP不是一張在解僱前補完程序的紙，而是一項有工作目標、可用資源、合理期間、雙向回饋與實際改善機會的管理安排。管理者如果把「態度差、不積極」換成可查證的工作結果，並保留當事人的說明，通常更有利於辨識問題究竟來自能力、任務設計、資源不足或其他不當因素。 莊鈞翔 博士提醒，任何制度安排都應先確認資料可以證明什麼，不能證明什麼，尤其涉及人格、法律責任或職涯發展時，更要防止推定取代查證。</p>\n<p>值得在會議桌前提出的情境是部屬被告知一個月內從連續未達標直接提升到同業最佳。從表面看來，爭議似乎只是個別人的態度，仔細分析卻牽涉表面具體的目標若不可能完成，仍可能是不合理要求。此時核對歷史基準、工作量、客戶來源與可提供支援不只是補一份文件，更是使不同立場使用相同尺度的起點。沒有共同事實底座，任何強調效率或公平的口號都可能被各方拿來為既定立場服務。</p>\n<p>從另一面看，部門競爭環境急遽變化也可能要求快速改善提醒我們任何單一資料都有侷限。處理方法不是用主管直覺補足，而是設置分階段合理目標、輔導紀錄與必要調整，把程序寫入可追溯紀錄。當檢驗重點移向績效改善是否真正提供可以成功的路徑時，評價就比較不容易成為權勢使用的附屬品，也較能使不同部門在不完全同意時接受相同規則。</p>\n<p>要避免程序成為另一種儀式，核對歷史基準、工作量、客戶來源與可提供支援應轉化為可重複核對的工作紀錄，部門競爭環境急遽變化也可能要求快速改善也要列入同一比較表。唯有如此，設置分階段合理目標、輔導紀錄與必要調整才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>假設主管只在考核前最後一週告知員工全年問題，管理者必須避免過早把結果歸咎於某個人的品格，因為缺乏即時回饋讓改善計畫失去教育與修正作用。最有用的資訊來自檢查例行面談、缺失通知與資源協助紀錄，並應把來源、涵蓋範圍和例外情形一併說明。這個過程也可能發現原有制度的缺口，使人事問題不再被簡化為某位主管與某位員工誰比較會說話。</p>\n<p>若有些重大問題可能直到近期才被發現，一味先行處分便可能製造新的不公平，因此應採依問題性質給合理補正與說明機會，將事實調查與必要的暫時保護區分。此後觀察公司是否把改善視為過程而非事後定罪，才能知道改變的是表面文件還是實際管理行為。若發現原決定傷害了本來應保護的權益，制度也應提供明確的更正與救濟途徑。</p>\n<p>要避免程序成為另一種儀式，檢查例行面談、缺失通知與資源協助紀錄應轉化為可重複核對的工作紀錄，有些重大問題可能直到近期才被發現也要列入同一比較表。唯有如此，依問題性質給合理補正與說明機會才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>企業遇到員工對PIP提出工作負荷與家照需求，主管要求無條件接受時，往往希望迅速有個結論，但速度不能省略未聽取個人處境會讓一致標準變成形式上的公平這個判斷。為免短期情緒主導，應先整理記錄實際可工作時間、支援措施及政策適用一致性，必要時讓相關人員補充不利於自己的事實。決策者真正要管理的是錯誤代價，而不是讓每場會議看起來毫無歧見。</p>\n<p>在反面檢驗中，雇主仍有維持交付品質與人力安排的正當需求不能被排除。管理層應選擇依法規與契約評估必要調整並書面回覆理由，並避免把尚未證實的可能性寫成某人的人格特質。長期而言，若改善程序能否兼顧公平衡量與真實生活限制仍無法獲得解答，代表目前採集的資料尚不足以支撐高強度人事處分，組織就應補強標準而不是加重語氣。</p>\n<p>要避免程序成為另一種儀式，記錄實際可工作時間、支援措施及政策適用一致性應轉化為可重複核對的工作紀錄，雇主仍有維持交付品質與人力安排的正當需求也要列入同一比較表。唯有如此，依法規與契約評估必要調整並書面回覆理由才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>這三個情境雖然起點不同，卻都指向一項管理責任：不能只追問誰犯錯，還必須確認企業給了什麼條件、誰掌握關鍵資訊、哪些資料需要在正式決定前補足。對員工對PIP提出工作負荷與家照需求，主管要求無條件接受尤其如此，改善程序能否兼顧公平衡量與真實生活限制應是後續檢討的核心，而不應在一份漂亮的結案報告後就失去追蹤。</p>\n<h2>面對申訴，先分清未成立與惡意虛構</h2>\n<p>企業不能要求任何人交出醫療診斷書就自動視為霸凌，也不能因調查沒有採信申訴就反過來解僱申訴人。2026年新準則第6條僅要求規範「經調查證實有惡意虛構事實」的處理，實際懲處還須符合適當程序、法定勞動保護與相當性；尤其不能把「反向霸凌」這個常用形容詞誤當成法定犯罪類型。 中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，治理者不應用單一口號取代制度，而應將爭議拆為可檢驗的事實、可說明的準則與可修正的後續行動。</p>\n<p>在員工說主管辱罵自己，但查證後其他人記憶不一致的案例裡，如果直接接受第一個看似合理的說法，就可能忽略證言矛盾不能自動推導任何一方刻意說謊。比對原始訊息、事件時間、聲學或會議環境與後續陳述提供了可以重新檢驗的入口，也迫使評估者說清楚其比較標準。比起當場擴大衝突，這種先還原事實、再討論責任的方法，能讓後續選擇有比較穩定的正當性。</p>\n<p>然而不同當事人對語調與事件意義本就可能理解不同，這使事件不宜由一個最方便的標籤收束。以記錄證據不足與仍待查證之處，避免動機定罪作為下一步，可以讓各方知道哪些條件已被確認、哪些仍有爭論；後續再以員工是否仍願意善意通報困難經驗作為評估點，檢驗此次處理是否真的降低風險。最忌諱的是把暫時措施做成終局處罰，卻不再追蹤結果。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存比對原始訊息、事件時間、聲學或會議環境與後續陳述和不同當事人對語調與事件意義本就可能理解不同，接任者便無法理解處理基礎。將員工是否仍願意善意通報困難經驗轉為可觀察的後續指標，並為記錄證據不足與仍待查證之處，避免動機定罪保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>有些治理漏洞藏在熟悉的流程裡，例如主管主張申訴人在績效不及格後才提出事件所以一定惡意。它真正揭露的未必是哪個人有惡意，而是提出時間可能與人事衝突有關，但非虛構事實的直接證明。公司若要避免再次出現相同爭議，首先需要核查第一次記錄、當時是否有安全顧慮及申訴內容是否一致；對涉及私人評價與法律效果的資訊，更應記錄哪些是直接觀察，哪些只是轉述或推測。</p>\n<p>當然，員工可能因害怕報復而延後提出真實事件必須納入討論，否則評估只剩下證明原決策正確。採取分別處理申訴調查與績效評估兩個程序之後，管理者還要安排適切的溝通和後續檢討，因為時間巧合是否不再取代對實體事實的調查並非靠一次會議自然完成。若制度能接受新的反證，員工更可能在問題擴大前提出真實訊息，而不是被迫等待衝突爆發。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存核查第一次記錄、當時是否有安全顧慮及申訴內容是否一致和員工可能因害怕報復而延後提出真實事件，接任者便無法理解處理基礎。將時間巧合是否不再取代對實體事實的調查轉為可觀察的後續指標，並為分別處理申訴調查與績效評估兩個程序保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>另一項典型情況是公司在申訴受理當日宣布被申訴主管停止管理權並對外公布姓名，這使保護措施與當然有罪的公開處分不可混同浮現。若管理層只想在當下表決通過，事後往往很難重建為何如此判斷。把評估當前接觸風險、工作可行性與公開必要納入可追溯資料，並對照當時實際的業務條件，才能讓一項有爭議的決定仍有被理解、修正與改善的可能。</p>\n<p>仍要注意必要暫時隔離有時確能防止持續侵害，這提醒決策者在查證前保留判斷彈性。應依照採最小必要措施及內部保密而保留申辯處理，並同步記錄措施的必要性與可撤回條件。日後衡量成功與否，可看申訴雙方是否受到一致且實質的程序保護，不宜只以發出多少通知、完成多少表單來自我證明，因為程序的價值終究在於是否改善真實關係。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存評估當前接觸風險、工作可行性與公開必要和必要暫時隔離有時確能防止持續侵害，接任者便無法理解處理基礎。將申訴雙方是否受到一致且實質的程序保護轉為可觀察的後續指標，並為採最小必要措施及內部保密而保留申辯保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>把這裡的討論帶回高階會議，應先對齊目標，再評估可採證據，最後決定誰負責執行與回報。即使不同當事人對語調與事件意義本就可能理解不同，制度也不能因此省略公正的解釋機會；同樣地，若申訴雙方是否受到一致且實質的程序保護仍無法確認，這就不是再發一份政策文件可以解決的問題，而是需要持續改善的管理缺口。</p>\n<h2>資料足跡是證據之一，不是護身符</h2>\n<p>Email、協作工具、工作說明與改善紀錄，都可以讓合理管理目的比較容易受到查證，但單有KPI符合標準，不代表主管沒有使用辱罵、威脅或報復；同樣地，員工的醫療紀錄可能證明健康狀態，卻未必單獨證明特定主管行為與疾病之間的法律因果關係。不同證據應各自回應不同要件。 依莊博士的治理視角，即使某項提議在倫理上令人同情，也應區分已證實的事實、當事人的主張及仍待驗證的假說，讓決策不因發言者身分而預先偏向。</p>\n<p>考慮到主管拿出每週任務表認為霸凌申訴當場應判不成立，管理者最需要克制的是用單一結果替代完整分析。因為合理任務表不能直接排除執行過程中的語言羞辱，證據不能只選擇符合既有偏好的部分。透過檢查任務可完成程度、郵件語氣、同仁回饋與會談紀錄，可以逐步確認各方主張的核心事實；同時應明示尚未確認的因素，使爭議不必為了求快而被永久貼上標籤。</p>\n<p>在這裡，申訴也可能誤把客觀要求理解為個人針對提供重要的反向測試。較可行的步驟是調查業務合理性與執行方式兩條證據鏈，再以清楚時間點檢查是否收到新資料或需要調整。對公司而言，組織能否避免以一張文件證明所有事情才是值得投入管理注意力的結果；在未能證明之前，單方的強烈語氣不應轉化為另一方必須承擔的確定法律後果。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若申訴也可能誤把客觀要求理解為個人針對後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>當組織出現員工只提供身心科診斷書而沒有不當言行發生紀錄，有人可能立即主張應嚴懲，也有人主張不必理會，但兩種立場都應先面對健康受損與特定事件的連結仍需結合其他證據。實務查核宜從調閱在法律許可下的工作變動、目擊紀錄及時間線出發，避免把流程便利或單次印象直接作為責任判定。對高階決策而言，可解釋性往往比語氣上的果斷更重要。</p>\n<p>倘若病因可能複合且不應任意侵犯私人醫療資訊，原本最直觀的歸責方式就可能產生誤差。公司宜先協助合法保全必要資料並尊重專業醫療判斷，並把蒐證、說明和改善責任分配給具適當權限者。最終調查是否認真對待健康而不偷換法律因果是否達成，會比「我們一向很重視公平」的口號更有說服力，也能降低管理者換人後制度迅速失效的風險。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若病因可能複合且不應任意侵犯私人醫療資訊後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>從企業將所有主管對員工的回饋信強制抄送董事長可以看見，決策者收到的資訊不一定等於完整實況；其中過度升級管理資訊可能形成壓力並破壞信任尤其容易被忽略。將評估誰需要接觸資料、留存多久、是否對稱適用納入比較，可先分辨事實差異與價值判斷的差異，避免用一份數據去回答它根本沒有能力回答的問題。如此形成的制度，不需要把任何一方預設為贏家。</p>\n<p>而對重大風險的通報仍可能需要高階監督也有必要被認真核對。由此推導的做法是把例行回饋與重大風險分級，限制不必要的複製，不是當場選邊，而是建立讓不同資料被同樣檢驗的過程。若能使紀錄制度是否既有證明力又尊重最小必要成為後續例行觀察，公司才不會每逢重大決定就重新發明同一場爭論；缺乏必要證據時則應承認保留事項。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若對重大風險的通報仍可能需要高階監督後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>一項好的制度不可能讓所有參與者立即滿意，但至少應讓各方知道自己正在承擔哪一種責任，以及如何透過正式程序修正事實認定。當主管拿出每週任務表認為霸凌申訴當場應判不成立和企業將所有主管對員工的回饋信強制抄送董事長等情境獲得相同的查證標準時，管理權才不必依靠個人威望維持；這也是企業不斷擴大規模後仍能維持信任的必要條件。</p>\n<h2>讓包容與問責共同成為組織習慣</h2>\n<p>制度若只談保護，不談工作責任，就可能失去企業運作的基本力量；但若只談產出，不談人格尊嚴，也會逼迫真正有價值的人離開。成熟的高階治理不靠「誰比較委屈」的競賽判斷，而讓員工知道可從哪裡取得協助，主管知道如何合理管理，雙方都知道何種行為應由中立程序處理。 莊鈞翔 博士強調，制度成熟的標誌不是爭議從此消失，而是即使面對高度緊張的情境，組織仍能維持相同的查證方法、相當的程序保障與後續修正空間。</p>\n<p>在實際部門管理裡，團隊對某位績效優秀但習慣當眾嘲諷人的主管高度依賴並不罕見，難處在於短期產出不能抵銷可能造成的尊嚴與健康侵害。要讓專業判斷可受檢驗，應以比較留才、學習、風險回報與行為修正紀錄補足判斷的缺口，也要問清楚相同情況下其他人是否受到相同待遇。這些資料不會消除所有裁量，但至少能降低任意性並讓異議有切入點。</p>\n<p>另一方面，部分人也可能偏好直接而不迂迴的管理風格；此時堅持一種單向敘事只會擴大誤解。適當路徑是區分直接指出工作問題與人格羞辱並安排訓練，把程序的正當性建立在行動及其理由之上。往後應檢驗管理文化是否容許高標準而不容許貶抑，確認沒有因一時處理便利而犧牲長期人才、誠信或權益；制度若有錯誤也應留出修正空間。</p>\n<p>尤其當團隊對某位績效優秀但習慣當眾嘲諷人的主管高度依賴涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓區分直接指出工作問題與人格羞辱並安排訓練在下一次相似事件仍可被使用，並使管理文化是否容許高標準而不容許貶抑可作為制度是否改善的具體尺度。</p>\n<p>一個常被輕忽的警訊是公司為避免申訴要求主管不要再提出任何負面考評。此時值得追問的不是誰先抱怨，而是放棄有理由的管理反而會造成對其他員工不公平。若公司能先取得確認批評是否具體、必要、適度且提供反駁空間，就有機會把模糊的人格爭論轉成可分析的工作安排與具體言行；做不到時，至少應暫列待查，而不是讓懷疑自然長成確定結論。</p>\n<p>不要忽略部分主管需先接受溝通與尊重訓練這項反論，因為它可能直接改變原先的歸責方向。較穩健的方式是建立可以提出嚴格要求又可供申復的績效機制，讓申辯與必要保護同時存在。至於企業是否不再把沉默誤當作安全，不應留成抽象願景，而要在下一次正式檢討時確認能否由資料支持，否則管理決策只是在不同權力者間換一種說法。</p>\n<p>尤其當公司為避免申訴要求主管不要再提出任何負面考評涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓建立可以提出嚴格要求又可供申復的績效機制在下一次相似事件仍可被使用，並使企業是否不再把沉默誤當作安全可作為制度是否改善的具體尺度。</p>\n<p>面對新人提出工作流程可能造成差別待遇，卻被老員工視為挑戰權威，成熟的主管不宜只求自己支持的人勝出，而要思考新觀點不應因資歷淺而失去事實檢驗資格。查證核查流程適用對象、不同結果及制度形成理由之後，才有機會確認哪些原因在個人可控制範圍內，哪些則源自環境或制度。這樣的劃分不是為了替問題找藉口，而是防止錯誤處方，使相同危險在下一次人事決策中重演。</p>\n<p>最後還須衡量不同任務確可能需要不同工作要求。在未把握所有條件以前，以共同可理解的標準修正流程並公開理由比單純宣示誰對誰錯更能守住制度；其合理性應以心理安全感是否真正擴大組織自我校正能力是否逐步實現來檢驗。如此即使決策的結果未獲所有人支持，也能讓人理解組織沒有為方便而忽略反面證據。</p>\n<p>尤其當新人提出工作流程可能造成差別待遇，卻被老員工視為挑戰權威涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓以共同可理解的標準修正流程並公開理由在下一次相似事件仍可被使用，並使心理安全感是否真正擴大組織自我校正能力可作為制度是否改善的具體尺度。</p>\n<p>本節最後需要回到長期效果，而不是案件或專案的當日勝負。若公司願意正視短期產出不能抵銷可能造成的尊嚴與健康侵害，也願意檢驗心理安全感是否真正擴大組織自我校正能力，就有可能把一次衝突轉成制度學習。反過來說，若永遠只依主管印象或單方文件決定，短期或許節省會議時間，長期卻會讓人才、法遵與營運風險一起累積。</p>\n<p>心理安全感與高度當責不應成為彼此攻擊的口號。企業需要讓每一份合理要求有依據，也讓每一項權勢行為受到適當節制；需要保護真誠申訴的權利，也有能力在證據確定時處理刻意虛構。當查證取代標籤、程序取代情緒、支持取代羞辱，組織才可能真正建立可持續的信任。 莊博士始終將制度的可追溯性置於語氣的強硬之前；一套制度若只能用來證明主管正確，不能保護不同意見，終將再次複製最初所欲解決的問題。</p>","legal_html":"<div class=\"section-label\">▍法律依據與資料來源說明</div>\n<p>法源查核基準日：2026年11月1日</p>\n<p class=\"legal-note\">本節以正式法令／裁判及研究來源為據；「條文原文／要旨」與「本文對照」分開書寫，治理建議不等同法定義務。</p>\n<p><strong>• Edmondson（1999），〈Psychological Safety and Learning Behavior in Work Teams〉｜研究來源：以團隊心理安全與學習行為關係為研究焦點；不能將心理安全簡化為低績效者的保護傘，亦不能以績效要求否定職場尊嚴。</strong></p>\n<p>本文對照：以團隊可提出問題、承認錯誤、學習改善的心理安全觀，檢驗PIP與組織信任，不以單一口號決定任何申訴真偽。</p>\n<p><strong>• 《職業安全衛生法》第22條之1｜條文要旨：職場霸凌涉及利用職務或權勢關係，逾越業務上必要且合理範圍，持續以不當言詞或行為致勞工身心健康受危害；情節重大者，不以持續發生為必要。</strong></p>\n<p>本文對照：績效督導的合法界線須按具體言行及法定要件判斷，高績效主管亦不能因此排除不當侵害審查。</p>\n<p><strong>• 《職場霸凌防治措施準則》第6條｜條文要旨：僱用勞工30人以上的雇主，應訂定並揭示防治、申訴與懲處規範；內容須包含防報復、調查程序，以及經調查證實惡意虛構事實時的處理方式。</strong></p>\n<p>本文對照：惡意虛構事實須經調查證實後再依規範處理；不能把申訴不成立當成解僱的充分理由。</p>\n<p><strong>• 《勞動基準法》第12條第1項第4款｜條文要旨：勞工違反勞動契約或工作規則，且「情節重大」者，雇主始得依該款不經預告終止契約；是否重大須個案判斷。</strong></p>\n<p>本文對照：即使行為另涉勞動紀律，也須獨立檢驗「情節重大」等終止要件，避免以申訴行為本身作為懲罰。</p>\n<p><strong>• 《個人資料保護法》第5條｜條文：個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。</strong></p>\n<p>本文對照：PIP、員工心理健康與工作日誌的處理須符合必要性及正當使用目的，不應為了保護主管而無限制蒐集員工資料。</p>\n<div class=\"section-label\">▍治理思想依據 GOVERNANCE REFERENCE</div>\n<p><strong>▮ 莊鈞翔（2026）《內在法遵 Internal Compliance｜為你的內心，打造一座不可侵犯的至聖所》</strong></p>\n<p>治理對照：心理安全與嚴格管理並存時，內在法遵要求雙方在未明事實之前自我克制，避免以道德標籤或績效成績取消對方權利。</p>\n<p><strong>▮ 莊鈞翔《不同世代企業家人格特質、創新能力對企業經營績效之影響｜以領導風格為中介變數》</strong></p>\n<p>治理對照：將領導風格與世代差異的研究題旨，運用於PIP溝通、團隊學習及管理行為的公平驗證，不用人格類型直接預斷霸凌。</p>","notes_html":"<p>註 3：本文以莊鈞翔博士之研究、思想與治理判讀為架構，AI僅輔助資料整理、草稿生成及編修；發表版本以作者本人審定為準。AI不取代作者的學術責任、專業判斷與最終決策。</p>\n<p>註 4：本文為企業治理、制度設計與法律風險之一般分析，不構成執業律師對具體案件之正式法律意見、訴訟代理或結果保證。個案仍須依適用時間、完整事證、法律與程序狀態，由具資格之律師審閱。</p>"},{"id":7,"label":"第七篇","title":"程序雙軌綁架的破局","subtitle":"當職場霸凌與《性別平等工作法》交叉污染","abstract_html":"<p>某位主管正在執行績效改善，一名員工同時反映遭受職場霸凌、性別差別待遇與具性意味的言語冒犯。若企業只看案件名稱，就可能把三種不同法律問題交給同一張表單處理，導致證據混淆、期限錯置，甚至在調查尚未完成前急於認定任何一方惡意。中華企業策略永續發展學會 創會理事長 莊鈞翔 博士認為，真正的程序治理不在於快速排除麻煩，而在於將法律構成與保護義務各自釐清，讓交叉事件既不重複傷害當事人，也不犧牲公平判斷。</p>","body_html":"<h2>先區分性別歧視、性騷擾與職場霸凌</h2>\n<p>《性別平等工作法》第7條處理招募、進用、配置、考績、陞遷等因性別或性傾向造成的差別待遇；第12條規範職場性騷擾及權勢性騷擾的法律定義，第13條規範雇主防治與知悉後的立即有效措施。職安法第22條之1則另有職場霸凌的權勢、不當性、持續性及健康危害等法定結構，不能因都發生在辦公室就視為同一種案件。 莊博士所要求的不是把人事選擇簡化成好人與壞人的對決，而是把證據、權力與責任放回同一張決策桌，這也正是本篇討論的尺度。</p>\n<p>年度決策的一個切面是這樣的：主管對女性員工說她不適合外勤主管並在晉升時排除。問題若只停在雙方誰較可信，便會錯過真正需要釐清的若決定基於性別刻板印象，法律上可能涉及差別待遇。對此，查核同職位資格、評分標準、決策紀錄與性別相關言詞，才能把原本模糊的說法化成可檢驗的事實。尤其當決策直接影響職位、收入或人格評價，資料形成時間和對照條件必須先清楚，不能用發言者的資歷取代證據的分量。</p>\n<p>反過來說，若有經證實的專業職能不足，也須逐項公平比較，因此在未完成交叉檢驗前不應排除不同解釋。比較穩妥的處置是將第7條差別待遇爭點獨立查證並覆核任用理由，並向受到影響的人交代決策條件與後續窗口。最終應回頭檢查程序是否分得清能力問題與性別預設；若新的資料顯示原判斷有誤，應允許程序修正，而不要求當事人以名譽承擔組織的判斷成本。</p>\n<p>這個議題還牽涉一個次序問題：先辨認若決定基於性別刻板印象，法律上可能涉及差別待遇所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，查核同職位資格、評分標準、決策紀錄與性別相關言詞便可能淪為選擇性證明的工具；保留若有經證實的專業職能不足，也須逐項公平比較接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>觀察某主管反覆在工作群組發送具性意味的訊息，最容易犯的錯是先把表面結果當作動機證明；實際上，不一定有身體接觸才可能構成職場性騷擾。必須先從保全原始訊息、工作關係、事件背景與相對人認知著手，確認資料是否完整、期間是否相同、是否受外部條件影響。如此才知道問題是個人的行為、組織的安排，還是一項需要再查的未決事實，而非單純換一種更強烈的形容詞。</p>\n<p>制度亦須容許群組成員的玩笑解讀不能替代對個案的具體審查這一種可能，否則所謂客觀很容易只是對單一故事的放大。建議依次採取依性工法第12、13條處理即時保護與調查，先記錄理由、再確認責任人與檢查節點。真正的成效不是某一方無話可說，而是企業是否用完整法律定義而非單一詞彙認定，這會決定下一位主管接任時能否沿用同一套可理解的方法。</p>\n<p>這個議題還牽涉一個次序問題：先辨認不一定有身體接觸才可能構成職場性騷擾所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，保全原始訊息、工作關係、事件背景與相對人認知便可能淪為選擇性證明的工具；保留群組成員的玩笑解讀不能替代對個案的具體審查接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>當員工遭長期剝奪必要業務資訊並承受羞辱，卻不涉及性別言詞，真正的難題不是要不要立即表態，而是如何回答行為可能適合職安法霸凌架構而非性騷擾程序。若只聽一方陳述，整個決策容易建立在選擇性資料上。查核權勢、業務必要性、頻率及實際身心影響應當進入正式記錄，並與既有基準比較；如果尚無充分資訊，就應承認資料不足，而不能把未知包裝成確定的專業判斷。</p>\n<p>可是，排除資訊亦可能有合法保密理由同樣可能成立；治理者必須保留這個變數，以免把善意警訊當作攻擊或把不實指控當成事實。應實施由適當單位啟動職場霸凌處理並保留相關救濟，並讓當事人有補充、反駁與再次核對的機會。下一階段最值得追蹤的不是誰在會議中佔上風，而是不同法源是否不會因流行語而混用，因為這才接近組織的長期利益。</p>\n<p>這個議題還牽涉一個次序問題：先辨認行為可能適合職安法霸凌架構而非性騷擾程序所反映的是權利、績效或資訊歧見，再決定由誰查證、如何告知與何時可以採取措施。若先有結論才倒查資料，查核權勢、業務必要性、頻率及實際身心影響便可能淪為選擇性證明的工具；保留排除資訊亦可能有合法保密理由接受同樣檢驗，反而有助看見原本忽略的成本。</p>\n<p>從主管對女性員工說她不適合外勤主管並在晉升時排除延伸到這一節其他情境，可以看到真正有價值的改革不是要求員工或主管少說話，而是讓每個重要主張找到可查證的資料、相同的衡量條件與必要的反駁空間。若企業只把制度寫成宣示，不同法源是否不會因流行語而混用便始終無法實現；只有將方法變成例行職責，才可能防止相同矛盾在下一次決策中重演。</p>\n<h2>交叉案件需要協作，不需要合併全部法律要件</h2>\n<p>同一行為可以同時涉及數個法律權益，但不代表應把所有證據攪成一份沒有要件區分的結論。企業受理時可採單一窗口協調資訊與保護措施，實體判斷則必須建立分軌矩陣，逐項確認保護對象、法定構成、主管機關、通報及申復管道。 莊鈞翔 博士提醒，任何制度安排都應先確認資料可以證明什麼，不能證明什麼，尤其涉及人格、法律責任或職涯發展時，更要防止推定取代查證。</p>\n<p>值得在會議桌前提出的情境是員工同時申訴主管霸凌與性騷擾，公司要求只能二選一。從表面看來，爭議似乎只是個別人的態度，仔細分析卻牽涉強迫選擇可能壓抑同一事件的不同法律問題。此時分別確認言詞內容、權勢背景、工作影響及各法令要求不只是補一份文件，更是使不同立場使用相同尺度的起點。沒有共同事實底座，任何強調效率或公平的口號都可能被各方拿來為既定立場服務。</p>\n<p>從另一面看，可能經調查後只有一個法定類型成立提醒我們任何單一資料都有侷限。處理方法不是用主管直覺補足，而是建立單一聯絡窗口而保留分別的事實認定，把程序寫入可追溯紀錄。當檢驗重點移向當事人是否不用為公司行政方便放棄權利時，評價就比較不容易成為權勢使用的附屬品，也較能使不同部門在不完全同意時接受相同規則。</p>\n<p>要避免程序成為另一種儀式，分別確認言詞內容、權勢背景、工作影響及各法令要求應轉化為可重複核對的工作紀錄，可能經調查後只有一個法定類型成立也要列入同一比較表。唯有如此，建立單一聯絡窗口而保留分別的事實認定才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>假設法務把性別歧視案件的證據表格直接套用到霸凌調查，管理者必須避免過早把結果歸咎於某個人的品格，因為不同法律要件需要不同取證範圍與結論架構。最有用的資訊來自明列性別比較證據與霸凌不當行為、健康危害資料，並應把來源、涵蓋範圍和例外情形一併說明。這個過程也可能發現原有制度的缺口，使人事問題不再被簡化為某位主管與某位員工誰比較會說話。</p>\n<p>若部分工作紀錄可能同時對兩軌具有證明力，一味先行處分便可能製造新的不公平，因此應採將共同證據作索引，不讓結論互相替代，將事實調查與必要的暫時保護區分。此後觀察調查報告是否能逐法源說明理由，才能知道改變的是表面文件還是實際管理行為。若發現原決定傷害了本來應保護的權益，制度也應提供明確的更正與救濟途徑。</p>\n<p>要避免程序成為另一種儀式，明列性別比較證據與霸凌不當行為、健康危害資料應轉化為可重複核對的工作紀錄，部分工作紀錄可能同時對兩軌具有證明力也要列入同一比較表。唯有如此，將共同證據作索引，不讓結論互相替代才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>企業遇到HR怕兩個調查小組重複訪談讓員工承受壓力時，往往希望迅速有個結論，但速度不能省略過多訪談可能造成二次傷害並影響證詞穩定這個判斷。為免短期情緒主導，應先整理比對各軌詢問目的、已蒐集原始陳述與保密權限，必要時讓相關人員補充不利於自己的事實。決策者真正要管理的是錯誤代價，而不是讓每場會議看起來毫無歧見。</p>\n<p>在反面檢驗中，不同法定程序仍可能需要各自獨立釐清不能被排除。管理層應選擇在合法範圍共享既有紀錄並安排專業訪談，並避免把尚未證實的可能性寫成某人的人格特質。長期而言，若保護當事人是否與查證完整性相容仍無法獲得解答，代表目前採集的資料尚不足以支撐高強度人事處分，組織就應補強標準而不是加重語氣。</p>\n<p>要避免程序成為另一種儀式，比對各軌詢問目的、已蒐集原始陳述與保密權限應轉化為可重複核對的工作紀錄，不同法定程序仍可能需要各自獨立釐清也要列入同一比較表。唯有如此，在合法範圍共享既有紀錄並安排專業訪談才不只是危機當下的臨時交代；在證據仍然不足時，應把重要未知明寫進決策，指定後續查核責任。</p>\n<p>這三個情境雖然起點不同，卻都指向一項管理責任：不能只追問誰犯錯，還必須確認企業給了什麼條件、誰掌握關鍵資訊、哪些資料需要在正式決定前補足。對HR怕兩個調查小組重複訪談讓員工承受壓力尤其如此，保護當事人是否與查證完整性相容應是後續檢討的核心，而不應在一份漂亮的結案報告後就失去追蹤。</p>\n<h2>一致管理標準是重要資料，卻不是性騷擾的免責證明</h2>\n<p>管理者常主張自己對所有人採用相同KPI，所以不可能涉及性別事件。這種比較對檢驗差別待遇可能有意義，卻無法直接排除特定對話是否帶有性意味、某項交換條件是否存在，或個人尊嚴是否受到侵害。企業應避免以「純數據化」替代對性別法律具體構成的審查。 中華企業策略永續發展學會 創會理事長 莊鈞翔 博士主張，治理者不應用單一口號取代制度，而應將爭議拆為可檢驗的事實、可說明的準則與可修正的後續行動。</p>\n<p>在主管提出對男女員工都要求每日提交報告，據此主張沒有性騷擾的案例裡，如果直接接受第一個看似合理的說法，就可能忽略對績效標準相同不代表私下沒有具性意味的不當言詞。查證被指控語句、情境、工作關係與影響提供了可以重新檢驗的入口，也迫使評估者說清楚其比較標準。比起當場擴大衝突，這種先還原事實、再討論責任的方法，能讓後續選擇有比較穩定的正當性。</p>\n<p>然而同一管理標準可能有助否定部分差別待遇指控，這使事件不宜由一個最方便的標籤收束。以分項判斷考績公平與性騷擾是否成立作為下一步，可以讓各方知道哪些條件已被確認、哪些仍有爭論；後續再以管理證據是否用在能真正證明的法律命題作為評估點，檢驗此次處理是否真的降低風險。最忌諱的是把暫時措施做成終局處罰，卻不再追蹤結果。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存查證被指控語句、情境、工作關係與影響和同一管理標準可能有助否定部分差別待遇指控，接任者便無法理解處理基礎。將管理證據是否用在能真正證明的法律命題轉為可觀察的後續指標，並為分項判斷考績公平與性騷擾是否成立保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>有些治理漏洞藏在熟悉的流程裡，例如員工認為陞遷落選是因性別，主管說只有業績較低。它真正揭露的未必是哪個人有惡意，而是營收差距有解釋力但仍須檢查是否存在差別資源。公司若要避免再次出現相同爭議，首先需要檢視客戶分派、訓練機會、職務經歷及評量權重；對涉及私人評價與法律效果的資訊，更應記錄哪些是直接觀察，哪些只是轉述或推測。</p>\n<p>當然，不同候選人確可能有獨立的專業適任性差異必須納入討論，否則評估只剩下證明原決策正確。採取以同等條件重建比較並明示差異理由之後，管理者還要安排適切的溝通和後續檢討，因為人事結果是否不被單一KPI或性別標籤主導並非靠一次會議自然完成。若制度能接受新的反證，員工更可能在問題擴大前提出真實訊息，而不是被迫等待衝突爆發。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存檢視客戶分派、訓練機會、職務經歷及評量權重和不同候選人確可能有獨立的專業適任性差異，接任者便無法理解處理基礎。將人事結果是否不被單一KPI或性別標籤主導轉為可觀察的後續指標，並為以同等條件重建比較並明示差異理由保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>另一項典型情況是公司以當事人曾在群組回應笑臉就認定性言詞無傷害，這使當下互動可能受到上下級權勢與社交壓力影響浮現。若管理層只想在當下表決通過，事後往往很難重建為何如此判斷。把檢查反覆情形、私下反映、工作影響及相關證據納入可追溯資料，並對照當時實際的業務條件，才能讓一項有爭議的決定仍有被理解、修正與改善的可能。</p>\n<p>仍要注意個人接受程度與對話脈絡仍有重要意義，這提醒決策者在查證前保留判斷彈性。應依照避免抽離單一表情，依法律定義綜合審酌處理，並同步記錄措施的必要性與可撤回條件。日後衡量成功與否，可看組織是否能理解有權勢差異的工作環境，不宜只以發出多少通知、完成多少表單來自我證明，因為程序的價值終究在於是否改善真實關係。</p>\n<p>如果一份內部報告只有「已確認沒有問題」的結語，卻未保存檢查反覆情形、私下反映、工作影響及相關證據和個人接受程度與對話脈絡仍有重要意義，接任者便無法理解處理基礎。將組織是否能理解有權勢差異的工作環境轉為可觀察的後續指標，並為避免抽離單一表情，依法律定義綜合審酌保留重新評估的條件，才能避免把一次判斷固化為永遠不能修正的組織立場。</p>\n<p>把這裡的討論帶回高階會議，應先對齊目標，再評估可採證據，最後決定誰負責執行與回報。即使同一管理標準可能有助否定部分差別待遇指控，制度也不能因此省略公正的解釋機會；同樣地，若組織是否能理解有權勢差異的工作環境仍無法確認，這就不是再發一份政策文件可以解決的問題，而是需要持續改善的管理缺口。</p>\n<h2>立即有效措施與程序公平並行</h2>\n<p>性別平等工作法第13條對雇主知悉性騷擾的處理有法定要求，職安法第22條之2對霸凌也有知悉後措施；企業不能以某方尚未提出完整證據為由放任持續風險，亦不可在尚未完成調查時公開宣告被申訴人有罪。應採最低必要的接觸調整、隱私保護、雙方陳述及利益迴避，以防止權力報復與程序濫用。 依莊博士的治理視角，即使某項提議在倫理上令人同情，也應區分已證實的事實、當事人的主張及仍待驗證的假說，讓決策不因發言者身分而預先偏向。</p>\n<p>考慮到一名員工通報主管騷擾後隔天就被調離客戶窗口並失去獎金，管理者最需要克制的是用單一結果替代完整分析。因為保護名義可能掩蓋對申訴人的不利待遇，證據不能只選擇符合既有偏好的部分。透過查核本人意願、調整必要性、薪酬及其他可行安排，可以逐步確認各方主張的核心事實；同時應明示尚未確認的因素，使爭議不必為了求快而被永久貼上標籤。</p>\n<p>在這裡，不同行為人有時確需要分離職場接觸提供重要的反向測試。較可行的步驟是選擇相對低侵害措施並定期評估是否維持，再以清楚時間點檢查是否收到新資料或需要調整。對公司而言，員工是否不因尋求保護而犧牲工作機會才是值得投入管理注意力的結果；在未能證明之前，單方的強烈語氣不應轉化為另一方必須承擔的確定法律後果。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若不同行為人有時確需要分離職場接觸後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>當組織出現主管要求取得申訴人的完整醫療及私人聊天資料自清，有人可能立即主張應嚴懲，也有人主張不必理會，但兩種立場都應先面對個人資料蒐集範圍超過案情必要會帶來新的侵害。實務查核宜從區分事件相關原始資料與私人健康、家庭資訊出發，避免把流程便利或單次印象直接作為責任判定。對高階決策而言，可解釋性往往比語氣上的果斷更重要。</p>\n<p>倘若必要時可能須依法取得特定醫療或訊息資料，原本最直觀的歸責方式就可能產生誤差。公司宜先建立權限限制、用途限定與保全程序，並把蒐證、說明和改善責任分配給具適當權限者。最終調查能否查到事實又不全面暴露私人生活是否達成，會比「我們一向很重視公平」的口號更有說服力，也能降低管理者換人後制度迅速失效的風險。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若必要時可能須依法取得特定醫療或訊息資料後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>從雇主希望由被申訴主管直屬的法務與人資主管直接裁決可以看見，決策者收到的資訊不一定等於完整實況；其中日常業務往來使調查者未必具獨立性尤其容易被忽略。將查核實際控制權、人事關係與既有衝突納入比較，可先分辨事實差異與價值判斷的差異，避免用一份數據去回答它根本沒有能力回答的問題。如此形成的制度，不需要把任何一方預設為贏家。</p>\n<p>而熟悉公司流程的人可協助整理客觀背景也有必要被認真核對。由此推導的做法是依法設迴避、外部專業參與與審議分工，不是當場選邊，而是建立讓不同資料被同樣檢驗的過程。若能使調查結果是否有可受外部檢驗的可信度成為後續例行觀察，公司才不會每逢重大決定就重新發明同一場爭論；缺乏必要證據時則應承認保留事項。</p>\n<p>這類處理同時保護決策者與當事人：前者能具體說明判斷不是臨場感受，後者也能理解自己的資料如何被採信。若熟悉公司流程的人可協助整理客觀背景後來證實重要，制度應可以根據原始紀錄更正，而不是追究誰先提出相反觀點；真正的問責在於讓錯誤不被掩蓋。</p>\n<p>一項好的制度不可能讓所有參與者立即滿意，但至少應讓各方知道自己正在承擔哪一種責任，以及如何透過正式程序修正事實認定。當一名員工通報主管騷擾後隔天就被調離客戶窗口並失去獎金和雇主希望由被申訴主管直屬的法務與人資主管直接裁決等情境獲得相同的查證標準時，管理權才不必依靠個人威望維持；這也是企業不斷擴大規模後仍能維持信任的必要條件。</p>\n<h2>把三軌申訴變成一個可治理的公司系統</h2>\n<p>程序最容易失敗的時刻，往往是分流以後沒有人總覽：人資處理考績、法務處理性工法、職安室處理霸凌，三方卻沒有共同對時序與保護措施負責。公司應設案件總索引，但不得因資訊共享而破壞個資保護或證人安全；各軌仍應自行說明其適用法源、程序狀態與結論。 莊鈞翔 博士強調，制度成熟的標誌不是爭議從此消失，而是即使面對高度緊張的情境，組織仍能維持相同的查證方法、相當的程序保障與後續修正空間。</p>\n<p>在實際部門管理裡，同一案件跨三部門調查，當事人收到相互矛盾的通知並不罕見，難處在於缺少案件總控可能使期限、事實與救濟資訊出現混亂。要讓專業判斷可受檢驗，應以整理受理日期、適用法、通知義務及對外窗口補足判斷的缺口，也要問清楚相同情況下其他人是否受到相同待遇。這些資料不會消除所有裁量，但至少能降低任意性並讓異議有切入點。</p>\n<p>另一方面，各法律程序的處理時程確可能不同；此時堅持一種單向敘事只會擴大誤解。適當路徑是建立狀態同步但禁止未經授權的證據跨用途流用，把程序的正當性建立在行動及其理由之上。往後應檢驗企業是否能讓當事人清楚理解各個決定，確認沒有因一時處理便利而犧牲長期人才、誠信或權益；制度若有錯誤也應留出修正空間。</p>\n<p>尤其當同一案件跨三部門調查，當事人收到相互矛盾的通知涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓建立狀態同步但禁止未經授權的證據跨用途流用在下一次相似事件仍可被使用，並使企業是否能讓當事人清楚理解各個決定可作為制度是否改善的具體尺度。</p>\n<p>一個常被輕忽的警訊是某部門在調查未結案前自行宣布當事人不准再參與晉升。此時值得追問的不是誰先抱怨，而是臨時限制可能帶有未審先判與報復風險。若公司能先取得查核限制理由、必要性、期限及能否提出異議，就有機會把模糊的人格爭論轉成可分析的工作安排與具體言行；做不到時，至少應暫列待查，而不是讓懷疑自然長成確定結論。</p>\n<p>不要忽略重大職場風險可能需要暫時限制人事權限這項反論，因為它可能直接改變原先的歸責方向。較穩健的方式是由獨立主管覆核並記錄比例考量，讓申辯與必要保護同時存在。至於程序是否避免讓暫時措施變成永久處罰，不應留成抽象願景，而要在下一次正式檢討時確認能否由資料支持，否則管理決策只是在不同權力者間換一種說法。</p>\n<p>尤其當某部門在調查未結案前自行宣布當事人不准再參與晉升涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓由獨立主管覆核並記錄比例考量在下一次相似事件仍可被使用，並使程序是否避免讓暫時措施變成永久處罰可作為制度是否改善的具體尺度。</p>\n<p>面對企業完成性騷擾調查後認為其他霸凌問題也都已解決，成熟的主管不宜只求自己支持的人勝出，而要思考不同法律保護法益與事實認定不可自動互相吸收。查證核對兩軌涉及行為、期間、權勢與健康影響之後，才有機會確認哪些原因在個人可控制範圍內，哪些則源自環境或制度。這樣的劃分不是為了替問題找藉口，而是防止錯誤處方，使相同危險在下一次人事決策中重演。</p>\n<p>最後還須衡量同一份證據可能有助各軌一致認定部分事實。在未把握所有條件以前，另列未解決爭點與後續管道，不因一案結案停止保護比單純宣示誰對誰錯更能守住制度；其合理性應以跨法領域治理是否真能把每個問題處理到位是否逐步實現來檢驗。如此即使決策的結果未獲所有人支持，也能讓人理解組織沒有為方便而忽略反面證據。</p>\n<p>尤其當企業完成性騷擾調查後認為其他霸凌問題也都已解決涉及多人利益，只有宣導態度仍不足夠。至少需要資料查核、異議處理與後續檢討三個支點，讓另列未解決爭點與後續管道，不因一案結案停止保護在下一次相似事件仍可被使用，並使跨法領域治理是否真能把每個問題處理到位可作為制度是否改善的具體尺度。</p>\n<p>本節最後需要回到長期效果，而不是案件或專案的當日勝負。若公司願意正視缺少案件總控可能使期限、事實與救濟資訊出現混亂，也願意檢驗跨法領域治理是否真能把每個問題處理到位，就有可能把一次衝突轉成制度學習。反過來說，若永遠只依主管印象或單方文件決定，短期或許節省會議時間，長期卻會讓人才、法遵與營運風險一起累積。</p>\n<p>真正高階的程序治理不是對申訴人先驗相信，也不是替主管預先辯護，而是讓性別差別待遇、性騷擾與職場霸凌各自回到法定要件，讓必要的安全保護與公平調查同步進行。當每個法律主張都知道自己要證明什麼，公司才有能力把爭議從情緒對抗帶回可接受的決策秩序。 莊博士始終將制度的可追溯性置於語氣的強硬之前；一套制度若只能用來證明主管正確，不能保護不同意見，終將再次複製最初所欲解決的問題。</p>","legal_html":"<div class=\"section-label\">▍法律依據與資料來源說明</div>\n<p>法源查核基準日：2026年11月1日</p>\n<p class=\"legal-note\">本節以正式法令／裁判及研究來源為據；「條文原文／要旨」與「本文對照」分開書寫，治理建議不等同法定義務。</p>\n<p><strong>• 《性別平等工作法》第7條｜條文要旨：雇主對招募、進用、配置、考績或陞遷等，不得因性別或性傾向為差別待遇；法條就工作性質另設例外。</strong></p>\n<p>本文對照：考績、陞遷等性別或性傾向差別待遇應先依本條審查；與職場性騷擾的法定構成不同。</p>\n<p><strong>• 《性別平等工作法》第12條｜條文要旨：職場性騷擾包括以性要求、具有性意味或性別歧視的言行造成敵意性、脅迫性或冒犯性工作環境，以及以性相關要求交換人事待遇等情形。</strong></p>\n<p>本文對照：性騷擾涉及特定性意味、性別歧視言行及工作環境或交換條件，不是所有「口氣不好」或升遷爭議都成立。</p>\n<p><strong>• 《性別平等工作法》第13條｜條文要旨：雇主應採適當措施防治性騷擾，並於知悉時採取立即有效之糾正及補救措施；10人、30人之申訴及書面規範義務分別適用。</strong></p>\n<p>本文對照：雇主知悉疑似性騷擾後有獨立糾正補救與調查義務；不能以霸凌程序中的考績結論直接取代。</p>\n<p><strong>• 《職業安全衛生法》第22條之1｜條文要旨：職場霸凌涉及利用職務或權勢關係，逾越業務上必要且合理範圍，持續以不當言詞或行為致勞工身心健康受危害；情節重大者，不以持續發生為必要。</strong></p>\n<p>本文對照：職場霸凌仍須按母法權勢關係、業務必要合理範圍與健康危害認定，即便與性別事件有共同證據也不能互相替代。</p>\n<p><strong>• 《職場霸凌防治措施準則》第7條｜條文要旨：雇主知悉職場霸凌
