name: Materialize exact Humanistic interview fallback

on:
  push:
    branches: [fix/humanistic-vercel-fallback-20260915]
    paths:
      - .github/workflows/materialize-humanistic-vercel-fallback.yml
      - .staging/humanistic-exact/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/humanistic-vercel-fallback-20260915
          fetch-depth: 0
      - name: Reconstruct canonical Humanistic HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/humanistic-interview
          cat .staging/humanistic-exact/part-*.b64 | base64 -d > public/humanistic-interview/index.html
          printf '%s  %s\n' '001b9876eca5c16bdff1b724b931aa81d8b86d7c9e31e1e07edb3cbed62a6fc9' 'public/humanistic-interview/index.html' | sha256sum -c -
          grep -Fq '人文地景產' public/humanistic-interview/index.html
          grep -Fq 'humanistic-20q' public/humanistic-interview/index.html
      - name: Commit canonical HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Humanistic Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add public/humanistic-interview/index.html
          git commit -m 'build: materialize canonical Humanistic interview [skip ci]' || exit 0
          git push origin HEAD:fix/humanistic-vercel-fallback-20260915
