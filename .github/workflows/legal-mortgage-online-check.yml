name: Verify live legal preview
on:
  push:
    branches: [preview/legal-mortgage-20260923-r2]
    paths: [.github/workflows/legal-mortgage-online-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live response
        run: |
          python -m pip -q install requests beautifulsoup4
          mkdir -p online-check
          python - <<'PY'
          import requests,json,pathlib,hashlib
          from bs4 import BeautifulSoup
          url='https://stt-003-1vz95b7ap-pc5888pc5888s-projects.vercel.app/legal-mortgage-preview?_vercel_share=myUQDaHvA7DlEqMJFz8CTaCh0qTjUfDf'
          s=requests.Session();r=s.get(url,timeout=40);d=BeautifulSoup(r.text,'html.parser')
          result={'status':r.status_code,'title':d.title.get_text() if d.title else '', 'url':r.url,'bytes':len(r.content),'has_data':d.select_one('#article-data') is not None,'sha256':hashlib.sha256(r.content).hexdigest(),'body_text':d.get_text(' ',strip=True)[:2500],'history':[{'status':x.status_code,'url':x.url} for x in r.history]}
          pathlib.Path('online-check/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legal-preview-live-check
          path: online-check
