publishing_workflow:
  - Confirm the work title, author, date, series, source URLs and permitted public excerpt.
  - Keep existing imported articles in their source catalog; add other verified sources through additional-publications.json.
  - Use one work id with multiple sources for a work published on multiple platforms, not duplicate cards.
  - Add a new series only with verified public works. A series can be selected at /columns?series=its-key; a new standalone route requires its page metadata and routing record.
  - Do not mark M Media or another independent publisher as STT owned.
  - Run build and publication acceptance. Invalid series, duplicate ids or source URLs, missing attribution or unsafe URLs stop the registry validation.
  - Publish to the existing main branch and verify canonical production pages; do not create another website.
legacy_routing:
  /books/internal-compliance: /books#internal-compliance
  /publications: /books
  '/insights#publications': /books
  '/insights?theme=...': '/columns?theme=...'
  /research: /insights
  /papers: /insights
qa:
  - Verify all original records and approved covers are retained unchanged.
  - Verify series isolation, search, sorting, pagination, empty state and return navigation.
  - Verify direct requests, static metadata, canonical, Open Graph, sitemap and unknown-route 404.
  - Verify desktop, tablet and mobile screenshots, single H1, image decode, keyboard use and no horizontal overflow.
  - Compare accepted questionnaire and API sources; do not submit real responses for publication QA.
