name: Founder name kicker and single-occurrence verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/founder-name-kicker-20261106.yml]
permissions:
  contents: write
concurrency:
  group: founder-name-kicker-20261106
  cancel-in-progress: false
jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: stt
            branch: main
            live: https://stt-003.vercel.app
            hero_blob: 9a69882efcdb503826f3574784fe5f743c6625ac
          - site: gcsda
            branch: gcsda-release-20261005
            live: https://gcsda-governance.vercel.app
            hero_blob: c56ac5c3e67dfdeff2c26c219dc44858f840488d
    env:
      SITE: ${{ matrix.site }}
      BRANCH: ${{ matrix.branch }}
      LIVE: ${{ matrix.live }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1
      - name: Apply the owner-authorized founder-only change
        env:
          EXPECTED_HERO_BLOB: ${{ matrix.hero_blob }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/founder-kicker-evidence
          python3 - <<'PY'
          import os, pathlib, subprocess, hashlib, json
          site=os.environ['SITE'];p=pathlib.Path('src/components/GovernedHero.tsx')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==os.environ['EXPECTED_HERO_BLOB'], 'Hero baseline changed; preserve concurrent work'
          before=p.read_text();prefix=site+'-intact-hero'
          old='{kicker&&<p className="'+prefix+'__kicker">{kicker}</p>}'
          new='<p className="'+prefix+'__kicker cis-kicker" lang="en" data-founder-name-kicker="20261106">CHUANG CHUN HSIANG Ph.D.</p>'
          assert before.count(old)==1
          after=before.replace(old,new)
          duplicates=(['{page?.byline&&page.bylineBefore&&<p className="stt-intact-hero__byline" lang="en">{page.byline}</p>}', '{page?.byline&&!page.bylineBefore&&<p className="stt-intact-hero__byline" lang="en">{page.byline}</p>}'] if site=='stt' else ['{page?.byline&&<p className="gcsda-intact-hero__byline" lang="en">{page.byline}</p>}'])
          for oldline in duplicates:
              assert after.count(oldline)==1
              after=after.replace('          '+oldline+'\n','')
          generic='  return <>\n    <section className={`cis-hero'
          assert before.split(generic,1)[1]==after.split(generic,1)[1]
          assert after.count('data-founder-name-kicker="20261106"')==1
          p.write_text(after)
          allowed=['src/components/GovernedHero.tsx']
          if site=='gcsda':
              css=pathlib.Path('src/styles/gcsda-founder-intact.css')
              assert subprocess.check_output(['git','hash-object',str(css)],text=True).strip()=='88e5412a6c91a53e8f9fd6b4a6dcfe9909b0aef8'
              css.write_text(css.read_text()+'''\n/* Owner-requested single name kicker: match STT homepage, not body paragraphs. */
          #root .g4-founder-page .gcsda-intact-hero p.gcsda-intact-hero__kicker.cis-kicker[data-founder-name-kicker] {
            font-family:"Noto Sans TC","Noto Sans CJK TC",Inter,system-ui,sans-serif!important;
            font-size:11px!important;
            font-weight:600!important;
            line-height:1.8!important;
            letter-spacing:.12em!important;
            color:#886237!important;
            margin:0 0 17px!important;
          }
          ''')
              allowed.append(str(css))
          asset=pathlib.Path(f'public/visual-approved/portrait-{site}-20261106-8946x6330-original.png')
          expected={'stt':'a1b0d14bc6446a97431009baf0f0d1869fb3e62d5e6f4566b445b828d60b4e23','gcsda':'00304feb73988e4f737b8ed0eacb43b3d6e5d85d537b5a3f66212016d9a8da36'}
          assert hashlib.sha256(asset.read_bytes()).hexdigest()==expected[site]
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(changed)==sorted(allowed), changed
          pathlib.Path('/tmp/founder-kicker-evidence/change.patch').write_text(subprocess.check_output(['git','diff'],text=True))
          pathlib.Path('/tmp/founder-kicker-evidence/baseline.json').write_text(json.dumps({'site':site,'branch':os.environ['BRANCH'],'parent':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'originalImageSha256':expected[site],'changedFiles':changed},indent=2))
          print(site,'SCOPED_KICKER_CHANGE; ORIGINAL_PHOTO_UNCHANGED')
          PY
      - name: Build without modifying dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare real-browser verification
        run: |
          npm install --prefix /tmp/founder-kicker-browser --no-audit --no-fund playwright@1.56.1
          /tmp/founder-kicker-browser/node_modules/.bin/playwright install --with-deps chromium >/tmp/founder-kicker-evidence/browser-install.log 2>&1
          cat > /tmp/verify-founder-kicker.mjs <<'JS'
          import {chromium} from '/tmp/founder-kicker-browser/node_modules/playwright/index.mjs';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const site=process.env.SITE,base=process.env.TEST_BASE,phase=process.env.PHASE,name='CHUANG CHUN HSIANG Ph.D.';
          const routes=site==='stt'?['/eric-chuang','/en/eric-chuang','/ja/eric-chuang','/ko/eric-chuang']:['/founder-chairman','/en/founder-chairman'];
          const imagePath=`/visual-approved/portrait-${site}-20261106-8946x6330-original.png`;
          const expected=site==='stt'?'a1b0d14bc6446a97431009baf0f0d1869fb3e62d5e6f4566b445b828d60b4e23':'00304feb73988e4f737b8ed0eacb43b3d6e5d85d537b5a3f66212016d9a8da36';
          const browser=await chromium.launch({headless:true}),result={site,phase,base,checks:[],failures:0};
          const probe=await browser.newPage();let ready=false;
          for(let attempt=0;attempt<(phase==='live'?36:10);attempt++){
            try{await probe.goto(base+routes[0]+'?kicker-check=20261106-'+attempt,{waitUntil:'domcontentloaded',timeout:30000});await probe.waitForSelector('[data-founder-name-kicker="20261106"]',{timeout:5000});ready=true;break;}
            catch{await new Promise(r=>setTimeout(r,phase==='live'?10000:1000));}
          }
          if(!ready)throw new Error('Requested revision is not available at '+base);
          const photoResponse=await probe.request.get(base+imagePath);
          result.imageSha256=crypto.createHash('sha256').update(await photoResponse.body()).digest('hex');
          if(!photoResponse.ok()||result.imageSha256!==expected)throw new Error('Original photo byte integrity failed');
          await probe.close();
          const styles=['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','color'];
          for(const [width,height] of [[1536,795],[1440,900],[1024,768],[390,844]]){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            const referenceBase=site==='stt'?base:'https://stt-003.vercel.app';
            await page.goto(referenceBase+'/',{waitUntil:'networkidle',timeout:60000});await page.evaluate(()=>document.fonts.ready);
            const homeReference=await page.locator('.cis-hero .cis-kicker').first().evaluate((el,styles)=>{const b=el.getBoundingClientRect(),s=getComputedStyle(el),h=el.closest('section').querySelector('h1').getBoundingClientRect();return {x:b.x,y:b.y,gap:h.y-b.bottom,...Object.fromEntries(styles.map(k=>[k,s[k]]))}},styles);
            for(const route of routes){
              await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});
              await page.locator('.'+site+'-intact-hero__image').evaluate(async img=>{await img.decode();await document.fonts.ready});
              const check=await page.evaluate(({site,name,styles})=>{
                const hero=document.querySelector('.'+site+'-intact-hero'),k=hero.querySelector('[data-founder-name-kicker]'),h=hero.querySelector('h1'),img=hero.querySelector('img'),copy=hero.querySelector('.'+site+'-intact-hero__copy');
                const rect=el=>{const b=el.getBoundingClientRect();return {x:b.x,y:b.y,right:b.right,bottom:b.bottom,width:b.width,height:b.height}};
                const ks=getComputedStyle(k),is=getComputedStyle(img),kr=rect(k),hr=rect(h),ir=rect(img),cr=rect(copy),text=document.body.innerText;
                const nodes=[...hero.querySelectorAll('p,h1')].filter(el=>el.getBoundingClientRect().height>0);let textCollision=false;
                for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=rect(nodes[i]),b=rect(nodes[j]);if(Math.min(a.right,b.right)-Math.max(a.x,b.x)>1&&Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y)>1)textCollision=true;}
                return {name:k.textContent,exactCount:text.split(name).length-1,caseInsensitiveCount:(text.match(/CHUANG\s+CHUN\s+HSIANG\s+Ph\.D\./gi)||[]).length,kickerElements:hero.querySelectorAll('[data-founder-name-kicker]').length,bylineElements:hero.querySelectorAll('.'+site+'-intact-hero__byline').length,lang:k.lang,kickerBeforeHeading:!!(k.compareDocumentPosition(h)&Node.DOCUMENT_POSITION_FOLLOWING),kicker:kr,heading:hr,kickerGap:hr.y-kr.bottom,style:Object.fromEntries(styles.map(key=>[key,ks[key]])),h1:h.textContent,photo:{src:img.getAttribute('src'),naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,...ir,objectFit:is.objectFit,filter:is.filter,transform:is.transform,opacity:is.opacity,clipPath:is.clipPath,maskImage:is.maskImage},textSafe:cr.y>=ir.bottom-1||cr.right<=ir.x+ir.width*.54,textCollision,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1};
              },{site,name,styles});
              check.homeReference=homeReference;
              check.homeStyleMatch=styles.every(key=>check.style[key]===homeReference[key]);
              check.homePositionMatch=width<=760||(Math.abs(check.kicker.x-homeReference.x)<=1&&Math.abs(check.kicker.y-homeReference.y)<=1);
              check.homeGapMatch=Math.abs(check.kickerGap-homeReference.gap)<=1;
              const im=check.photo;
              check.passed=check.name===name&&check.exactCount===1&&check.caseInsensitiveCount===1&&check.kickerElements===1&&check.bylineElements===0&&check.lang==='en'&&check.kickerBeforeHeading&&check.homeGapMatch&&Math.abs(check.kicker.x-check.heading.x)<=1&&check.homeStyleMatch&&check.homePositionMatch&&!check.textCollision&&!check.horizontalOverflow&&check.textSafe&&im.src===imagePath&&im.naturalWidth===8946&&im.naturalHeight===6330&&Math.abs(im.width/im.height-8946/6330)<0.002&&im.objectFit==='contain'&&im.filter==='none'&&im.transform==='none'&&im.opacity==='1'&&im.clipPath==='none'&&im.maskImage==='none';
              result.checks.push({route,width,height,...check});if(!check.passed)result.failures++;
              if(route===routes[0])await page.screenshot({path:`/tmp/founder-kicker-evidence/${phase}-${site}-${width}.png`,fullPage:false});
              console.log(phase,site,route,width,check.passed?'PASS':'FAIL',JSON.stringify({occurrences:check.exactCount,style:check.homeStyleMatch,position:check.homePositionMatch,gap:check.kickerGap,homeGap:homeReference.gap,safe:check.textSafe}));
            }
            await page.close();
          }
          fs.writeFileSync(`/tmp/founder-kicker-evidence/${phase}-${site}.json`,JSON.stringify(result,null,2));await browser.close();
          if(result.failures)throw new Error(result.failures+' founder kicker checks failed');
          JS
      - name: Verify built pages before publication
        env:
          TEST_BASE: http://127.0.0.1:4173
          PHASE: built
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 >/tmp/founder-kicker-evidence/server.log 2>&1 &
          node /tmp/verify-founder-kicker.mjs
      - name: Publish only the verified founder change on its existing branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/GovernedHero.tsx
          if test "$SITE" = gcsda; then git add src/styles/gcsda-founder-intact.css; fi
          git commit -m "Use CHUANG CHUN HSIANG Ph.D. once as homepage-style founder kicker ($SITE)"
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD | tee /tmp/founder-kicker-evidence/published-commit.txt
      - name: Verify the live website and unchanged original photo
        env:
          TEST_BASE: ${{ matrix.live }}
          PHASE: live
        run: node /tmp/verify-founder-kicker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: founder-name-kicker-${{ matrix.site }}-20261106
          path: /tmp/founder-kicker-evidence/
          retention-days: 30
