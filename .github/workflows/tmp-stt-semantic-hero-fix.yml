name: Temporary STT Semantic Hero Fix
on:
  push:
    branches: [fix/stt-distinct-hero-visuals-20260911]
    paths:
      - .github/workflows/tmp-stt-semantic-hero-fix.yml
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact approved semantic originals
        run: |
          set -euo pipefail
          mkdir -p public/visual-bank/stt/primary-semantic
          cp 004.png public/visual-bank/stt/primary-semantic/problems-governance-charter.png
          cp 31.png public/visual-bank/stt/primary-semantic/method-governance-mission.png
          cp 011.png public/visual-bank/stt/primary-semantic/columns-insight-article.png
          cp 012.png public/visual-bank/stt/primary-semantic/publications-stt-press-library.png
          cp 34.png public/visual-bank/stt/primary-semantic/stt-governance-dossiers.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json
          expected={
            'problems-governance-charter.png':'004.png',
            'method-governance-mission.png':'31.png',
            'columns-insight-article.png':'011.png',
            'publications-stt-press-library.png':'012.png',
            'stt-governance-dossiers.png':'34.png',
          }
          report={}
          for target,source in expected.items():
            p=Path('public/visual-bank/stt/primary-semantic')/target
            with Image.open(p) as im:
              im.load()
              if im.size!=(1672,941): raise SystemExit(f'{source} unexpected dimensions: {im.size}')
            src=Path(source)
            if hashlib.sha256(p.read_bytes()).digest()!=hashlib.sha256(src.read_bytes()).digest(): raise SystemExit(f'{source} byte mismatch')
            report[target]={'source':source,'dimensions':[1672,941],'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'exactOriginalBytes':True}
          Path('public/data/stt-primary-semantic-manifest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Wire five topics to five different approved visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/FullBleedHero.tsx'); s=p.read_text()
          s=s.replace('const ROOT = "/visual-bank/stt/hero-hires/";','const ROOT = "/visual-bank/stt/primary-semantic/";')
          replacements={
            'label: "你正在面對什麼", image: "problems.png",':'label: "你正在面對什麼", image: "problems-governance-charter.png",',
            'label: "如何判讀", image: "stt.png",':'label: "如何判讀", image: "method-governance-mission.png",',
            'label: "專欄判讀", image: "columns.png",':'label: "專欄判讀", image: "columns-insight-article.png",',
            'label: "出版研究", image: "publications.png",':'label: "出版研究", image: "publications-stt-press-library.png",',
            'label: "關於 STT", image: "stt-portrait.png",':'label: "關於 STT", image: "stt-governance-dossiers.png",',
          }
          for a,b in replacements.items():
            if a not in s: raise SystemExit('expected component mapping not found: '+a)
            s=s.replace(a,b)
          import re
          s=re.sub(r'const HERO_DIMENSIONS: Record<PrimaryTheme, \[number, number\]> = \{.*?\};',
                   'const HERO_DIMENSIONS: Record<PrimaryTheme, [number, number]> = { problems:[1672,941], method:[1672,941], columns:[1672,941], publications:[1672,941], stt:[1672,941] };',s,count=1)
          p.write_text(s)

          p=Path('src/styles/stt-fullbleed.css'); s=p.read_text()
          new_media='''.stt-full-hero__media{position:absolute;inset:0;z-index:-2;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 clamp(24px,4vw,72px) 0 0;pointer-events:none}\n.stt-full-hero__media img{position:relative;display:block;width:min(57vw,820px);height:auto;max-width:820px;max-height:74vh;object-fit:contain;object-position:center;filter:none!important;opacity:1!important;image-rendering:auto}\n.stt-full-hero__veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.995) 30%,rgba(255,255,255,.91) 41%,rgba(255,255,255,.46) 52%,rgba(255,255,255,0) 65%);pointer-events:none}\n'''
          s=re.sub(r'\.stt-full-hero__media\{.*?(?=\.stt-full-hero__inner)',new_media,s,count=1,flags=re.S)
          desktop='''@media(max-width:1050px){\n .stt-full-hero__copy{width:58%;max-width:590px}.stt-full-hero__inner{padding:70px 30px 96px}\n .stt-full-hero__media{padding-right:24px}.stt-full-hero__media img{width:min(61vw,760px);max-width:760px;max-height:66vh}\n .stt-full-hero__veil{background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.98) 38%,rgba(255,255,255,.72) 51%,rgba(255,255,255,.08) 70%,rgba(255,255,255,0) 78%)}\n .stt-foundations__grid{grid-template-columns:repeat(2,minmax(0,1fr))}\n}\n'''
          s=re.sub(r'@media\(max-width:1050px\)\{.*?(?=@media\(max-width:700px\))',desktop,s,count=1,flags=re.S)
          mobile='''@media(max-width:700px){\n .stt-full-hero{min-height:760px;align-items:flex-start}\n .stt-full-hero__inner{padding:56px 24px 320px}.stt-full-hero__copy{width:100%;max-width:none}\n .stt-full-hero__media{align-items:flex-end;justify-content:center;padding:0 14px 24px}.stt-full-hero__media img{width:min(92vw,720px);max-width:720px;max-height:310px;object-fit:contain;object-position:center bottom}\n .stt-full-hero__veil{background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.99) 49%,rgba(255,255,255,.78) 62%,rgba(255,255,255,.14) 82%,rgba(255,255,255,0) 100%)}\n .stt-full-hero__actions{gap:10px;margin-top:26px}.stt-full-hero__actions a{min-height:46px;padding:10px 16px;gap:10px}\n .stt-full-hero__meta{margin-top:18px}.stt-foundations,.stt-roles{padding-top:52px}\n .stt-editorial-wrap{padding:0 24px}.stt-roles__grid{grid-template-columns:1fr;gap:24px}.stt-foundations__grid{grid-template-columns:1fr;gap:0}\n .stt-method-intro{padding-top:36px}.stt-golden-path ol{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 0}\n}\n'''
          s=re.sub(r'@media\(max-width:700px\)\{.*?(?=@media\(prefers-reduced-motion:reduce\))',mobile,s,count=1,flags=re.S)
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Browser verify actual visual use and existing actions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix /tmp/stt-browser --no-save playwright
          npm run preview -- --host 127.0.0.1 > /tmp/stt-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          (async()=>{
            const {chromium}=await import('/tmp/stt-browser/node_modules/playwright/index.mjs');
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const ctx=await browser.newContext({viewport:{width:1440,height:960},deviceScaleFactor:2,reducedMotion:'reduce'});
            const page=await ctx.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            fs.mkdirSync('semantic-evidence',{recursive:true});
            const expected={
              '/problems':['problems','problems-governance-charter.png'],
              '/how-stt-works':['method','method-governance-mission.png'],
              '/insights':['columns','columns-insight-article.png'],
              '/publications':['publications','publications-stt-press-library.png'],
              '/stt':['stt','stt-governance-dossiers.png']
            };
            const hashes=new Map(); const report={routes:[],home:null,errors};
            const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
            for(const [path,[theme,file]] of Object.entries(expected)){
              await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
              const hero=page.locator('[data-stt-primary-hero]'); assert.equal(await hero.count(),1,path+' hero');
              const m=await hero.evaluate(async e=>{const r=e.getBoundingClientRect(),img=e.querySelector('img');await img.decode();const ir=img.getBoundingClientRect(),cs=getComputedStyle(img);return{heroWidth:r.width,heroHeight:r.height,src:img.currentSrc,nw:img.naturalWidth,nh:img.naturalHeight,dw:ir.width,dh:ir.height,fit:cs.objectFit};});
              assert.ok(Math.abs(m.heroWidth-1440)<1); assert.ok(m.heroHeight>=700); assert.equal(m.nw,1672);assert.equal(m.nh,941);assert.ok(m.src.endsWith('/visual-bank/stt/primary-semantic/'+file));assert.equal(m.fit,'contain');assert.ok(m.dw<=836.5,'image exceeds 2x native pixel budget: '+path+' '+m.dw);
              const res=await ctx.request.get(m.src);assert.equal(res.status(),200);const h=hash(await res.body());assert.ok(!hashes.has(h),'duplicate bytes');hashes.set(h,path);
              const hrefs=await page.locator('.stt-full-hero__actions a').evaluateAll(xs=>xs.map(x=>x.getAttribute('href')));for(const href of hrefs){if(href.startsWith('#'))assert.equal(await page.locator(href).count(),1,path+' missing '+href);else assert.equal((await ctx.request.get('http://127.0.0.1:4173'+href)).status(),200,path+' '+href);}
              report.routes.push({path,theme,...m,sha256:h,actions:hrefs});await page.screenshot({path:'semantic-evidence/'+theme+'.png',fullPage:false});
            }
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});const home=await page.locator('.stth-hero').evaluate(async e=>{const media=e.querySelector('.stth-hero-media');const bg=getComputedStyle(media).backgroundImage;const src=bg.match(/url\(["']?(.*?)["']?\)/)?.[1]||'';const img=new Image();img.src=src;await img.decode();return{src,nw:img.naturalWidth,nh:img.naturalHeight,w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height};});assert.equal(home.nw,3509);assert.equal(home.nh,1975);assert.ok(Math.abs(home.w-1440)<1);const hr=await ctx.request.get(home.src);const hh=hash(await hr.body());assert.ok(!hashes.has(hh));hashes.set(hh,'/');report.home={...home,sha256:hh};assert.equal(hashes.size,6);await page.screenshot({path:'semantic-evidence/home.png',fullPage:false});assert.deepEqual(errors,[]);fs.writeFileSync('semantic-evidence/report.json',JSON.stringify(report,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit verified semantic hero correction
        run: |
          git config user.name "STT Visual Governance"
          git config user.email "actions@users.noreply.github.com"
          git add public/visual-bank/stt/primary-semantic public/data/stt-primary-semantic-manifest.json src/components/FullBleedHero.tsx src/styles/stt-fullbleed.css
          git commit -m "fix: restore five distinct approved semantic visuals without stretching" || exit 0
          git push origin HEAD:fix/stt-distinct-hero-visuals-20260911
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-semantic-hero-evidence
          path: semantic-evidence/
          retention-days: 2
