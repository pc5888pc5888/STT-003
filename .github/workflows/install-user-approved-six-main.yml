name: Install exact user-approved six STT primary visuals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-user-approved-six-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, 'install user-approved STT six') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover the six candidate source artworks with Google Drive aware downloader
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q gdown
          rm -rf .stt-six-incoming public/visual-bank/stt/user-approved-six
          mkdir -p .stt-six-incoming public/visual-bank/stt/user-approved-six
          python - <<'PY'
          import gdown
          ids=[
            '10KSOi6hXWHgVp_aVPBQjv44KqvIYqXwo',
            '1Zp9Fo-IA69d7wEXqqv12Rl1sUYas2_LG',
            '129ROAJ7jJLfk9tJPlv4tsEVOrgStqxxz',
            '1q0s89NySyrt1Mkcrj9vjAolTwLn1M-H1',
            '12hq7Db0438KXN6SHLZ_TG0ge-VNgySck',
            '13Jd4EhgnxRBszfJ-lGUMRDsid2pUWI-m',
          ]
          for i,file_id in enumerate(ids,1):
              out=f'.stt-six-incoming/source-{i}.bin'
              result=gdown.download(id=file_id,output=out,quiet=False)
              if not result:
                  raise SystemExit(f'FAIL download source-{i}')
          PY

      - name: Evidence gate and automatic source-to-page assignment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np, hashlib, itertools, shutil

          targets={
            'home.png':'002900080012001340009024c00178538d1bd30bfa4bd25bda5b2523924a9a4a',
            'problems.png':'e5b6e4c2dc9a5c9bbc89b49bb6123c82f8c0cac48cc5c7cc8ecc9e6dd50ef1c3',
            'method.png':'33a79b0f9f0f9e07f68c76f2f6b7f6b7a6b6a7a2a3e3a2e3bda2c7f2d938fbe1',
            'columns.png':'6288661262187c980d581dc89dc8ad4a1d594d51dd31f21ce612c59c4dcee6e6',
            'publications.png':'1124172c992c99b49e04b604b6ccdcccf49c6c96f006cf1f4797d0b9f0f65e72',
            'about-stt.png':'330327268b06a304e306e50645a00f962f0d3e637e320f8a1da0d224e504e488',
          }
          exact_sha={
            'home.png':'d87b1039a686ad6a92be4eb2aadbc6d32111278ffd59869137e77e939708ff39',
            'problems.png':'964923d0ba8ddc9589fcd8a254d6daca2f71643d2e6702236bff2902d38850c9',
            'method.png':'e64be189148c76ce2dd5b13efba5a9512e2cb003692f87991c95d35322602753',
            'columns.png':'03cc644c1f32e05252ebc4defae7149dd6ddc0a8a36f7965436f0c2dff284417',
            'publications.png':'f8fa16efabc931975e46973aafba97a2e75b733c8836ea06bece490b5d676754',
            'about-stt.png':'6ae927ed6e822b3699005a734b169f7b098cd353fe6c688f381730c41da1d33d',
          }

          def normalize(im):
              im=im.convert('RGBA')
              box=im.getchannel('A').getbbox()
              if box: im=im.crop(box)
              base=Image.new('RGBA',im.size,(255,255,255,255))
              base.alpha_composite(im)
              return base.convert('L')
          def dhash(path,hs=16):
              im=normalize(Image.open(path)).resize((hs+1,hs),Image.Resampling.LANCZOS)
              a=np.asarray(im); d=a[:,1:]>a[:,:-1]
              return int(''.join('1' if x else '0' for x in d.flatten()),2)

          sources=sorted(Path('.stt-six-incoming').glob('source-*.bin'))
          if len(sources)!=6: raise SystemExit('FAIL: did not recover six source files')
          src=[]
          for p in sources:
              try:
                  size=Image.open(p).size
                  h=dhash(p)
              except Exception as e:
                  raise SystemExit(f'FAIL: {p} is not an image: {e}')
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              src.append((p,h,size,digest))
              print('SOURCE',p,'size=',size,'bytes=',p.stat().st_size,'sha256=',digest)

          names=list(targets)
          target_hashes=[int(targets[n],16) for n in names]
          matrix=[]
          for name,t in zip(names,target_hashes):
              row=[(t^h).bit_count() for _,h,_,_ in src]
              matrix.append(row)
              print('DISTANCES',name,row)

          best=None
          for perm in itertools.permutations(range(6)):
              distances=[matrix[i][perm[i]] for i in range(6)]
              score=(max(distances),sum(distances))
              if best is None or score<best[0]: best=(score,perm,distances)
          score,perm,distances=best
          print('BEST_ASSIGNMENT',score,perm,distances)
          if max(distances)>1:
              raise SystemExit(f'FAIL: recovered Drive files are not the six user-approved visuals; best distances={distances}')

          out=Path('public/visual-bank/stt/user-approved-six')
          for i,name in enumerate(names):
              p,h,size,digest=src[perm[i]]
              if size!=(1491,1055): raise SystemExit(f'FAIL native dimensions for {name}: {size}')
              dest=out/name
              shutil.copyfile(p,dest)
              digest2=hashlib.sha256(dest.read_bytes()).hexdigest()
              print('PASS',name,'<=',p,'distance=',distances[i],'exact_sha=',digest2==exact_sha[name],'sha256=',digest2)
          PY

      - name: Wire the six approved sources to the six first-level pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/sttVisuals.ts')
          s=p.read_text(encoding='utf-8')
          replacements={
            'home':'/visual-bank/stt/user-approved-six/home.png',
            'problems':'/visual-bank/stt/user-approved-six/problems.png',
            'method':'/visual-bank/stt/user-approved-six/method.png',
            'columns':'/visual-bank/stt/user-approved-six/columns.png',
            'publications':'/visual-bank/stt/user-approved-six/publications.png',
            'aboutStt':'/visual-bank/stt/user-approved-six/about-stt.png',
          }
          for key,val in replacements.items():
              pat=rf'(^\s*{key}:\s*)"[^"]+"(,\s*$)'
              s2,n=re.subn(pat,rf'\1"{val}"\2',s,count=1,flags=re.M)
              if n!=1: raise SystemExit(f'FAIL mapping for {key}')
              s=s2
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build gate
        run: |
          npm ci
          npm run build

      - name: Commit verified six and mapping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Governance Build'
          git config user.email 'actions@users.noreply.github.com'
          git add public/visual-bank/stt/user-approved-six src/sttVisuals.ts
          git commit -m 'fix: install user-approved STT six [skip ci]'
          git push origin HEAD:main

# retrigger exact approved six 2026-09-15
