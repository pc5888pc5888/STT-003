name: logo-audit
on:
  push:
    branches:
      - rebuild/stt-approved-white-gold-v1
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Compare logo candidates
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          TARGET = int('000000404c006ce062e170006cbb66a322a9b000a673a2736233600002004000', 16)

          def dhash256(path):
              im = Image.open(path).convert('L').resize((17,16), Image.Resampling.LANCZOS)
              px = list(im.getdata())
              v = 0
              for y in range(16):
                  row = px[y*17:(y+1)*17]
                  for x in range(16):
                      v = (v << 1) | int(row[x+1] > row[x])
              return v

          rows=[]
          seen=set()
          for base in [Path('public'), Path('public/images')]:
              if not base.exists():
                  continue
              for p in base.iterdir():
                  if not p.is_file() or p.suffix.lower() not in {'.png','.jpg','.jpeg','.webp'}:
                      continue
                  if str(p) in seen:
                      continue
                  seen.add(str(p))
                  try:
                      with Image.open(p) as im:
                          w,h=im.size
                      d=(dhash256(p)^TARGET).bit_count()
                      rows.append((d,w,h,str(p)))
                  except Exception:
                      pass
          for d,w,h,p in sorted(rows)[:30]:
              print(f'{d:3d}  {w:4d}x{h:<4d}  {p}')
          PY
