name: Audit user-approved logo match already in repo

# 2026-09-13: alpha-cropped comparison against the user-reconfirmed official logo.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-user-logo-existing-match.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find closest existing logo image by visible artwork only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          target=int('9110969095908588831093549dad9dab44574000411058c658c6d8a69ce48110',16)
          def crop_visible(im):
            im=im.convert('RGBA')
            alpha=im.getchannel('A')
            box=alpha.getbbox()
            return im.crop(box) if box else im
          def dhash(p,hs=16):
            im=crop_visible(Image.open(p)).convert('L').resize((hs+1,hs),Image.Resampling.LANCZOS)
            a=np.asarray(im); d=a[:,1:]>a[:,:-1]
            return int(''.join('1' if x else '0' for x in d.flatten()),2)
          rows=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.png','.jpg','.jpeg','.webp'}: continue
            try:
              h=dhash(p); orig=Image.open(p).size
              rows.append(((target^h).bit_count(),str(p),p.stat().st_size,orig))
            except Exception: pass
          for row in sorted(rows)[:30]: print(*row)
          PY
