# retrigger exact six user-approved visuals 2026-09-13
name: Install exact user-approved six STT primary visuals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-user-approved-six-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, 'install exact user-approved STT six') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download only the six exact user-uploaded source artworks
        shell: bash
        run: |
          set -euo pipefail
          root='public/visual-bank/stt/user-approved-six'
          mkdir -p "$root"
          download(){ curl -fL --retry 3 --connect-timeout 20 --max-time 180 "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t" -o "$2"; }
          # The Drive filenames used in an earlier staging attempt were mis-labelled.
          # Here each file is assigned by exact SHA-256 to the page the user explicitly approved.
          download '10KSOi6hXWHgVp_aVPBQjv44KqvIYqXwo' "$root/home.png"
          download '1Zp9Fo-IA69d7wEXqqv12Rl1sUYas2_LG' "$root/problems.png"
          download '129ROAJ7jJLfk9tJPlv4tsEVOrgStqxxz' "$root/method.png"
          download '1q0s89NySyrt1Mkcrj9vjAolTwLn1M-H1' "$root/columns.png"
          download '12hq7Db0438KXN6SHLZ_TG0ge-VNgySck' "$root/publications.png"
          download '13Jd4EhgnxRBszfJ-lGUMRDsid2pUWI-m' "$root/about-stt.png"
      - name: Evidence gate — exact bytes, dimensions, uniqueness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          root=Path('public/visual-bank/stt/user-approved-six')
          expected={
            'home.png':'d87b1039a686ad6a92be4eb2aadbc6d32111278ffd59869137e77e939708ff39',
            'problems.png':'964923d0ba8ddc9589fcd8a254d6daca2f71643d2e6702236bff2902d38850c9',
            'method.png':'e64be189148c76ce2dd5b13efba5a9512e2cb003692f87991c95d35322602753',
            'columns.png':'03cc644c1f32e05252ebc4defae7149dd6ddc0a8a36f7965436f0c2dff284417',
            'publications.png':'f8fa16efabc931975e46973aafba97a2e75b733c8836ea06bece490b5d676754',
            'about-stt.png':'6ae927ed6e822b3699005a734b169f7b098cd353fe6c688f381730c41da1d33d',
          }
          got=[]
          for name,want in expected.items():
              p=root/name
              data=p.read_bytes(); digest=hashlib.sha256(data).hexdigest()
              if digest != want: raise SystemExit(f'FAIL exact bytes {name}: {digest}')
              size=Image.open(p).size
              if size != (1491,1055): raise SystemExit(f'FAIL dimensions {name}: {size}')
              got.append(digest); print('PASS',name,digest,size)
          if len(set(got)) != 6: raise SystemExit('FAIL: six visuals are not unique')
          PY
      - name: Wire the six exact sources to the six first-level pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/sttVisuals.ts')
          s=p.read_text(encoding='utf-8')
          replacements={
            'home':'/visual-bank/stt/user-approved-six/home.png',
            'problems':'/visual-bank/stt/user-approved-six/problems.png',
            'method':'/visual-bank/stt/user-approved-six/method.png',
            'columns':'/visual-bank/stt/user-approved-six/columns.png',
            'publications':'/visual-bank/stt/user-approved-six/publications.png',
            'aboutStt':'/visual-bank/stt/user-approved-six/about-stt.png',
          }
          import re
          for key,val in replacements.items():
              pat=rf'(^\s*{key}:\s*)"[^"]+"(,\s*$)'
              s2,n=re.subn(pat,rf'\1"{val}"\2',s,count=1,flags=re.M)
              if n!=1: raise SystemExit(f'FAIL mapping for {key}')
              s=s2
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build gate
        run: |
          npm ci
          npm run build
      - name: Commit exact six and mapping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Governance Build'
          git config user.email 'actions@users.noreply.github.com'
          git add public/visual-bank/stt/user-approved-six src/sttVisuals.ts
          git commit -m 'fix: install exact user-approved STT six [skip ci]'
          git push origin HEAD:main
