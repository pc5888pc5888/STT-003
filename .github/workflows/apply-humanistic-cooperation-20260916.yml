name: Apply Humanistic and Cooperation production repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-humanistic-cooperation-20260916.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact uploaded Cooperation hero from secured Canva transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/visual-bank/stt/user-approved-cooperation
          URL='https://media.canva.com/v2/image-resize/format:PNG/height:941/quality:100/uri:ifs%3A%2F%2FM%2F8b32cc2d-4e37-44d2-85b9-7ee3245248df/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAAFvZvRP5L1kpXR3PtQ9r-ak2zSPrdMouhlphHQjMo986&exp=1789539112&osig=AAAAAAAAAAAAAAAAAAAAAKYuHjksTtgJF54MJ2ZUaJoGnRjt25SqyFvZeuoeNgfX&signer=media-rpc&x-canva-quality=thumbnail'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 "$URL" -o public/visual-bank/stt/user-approved-cooperation/cooperation-hero-20260916.png
          python -m pip install -q Pillow
          python -c "from PIL import Image; from pathlib import Path; p=Path('public/visual-bank/stt/user-approved-cooperation/cooperation-hero-20260916.png'); im=Image.open(p); assert im.size==(1672,941), im.size; assert p.stat().st_size>300000, p.stat().st_size; print('PASS hero', im.size, p.stat().st_size)"

      - name: Apply deterministic source patches
        run: python scripts/apply_humanistic_cooperation_20260916.py

      - name: Static governance gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "cooperation-hero-20260916.png" src/styles/stt-approved-heroes-20260915.css
          ! grep -Fq 'className="stt-coop-person"' src/pages/Cooperation.tsx
          grep -Fq 'function safeSessionSet(key,value)' public/humanistic-interview/index.html
          grep -Fq 'form="netlify-form"' public/humanistic-interview/index.html
          grep -Fq 'DELIVERY_REJECTED' api/humanistic-submit.ts
          grep -Fq 'serverContentLogging: false' api/humanistic-submit.ts
          echo 'PASS static governance gate'

      - name: Build gate
        run: |
          npm ci
          npm run build

      - name: Commit repaired production sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'STT Governance Build'
          git config user.email 'actions@users.noreply.github.com'
          git add public/visual-bank/stt/user-approved-cooperation/cooperation-hero-20260916.png public/stt-release-humanistic-cooperation-20260916.txt src/pages/Cooperation.tsx src/styles/stt-approved-heroes-20260915.css public/humanistic-interview/index.html api/humanistic-submit.ts docs/HUMANISTIC_PRODUCTION_DELIVERY.md
          git commit -m 'fix: close Humanistic delivery loop and install approved Cooperation hero'
          git push origin HEAD:main

      - name: Wait for Vercel production release
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            marker=$(curl -fsSL https://stt-003.vercel.app/stt-release-humanistic-cooperation-20260916.txt || true)
            if printf '%s' "$marker" | grep -Fq 'STT-COOP-HUMANISTIC-20260916-V2'; then
              echo 'production marker is live'
              exit 0
            fi
            sleep 5
          done
          echo 'Vercel production marker did not become live in time'
          exit 1

      - name: Verify production Humanistic delivery end to end
        shell: bash
        run: |
          set -euo pipefail
          api=$(curl -fsSL https://stt-003.vercel.app/api/humanistic-submit)
          echo "$api" | grep -Fq '"resendConfigured":true'
          args=(--data-urlencode 'form-name=humanistic-20q' --data-urlencode 'participant_name=STT Production E2E' --data-urlencode 'consent=accepted')
          for i in $(seq -w 1 20); do args+=(--data-urlencode "q${i}=[STT E2E TEST ${i}]"); done
          response=$(curl -fsS -X POST https://stt-003.vercel.app/api/humanistic-submit -H 'Content-Type: application/x-www-form-urlencoded' "${args[@]}")
          echo "$response"
          echo "$response" | grep -Fq '"ok":true'
          echo "$response" | grep -Fq '"delivery":"resend-email"'
          echo "$response" | grep -Fq '"receiptId":"HUM-'
          echo 'PASS production Humanistic delivery closure'
