<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人文地景產｜20 Questions Journey｜STT Governance</title>
  <style>
    :root{--gold:#a97b42;--ink:#25211c;--line:#e6dccd;--paper:#fffdf9}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    body{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
    .bar{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(18px,4vw,58px);background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);position:relative;z-index:5}
    .home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.02em;padding:10px 18px;border:1px solid var(--gold);border-radius:999px;white-space:nowrap}
    .title{font-family:Georgia,"Noto Serif TC",serif;color:#6d5a42;font-size:14px;letter-spacing:.06em;text-align:right}
    iframe{display:block;width:100%;height:calc(100vh - 68px);border:0;background:white}
    @media(max-width:680px){.bar{height:62px;flex-basis:62px;padding:0 14px}.home{font-size:13px;padding:9px 13px}.title{font-size:11px;max-width:45%}iframe{height:calc(100vh - 62px)}}
  </style>
</head>
<body>
  <header class="bar">
    <a class="home" href="/" aria-label="返回 STT Governance 首頁">← 返回 STT Governance 首頁</a>
    <div class="title">人文地景產｜20 Questions Journey</div>
  </header>
  <iframe src="/humanistic-interview/" title="人文地景產｜20 Questions Journey" allow="clipboard-write"></iframe>
</body>
</html>
