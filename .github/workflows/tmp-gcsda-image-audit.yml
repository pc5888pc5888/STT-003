name: Temporary GCSDA Image Audit
on:
  push:
    branches: [fix/gcsda-food-only-20260911]
    paths: ['.github/workflows/tmp-gcsda-image-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install Pillow
      - name: Inspect existing GCSDA topic bank
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import hashlib,json,math
          root=Path('public/visual-bank/gcsda')
          rows=[]
          for p in sorted(root.glob('*')):
            if not p.is_file(): continue
            try:
              with Image.open(p) as im: im.load(); size=im.size
            except Exception: continue
            rows.append({'path':p.as_posix(),'width':size[0],'height':size[1],'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('gcsda-audit').mkdir(exist_ok=True)
          Path('gcsda-audit/topic-bank.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          tw,th=360,230;cols=2;rh=th+48;sheet=Image.new('RGB',(cols*tw,math.ceil(len(rows)/cols)*rh),'white');d=ImageDraw.Draw(sheet);font=ImageFont.load_default()
          for i,item in enumerate(rows):
            p=Path(item['path']);x=i%cols*tw;y=i//cols*rh
            with Image.open(p) as im:
              im=im.convert('RGB');im.thumbnail((tw-10,th-10));sheet.paste(im,(x+(tw-im.width)//2,y+(th-im.height)//2))
            d.text((x+5,y+th+2),f"{p.name}  {item['width']}x{item['height']}  {item['bytes']} B",fill='black',font=font)
          sheet.save('gcsda-audit/topic-bank.jpg',quality=90)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gcsda-topic-bank-audit
          path: gcsda-audit/
          retention-days: 3
