name: Financial governance nine-article publication QA

on:
  push:
    branches:
      - publish/financial-governance-nine-20261122

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install and build the candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp/financial-governance-qa
          npm ci 2>&1 | tee temp/financial-governance-qa/npm-ci.log
          npm run build 2>&1 | tee temp/financial-governance-qa/build.log
      - name: Install the pinned browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/stt-financial-browser" --no-audit --no-fund --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/stt-financial-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify nine articles at desktop, tablet and mobile sizes
        shell: bash
        env:
          FINANCIAL_QA_PLAYWRIGHT_PATH: ${{ runner.temp }}/stt-financial-browser/node_modules/playwright
        run: |
          set -euo pipefail
          node scripts/qa-financial-governance.mjs 2>&1 | tee temp/financial-governance-qa/browser.log
      - name: Preserve the candidate's verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-governance-publication-qa-${{ github.sha }}
          path: temp/financial-governance-qa/
          if-no-files-found: error
          retention-days: 14
