name: Audit exact user-six visual matches already in repo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-user-six-existing-matches.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find perceptually closest existing repository images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q Pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          targets={
          'home':'002900080012001340009024c00178538d1bd30bfa4bd25bda5b2523924a9a4a',
          'problems':'e5b6e4c2dc9a5c9bbc89b49bb6123c82f8c0cac48cc5c7cc8ecc9e6dd50ef1c3',
          'method':'33a79b0f9f0f9e07f68c76f2f6b7f6b7a6b6a7a2a3e3a2e3bda2c7f2d938fbe1',
          'columns':'6288661262187c980d581dc89dc8ad4a1d594d51dd31f21ce612c59c4dcee6e6',
          'publications':'1124172c992c99b49e04b604b6ccdcccf49c6c96f006cf1f4797d0b9f0f65e72',
          'about':'330327268b06a304e306e50645a00f962f0d3e637e320f8a1da0d224e504e488',
          }
          def dhash(p,hs=16):
            im=Image.open(p).convert('L').resize((hs+1,hs),Image.Resampling.LANCZOS)
            a=np.asarray(im); diff=a[:,1:]>a[:,:-1]
            return int(''.join('1' if x else '0' for x in diff.flatten()),2)
          candidates=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in {'.png','.jpg','.jpeg','.webp'}: continue
            try: candidates.append((p,dhash(p)))
            except Exception: pass
          for name,hx in targets.items():
            t=int(hx,16)
            ranked=sorted((( (t^h).bit_count(), str(p), p.stat().st_size) for p,h in candidates))[:12]
            print('\n###',name)
            for d,p,size in ranked: print(d,size,p)
          PY
