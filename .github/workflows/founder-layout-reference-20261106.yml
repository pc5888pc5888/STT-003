name: Live founder layout verification 20261106
on:
  push:
    branches: [main]
    paths: [.github/workflows/founder-layout-reference-20261106.yml]
permissions:
  contents: read
jobs:
  live-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LAYOUT_PREVIEW: 'false'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run reviewed live checks with the runner browser
        run: |
          python3 - <<'PY'
          import hashlib,subprocess,urllib.request,yaml
          url='https://raw.githubusercontent.com/pc5888pc5888/STT-003/17524b6fd63db8ea4661c17c10259992a890784d/.github/workflows/founder-layout-reference-20261106.yml'
          with urllib.request.urlopen(url,timeout=30) as r:data=r.read()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()=='6048f72f9c833b3de6611bf385d900eb9f2438fd'
          steps=yaml.safe_load(data)['jobs']['inspect-preview']['steps']
          script=next(s['run'] for s in steps if s.get('name')=='Verify scoped founder layout against the actual homepage')
          script='\n'.join(line for line in script.splitlines() if 'playwright install --with-deps chromium' not in line)
          script=script.replace('chromium.launch({headless:true})',"chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']})")
          subprocess.run(['bash','-e','-o','pipefail','-c',script],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: founder-layout-live-20261106
          path: /tmp/layout-evidence/
          retention-days: 30
