name: Probe Canva full asset transfer
on:
  push:
    branches: [fix/stt-final-user-approved-20260913]
    paths: [.github/workflows/probe-canva-full-asset.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe signed Canva source URL variants
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q Pillow requests
          python - <<'PY'
          import requests,io,urllib.parse
          from PIL import Image
          urls={
          'home':'https://media.canva.com/v2/image-resize/format:PNG/height:141/quality:100/uri:ifs%3A%2F%2FM%2Ff582af5e-089e-4af8-8c60-5f9d2251c233/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACgT3eKJrWPmRT2CayNpxJAPlW0IwhGOLCrp-FnYiqfN&exp=1789280169&osig=AAAAAAAAAAAAAAAAAAAAAHslm8N4-GDeMoN8O4IONhjWQjd6MypxHsq8ud8mvabh&signer=media-rpc&x-canva-quality=thumbnail',
          'logo':'https://media.canva.com/v2/image-resize/format:JPG/height:56/quality:75/uri:ifs%3A%2F%2FM%2F89d73305-7a72-400e-85e7-df75ccba3a5c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABTF5OFrDOOGtN3dIlrnpLNKrqnKMRMOPMjP-lGO_7-H&exp=1789280539&osig=AAAAAAAAAAAAAAAAAAAAAEIvgtU0-n3-H-3ugxHrBpUXNozVK1GKS8MUKHOdGtvp&signer=media-rpc&x-canva-quality=thumbnail'}
          for name,u in urls.items():
              p=urllib.parse.urlsplit(u); q=urllib.parse.parse_qs(p.query)
              path=p.path; segs=path.split('/')
              uri_segment=[x for x in segs if x.startswith('uri:')][0]
              csig=q['csig'][0]; exp=q['exp'][0]; osig=q['osig'][0]; signer=q['signer'][0]
              fmt='PNG' if name=='home' else 'JPG'
              base=f'https://media.canva.com/v2/image-resize/format:{fmt}'
              query=f'csig={urllib.parse.quote(csig)}&exp={exp}&osig={urllib.parse.quote(osig)}&signer={signer}&x-canva-quality=thumbnail'
              candidates={
                'thumb':u,
                'same_csig_no_dims':f'{base}/{uri_segment}/watermark:F?{query}',
                'same_csig_width_only':f'{base}/quality:100/{uri_segment}/watermark:F/width:1491?{query}' if name=='home' else f'{base}/quality:100/{uri_segment}/watermark:F/width:884?{query}',
                'same_csig_uri_only':f'{base}/{uri_segment}?{query}',
                'raw_ifs_guess':f'https://media.canva.com/{uri_segment.replace("uri:","")}',
              }
              for kind,url in candidates.items():
                  r=requests.get(url,timeout=30)
                  print(name,kind,'status',r.status_code,'bytes',len(r.content),'ct',r.headers.get('content-type'))
                  if r.ok and r.headers.get('content-type','').startswith('image/'):
                      try: print('dims',Image.open(io.BytesIO(r.content)).size)
                      except Exception as e: print('image-open-error',e)
          PY
