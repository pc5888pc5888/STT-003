name: STT Primary Full-Bleed Landings
on:
  push:
    branches: [rebuild/stt-approved-white-gold-v1]
    paths: ['src/components/FullBleedHero.tsx','src/styles/stt-fullbleed.css','scripts/apply_fullbleed.py','scripts/refine_primary.py','scripts/test_fullbleed.mjs','.github/workflows/stt-primary-landings.yml']
permissions:
  contents: write
concurrency:
  group: stt-primary-fullbleed
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only authorized primary-page edits
        run: |
          set -euo pipefail
          python scripts/apply_fullbleed.py
          python scripts/refine_primary.py
          python - <<'PY'
          from pathlib import Path
          import json,os
          Path('public/data/stt-primary-release.json').write_text(json.dumps({'version':'stt-five-fullbleed-v1','sourceCommit':os.environ['GITHUB_SHA'],'primaryPages':['/problems','/how-stt-works','/insights','/publications','/stt'],'originalArtPreserved':True}))
          PY
      - name: Build and check existing archive behavior
        run: |
          set -euo pipefail
          pip -q install beautifulsoup4==4.13.4
          npm ci
          npm run lint 2>&1 | tee fullbleed-evidence/typescript.txt
          npm run build 2>&1 | tee fullbleed-evidence/build.txt
          python -m unittest discover -s tests -p 'test_mmedia_sync.py' -v 2>&1 | tee fullbleed-evidence/archive-tests.txt
          npx tsx scripts/test_mmedia_api.ts 2>&1 | tee fullbleed-evidence/api-handler-tests.txt
      - name: Prepare browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install -g agent-browser
          npm install --prefix /tmp/stt-browser --no-save playwright
      - name: Verify full-page rendering and interactions
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export AGENT_BROWSER_EXECUTABLE_PATH="$CHROME_PATH"
          npx vite preview --host 127.0.0.1 --port 4173 > fullbleed-evidence/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          agent-browser open http://127.0.0.1:4173/how-stt-works
          agent-browser snapshot -i > fullbleed-evidence/method-interactions.txt
          agent-browser close
          node scripts/test_fullbleed.mjs
      - name: Persist verified application changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          lock=json.loads(Path('fullbleed-evidence/change-lock.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==v for p,v in lock['protectedHashes'].items())
          report=json.loads(Path('fullbleed-evidence/fullbleed-report.json').read_text());assert report['passed'] and len(report['routes'])==15
          allowed={'src/pages/HomeCanonical.tsx','src/pages/Problems.tsx','src/pages/Columns.tsx','src/pages/PublicCore.tsx','src/App.tsx','src/components/FullBleedHero.tsx'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines());assert changed<=allowed,changed-allowed
          subprocess.check_call(['git','add',*sorted(allowed),'public/data/stt-primary-release.json'])
          PY
          git config user.name "STT Verified Primary Pages"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "feat: install five verified full-bleed topic landings and consolidate judgment content"
            git push origin HEAD:rebuild/stt-approved-white-gold-v1
          fi
          git rev-parse HEAD > fullbleed-evidence/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-primary-fullbleed-evidence
          path: fullbleed-evidence/
          retention-days: 14
