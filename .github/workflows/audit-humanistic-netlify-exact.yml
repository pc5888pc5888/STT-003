name: Retire obsolete STT sources once
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-humanistic-netlify-exact.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stt-current-source-cleanup-once
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the owner-authorized, unchanged-baseline removal list
        run: python3 scripts/retire-obsolete-stt-once.py apply
      - name: Build existing website and verify synthetic API contract
        run: |
          set -euo pipefail
          npm ci > qa-current-site-cleanup/npm-ci.log 2>&1
          npm run build 2>&1 | tee qa-current-site-cleanup/build.log
          node --check public/humanistic-interview/interview.js
          node scripts/interview-delivery-api-qa.mjs 2>&1 | tee qa-current-site-cleanup/api-contract.log
      - name: Install open-source test engines on existing standard runner
        run: |
          python3 -m pip install playwright==1.57.0 > qa-current-site-cleanup/playwright-install.log 2>&1
          python3 -m playwright install --with-deps chromium webkit >> qa-current-site-cleanup/playwright-install.log 2>&1
      - name: Chromium synthetic regression, no real email
        env:
          QA_ENGINE: chromium
        run: python3 scripts/interview-delivery-browser-qa.py
      - name: WebKit synthetic regression, no real email
        env:
          QA_ENGINE: webkit
        run: python3 scripts/interview-delivery-browser-qa.py
      - name: Verify all retained source and artwork; remove this one-time tooling
        run: python3 scripts/retire-obsolete-stt-once.py verify
      - name: Commit accepted content cleanup without changing workflow definitions using this token
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          git restore --source=HEAD -- .github/workflows/interview-delivery-acceptance.yml .github/workflows/interview-delivery-live-qa.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/qa/CURRENT-SITE-CLEANUP-20261020.md')
          s=p.read_text().replace('訪談驗收 workflow 改為 contents:read，不再執行遷移腳本或 git push；真實寄信驗證改為手動觸發。此輪清理未寄出真實測試郵件。','訪談驗收 workflow 的唯讀修正與真實寄信測試改為手動觸發，已於本次工作目錄測試，但 runner token 不具 workflows 更新權限，須另由已授權的 GitHub connector 更新；不得在工具確認前宣稱已更新。此輪清理未寄出真實測試郵件。').replace('保留与驗證','保留與驗證')
          p.write_text(s)
          PY
          git add --pathspec-from-file=qa-current-site-cleanup/stage-paths.txt
          git diff --cached --stat | tee qa-current-site-cleanup/committed-stat.txt
          git config user.name 'STT Current Site Cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore: remove 69 obsolete STT sources without changing current page content [mirror-skip]'
          git push origin HEAD:main
          git rev-parse HEAD > qa-current-site-cleanup/cleanup-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-current-site-cleanup-evidence
          path: |
            qa-current-site-cleanup/
            qa-interview/*-results.json
          retention-days: 7
