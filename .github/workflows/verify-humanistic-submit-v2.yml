name: Verify Humanistic submit endpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-humanistic-submit-v2.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production endpoint
        run: |
          set -e
          for i in $(seq 1 24); do
            r=$(curl -fsS https://stt-003.vercel.app/api/humanistic-submit || true)
            echo "$r"
            echo "$r" | grep -q 'fallbackConfigured' && exit 0
            sleep 5
          done
          exit 1
      - name: Submit controlled test
        run: |
          set -e
          r=$(curl -fsS -X POST https://stt-003.vercel.app/api/humanistic-submit \
            -H 'Content-Type: application/json' \
            --data '{"name":"STT系統驗證","company":"STT Governance","email":"pc5888@gmail.com","message":"[SYSTEM TEST] 人文地景產送件鏈路驗證，可忽略。"}')
          echo "$r"
          echo "$r" | grep -q '"ok":true'
