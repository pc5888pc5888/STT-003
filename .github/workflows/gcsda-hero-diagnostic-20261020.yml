name: Current GCSDA image integrity diagnosis
on:
  push:
    branches: [main]
    paths: [.github/workflows/gcsda-hero-diagnostic-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60303eb4370fa0738430af3f78ce171428b56fa4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original bytes and candidate originals without modifying sources
        run: |
          mkdir -p image-evidence
          python -m pip install pillow playwright==1.57.0 > image-evidence/install.log 2>&1
          python -m playwright install --with-deps chromium >> image-evidence/install.log 2>&1
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,struct,hashlib,shutil,subprocess
          out=Path('image-evidence');p=Path('public/visual-bank/gcsda/home-approved.webp');b=p.read_bytes()
          report={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'path':str(p),'actual_bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'magic':b[:4].decode('ascii'),'format':b[8:12].decode('ascii'),'riff_declared_total_bytes':struct.unpack('<I',b[4:8])[0]+8,'chunk_declared_payload_bytes':struct.unpack('<I',b[16:20])[0]}
          try:
            im=Image.open(p);report['header_dimensions']=im.size;im.load();report['full_decode']='PASS'
          except Exception as e:report['full_decode']='FAIL';report['decode_error']=str(e)
          shutil.copyfile(p,out/'current-home-approved.webp')
          candidates=[]
          for p in Path('public').rglob('*'):
            if p.suffix.lower() not in ('.png','.jpg','.jpeg','.webp','.avif'):continue
            if not any(x in str(p).lower() for x in ('gcsda','home','association')):continue
            item={'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
            try:
              im=Image.open(p);item['size']=im.size;im.load();item['full_decode']='PASS'
            except Exception as e:item['full_decode']='FAIL';item['error']=str(e)
            candidates.append(item)
          (out/'original-byte-integrity.json').write_text(json.dumps(report,indent=2));(out/'candidate-originals.json').write_text(json.dumps(candidates,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Verify actual browser decode and untouched source
        run: |
          python - <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from functools import partial
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import threading,json
          server=ThreadingHTTPServer(('127.0.0.1',4173),partial(SimpleHTTPRequestHandler,directory='public'));threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
            b=p.chromium.launch();page=b.new_page();page.goto('http://127.0.0.1:4173/')
            result=page.evaluate('''async()=>{const img=new Image();img.src='/visual-bank/gcsda/home-approved.webp';let error=null;try{await img.decode()}catch(e){error={name:e.name,message:e.message}};return {decode:!error,error,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,complete:img.complete}}''')
            Path('image-evidence/browser-decode.json').write_text(json.dumps(result,indent=2));print(json.dumps(result));b.close()
          server.shutdown()
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsda-image-integrity-evidence
          path: image-evidence/
          retention-days: 7
