name: logo-audit
on:
  push:
    branches:
      - rebuild/stt-approved-white-gold-v1
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Verify exact approved STT logo payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io
          from PIL import Image

          files = [
              'src/assets/stt-logo-exact/chunk00.txt',
              'src/assets/stt-logo-exact/chunk01.txt',
              'src/assets/stt-logo-exact/chunk02.txt',
              'src/assets/stt-logo-exact/chunk03.txt',
              'src/assets/stt-logo-exact/chunk04_05.txt',
              'src/assets/stt-logo-exact/chunk06_07.txt',
              'src/assets/stt-logo-exact/chunk08_09.txt',
              'src/assets/stt-logo-exact/chunk10_11.txt',
              'src/assets/stt-logo-exact/chunk12.txt',
              'src/assets/stt-logo-exact/chunk13.txt',
              'src/assets/stt-logo-exact/chunk14.txt',
              'src/assets/stt-logo-exact/chunk15.txt',
              'src/assets/stt-logo-exact/chunk16.txt',
              'src/assets/stt-logo-exact/chunk17.txt',
          ]
          payload = ''.join(Path(p).read_text().strip() for p in files)
          assert len(payload) == 105220, f'base64 length mismatch: {len(payload)}'
          raw = base64.b64decode(payload, validate=True)
          assert len(raw) == 78914, f'binary length mismatch: {len(raw)}'
          digest = hashlib.sha256(raw).hexdigest()
          expected = '76e8a86218610db60952f1427a90019182225847d7d597a178ad25263b60eefa'
          assert digest == expected, f'sha256 mismatch: {digest}'
          image = Image.open(io.BytesIO(raw))
          assert image.size == (884, 250), f'dimension mismatch: {image.size}'
          image.verify()
          print('STT logo payload PASS', digest, '884x250')
          PY
